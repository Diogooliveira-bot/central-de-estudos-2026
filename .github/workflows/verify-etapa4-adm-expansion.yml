name: Padronização Premium — Administrativo M02–M19

on:
  push:
    branches: [preview/legal-complete-premium-v1-20261025]
    paths:
      - '.github/workflows/verify-etapa4-adm-expansion.yml'
      - 'tests/etapa4-adm-expansion-browser.mjs'
      - 'ui/adm-native-layer.js'
      - 'ui/native-reading-session.js'
      - 'ui/legal-complete-premium-v1.css'
      - 'ui/legal-complete-premium-v1.js'
      - 'content/adm/m*-approved-complete.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bc-etapa4-adm-expansion
  cancel-in-progress: true

jobs:
  chromium:
    if: github.repository == 'Diogooliveira-bot/central-de-estudos-2026'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout branch isolada sem credenciais persistentes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Dependências sem scripts
        run: npm ci --ignore-scripts
      - name: Testes de sintaxe
        run: node --check tests/etapa4-adm-expansion-browser.mjs && node --check ui/adm-native-layer.js
      - name: Regressões do visual protegido
        run: node --test tests/adm-m03-premium-preview-unit.mjs tests/legal-complete-premium-theme-unit.mjs tests/etapa3-premium-pilots-unit.mjs
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Verificar 16 módulos ADM nas três telas
        run: node tests/etapa4-adm-expansion-browser.mjs
      - name: Guardar capturas e relatório do Chromium
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etapa4-adm-m02-m19-chromium
          path: artifacts/etapa4-adm-expansao/*
          if-no-files-found: ignore
          retention-days: 14
