name: Validar convites de alunos

on:
  push:
    branches:
      - feature/convites-alunos-individuais-20261020
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invitation-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Validar sintaxe
        run: |
          node --check lib/invite-handler.js
          node --check api/auth.js
          node --check lib/invites.js
          node --check middleware.js
          node --check tests/invites-unit.mjs
      - name: Testar convites e autenticação
        run: node --test tests/invites-unit.mjs tests/auth-unit.mjs

      - name: Regressão global da Central
        run: npm test
