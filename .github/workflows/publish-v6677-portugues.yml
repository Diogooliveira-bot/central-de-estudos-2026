name: Publicar v6.6.77 - Flashcards Portugues

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_portugues_flashcards.py'
      - 'data/flashcards_portugues_part*.csv'
      - '.github/workflows/publish-v6677-portugues.yml'

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Corrigir ID transportado e aplicar v6.6.77
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_portugues_flashcards.py')
          s = p.read_text(encoding='utf-8')
          old = "'pt-md-a6ff475e78344f07', 'pt-md-59d82762319d0ab6'"
          new = "'pt-md-a6ff475e78344f07', 'pt-md-e6816a3667496ace', 'pt-md-59d82762319d0ab6'"
          if 'pt-md-e6816a3667496ace' not in s:
              assert old in s
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY
          python scripts/apply_portugues_flashcards.py

      - name: Validar versao gerada
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          html = Path('tools/anki.html').read_text(encoding='utf-8')
          marker = 'window.ANKI_SITE_DATA = '
          pos = html.index(marker) + len(marker)
          data, _ = json.JSONDecoder().raw_decode(html[pos:])
          novos = [c for c in data['cards'] if c.get('source') == 'flashcards_portugues_medio_dificil.csv']
          assert data['totalCards'] == 4844
          assert len(novos) == 160
          assert len({c['id'] for c in novos}) == 160
          assert data['version'] == '6.6.77-portugues-flashcards'
          sw = Path('sw.js').read_text(encoding='utf-8')
          assert 'central-v6677' in sw
          assert 'sync-client.js?v=6677' in sw
          print('Validacao OK: 160 cards adicionados, total 4844, PWA v6677.')
          PY

      - name: Publicar arquivos integrados no main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/anki.html sw.js scripts/apply_portugues_flashcards.py
          if git diff --cached --quiet; then
            echo 'Nenhuma alteracao adicional.'
          else
            git commit -m 'Publica v6.6.77 — flashcards de Português [skip ci]'
            git push origin main
          fi
