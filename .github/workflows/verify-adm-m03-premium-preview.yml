name: Validar visual ADM M03 — Preview privada

on:
  push:
    branches:
      - preview/legal-complete-premium-v1-20261025
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bc-adm-m03-visual-tests
  cancel-in-progress: true

jobs:
  verificar:
    if: github.repository == 'Diogooliveira-bot/central-de-estudos-2026'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout isolado da branch de Preview
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Instalar dependências sem scripts
        run: npm ci --ignore-scripts
      - name: Testes gerais
        run: npm test
      - name: Proteção Premium
        run: npm run test:premium-protection
      - name: ADM aprovado, ativador, editor, tabela e PWA
        run: node --test tests/adm-approved-complete-unit.mjs tests/legal-complete-premium-theme-unit.mjs tests/visual-editor-table-unit.mjs tests/pwa-cache-recovery-unit.mjs tests/adm-m03-premium-preview-unit.mjs
      - name: Build estático com proteção de arquivos
        run: npm run build:vercel-output
      - name: Instalar Chromium de testes
        run: npx playwright install --with-deps chromium
      - name: Renderização real em Chromium 390 768 1366
        run: node tests/adm-m03-premium-visual-browser.mjs
      - name: Capturas visuais Chromium (fixture com conteúdo aprovado)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adm-m03-premium-chromium-390-768-1366
          path: artifacts/adm-m03-premium/*.png
          if-no-files-found: ignore
          retention-days: 7
