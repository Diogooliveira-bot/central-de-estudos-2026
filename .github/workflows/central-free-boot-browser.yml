name: Diagnostico navegador aluno gratuito
on:
  pull_request:
    paths:
      - 'tests/central-free-boot-browser.mjs'
      - 'central-free-disciplines.js'
      - 'central-discipline-loader.js'
      - 'lib/protected-content.js'
      - 'tests/helpers/free-plan-content.mjs'
      - 'tests/free-summary-projections.mjs'
      - 'lib/lei-em-dia-questions-handler.js'
      - 'tools/decorando.html'
      - 'central-v119.html'
      - '.github/workflows/central-free-boot-browser.yml'
  workflow_dispatch:
jobs:
  browser-free:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install chromium
      - run: node --check central-structural-v66119/runtime.js
      - run: node --check central-free-disciplines.js
      - run: npm run test:premium-protection
      - run: node tests/free-summary-projections.mjs
      - run: node tests/central-free-boot-browser.mjs
