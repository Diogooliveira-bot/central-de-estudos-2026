name: Etapa 4.4 - diagnostico seguro Lei em Dia e Premium
on:
  push:
    branches:
      - prelaunch/etapa-4-4-20261027
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressao:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout do commit da branch isolada
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Instalar Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Dependencias sem scripts de instalacao
        run: npm ci --ignore-scripts
      - name: Confirmar DNS e porta PostgreSQL a partir do GitHub (sem senha)
        continue-on-error: true
        shell: bash
        run: |
          getent ahostsv4 ep-wild-math-awuoq9pk.c-12.us-east-1.aws.neon.tech >/dev/null
          echo 'NEON_DNS_OK'
          timeout 8 bash -c 'exec 3<>/dev/tcp/ep-wild-math-awuoq9pk.c-12.us-east-1.aws.neon.tech/5432'
          echo 'NEON_TCP_OK'
      - name: Mapear causas e divergencias sem alterar dados
        run: node scripts/diagnose-lei-sync-4-4.mjs
      - name: Diagnosticar sincronizacao do Lei em Dia
        if: always()
        run: npm run test:lei-sync
      - name: Testar integridade catalogo de questoes
        if: always()
        run: node --test tests/lei-em-dia-catalogo-integridade.mjs
      - name: Testar Premium e protecao de gabaritos
        if: always()
        run: npm run test:premium-protection
      - name: Testar Hotmart simulado sem pagamentos reais
        if: always()
        run: npm run test:hotmart-webhook
      - name: Testar inicializacao do plano Gratuito
        if: always()
        run: node --test tests/free-central-boot-unit.mjs
      - name: Testar regressao geral sem banco de producao
        if: always()
        run: npm test
      - name: Testar autenticacao e recuperacao de senha
        if: always()
        run: npm run test:password-reset
      - name: Validar build estatico com arquivos Premium privados
        if: always()
        run: npm run build:vercel-output
