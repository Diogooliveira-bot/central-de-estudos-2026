<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc"><title id="title">Fluxo simplificado de RAG</title><desc id="desc">Diagrama de pergunta, recuperação de documentos, modelo generativo e resposta revisada.</desc><rect width="1600" height="720" fill="#f4f8fc"/><text x="100" y="90" font-family="Arial" font-size="43" font-weight="700" fill="#173a5e">RAG: recuperação para apoiar a geração</text><g font-family="Arial" text-anchor="middle"><g fill="#fff" stroke="#2f6fae" stroke-width="4"><rect x="90" y="260" width="255" height="155" rx="20"/><rect x="470" y="260" width="280" height="155" rx="20"/><rect x="870" y="260" width="280" height="155" rx="20"/><rect x="1270" y="260" width="255" height="155" rx="20"/></g><g fill="#173a5e" font-size="30" font-weight="700"><text x="218" y="325">Pergunta</text><text x="610" y="325">Recuperação</text><text x="1010" y="325">Modelo</text><text x="1398" y="325">Resposta</text></g><g fill="#4a647c" font-size="22"><text x="218" y="366">do usuário</text><text x="610" y="366">trechos relevantes</text><text x="1010" y="366">gera com contexto</text><text x="1398" y="366">a ser verificada</text></g><g stroke="#2aa4b5" stroke-width="7" fill="none"><path d="M345 338h115"/><path d="M750 338h110"/><path d="M1150 338h110"/></g><g fill="#2aa4b5"><path d="M460 325l24 13-24 13z"/><path d="M860 325l24 13-24 13z"/><path d="M1260 325l24 13-24 13z"/></g></g><text x="100" y="585" font-family="Arial" font-size="26" fill="#4a647c">Os documentos recuperados podem melhorar contexto e rastreabilidade, mas não eliminam a necessidade de conferir fontes e conclusões.</text></svg>