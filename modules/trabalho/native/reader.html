<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Direito do Trabalho — Apostila | Base Completa</title>
  <link rel="stylesheet" href="assets/reader.css?v=20261012-apostila-direta-v5">
</head>
<body>
  <div class="app reader-app">
    <main class="reader-main">
      <div class="reader-controls" aria-label="Ferramentas de leitura">
        <span class="reader-control-label">Apostila digital · leitura contínua</span>
        <div class="reader-font-tools">
          <button id="minus" type="button" title="Diminuir fonte" aria-label="Diminuir tamanho da fonte">A−</button>
          <button id="plus" type="button" title="Aumentar fonte" aria-label="Aumentar tamanho da fonte">A+</button>
        </div>
      </div>
      <section id="content" aria-live="polite">
        <p>Preparando sua apostila…</p>
      </section>
      <section class="reader-study-footer" id="studyFooter" aria-label="Progresso e anotações">
        <div class="reader-study-progress">
          <strong>Progresso de leitura</strong>
          <div class="progressline" aria-label="Progresso de leitura" id="progress"><span></span></div>
          <small id="progressText"></small>
        </div>
        <details class="reader-notes" id="readerNotes">
          <summary>Anotações deste módulo</summary>
          <label for="notes">Suas anotações pessoais</label>
          <textarea id="notes" placeholder="Anote os pontos que deseja revisar."></textarea>
          <button id="saveNotes" type="button">Salvar anotação</button>
          <small id="notesStatus" role="status"></small>
        </details>
      </section>
      <footer class="reader-footer">
        Material de pré-homologação jurídica. Os gabaritos e as referências ainda exigem revisão individual antes da publicação definitiva.
      </footer>
      <p class="reader-error" id="readerError" role="alert" hidden></p>
    </main>
  </div>
  <script src="assets/reader.js?v=20261012-apostila-direta-v5" defer></script>
</body>
</html>
