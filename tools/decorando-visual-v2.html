<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1698c4">
<title>BASE COMPLETA · Decorando a Lei Seca</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f6f8}
#decorandoFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f4f6f8}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#f4f6f8;color:#52616a;font:700 14px Inter,system-ui,sans-serif;z-index:5}
#loading div{text-align:center}
#loading b{display:block;color:#1698c4;font-size:20px;margin-bottom:7px}
</style>
</head>
<body>
<div id="loading"><div><b>BASE COMPLETA</b>Carregando o Decorando a Lei Seca…</div></div>
<iframe id="decorandoFrame" src="./decorando.html" title="Decorando a Lei Seca"></iframe>
<script>
(() => {
  const frame=document.getElementById('decorandoFrame');
  const loading=document.getElementById('loading');

  function safeEval(w,code,fallback){
    try{return w.eval(code)}catch(e){return fallback}
  }

  function polish(){
    let doc,w;
    try{doc=frame.contentDocument;w=frame.contentWindow;if(!doc||!doc.body)return}catch(e){return}

    doc.documentElement.setAttribute('data-visual','base-completa-v2');

    doc.querySelectorAll('.brand-mark').forEach(el=>{if(el.textContent.trim()==='LS')el.textContent='BC'});
    doc.querySelectorAll('.filter-topbar .brand > div:last-child').forEach(el=>{
      const strong=el.querySelector('strong'),span=el.querySelector('span');
      if(strong)strong.textContent='Decorando a Lei Seca';
      if(span && !/auditoria/i.test(span.textContent))span.textContent='BASE COMPLETA';
    });
    doc.querySelectorAll('.sidebar-brand > div:nth-child(2)').forEach(el=>{
      const strong=el.querySelector('strong'),span=el.querySelector('span');
      if(strong)strong.textContent='Decorando';
      if(span)span.textContent='BASE COMPLETA';
    });

    const focusCard=doc.querySelector('.exercise-card');
    if(focusCard){
      const host=focusCard.querySelector('.exercise-heading > div:first-child');
      if(host && !host.querySelector('.bcv2-qref')){
        const ref=safeEval(w,'(()=>{const v=visible();const a=v[ui.articleIndex];return a?(a.number||a.question?.source||""):""})()','');
        if(ref){
          const node=doc.createElement('div');
          node.className='bcv2-qref';
          node.textContent=ref;
          const h2=host.querySelector('h2');
          if(h2)host.insertBefore(node,h2); else host.appendChild(node);
        }
      }
    }

    const scrollCards=[...doc.querySelectorAll('.scroll-question-card')];
    if(scrollCards.length){
      const refs=safeEval(w,'(()=>visible().slice(0,ui.scrollLimit).map(a=>a.number||a.question?.source||""))() ',[]);
      scrollCards.forEach((card,i)=>{
        const host=card.querySelector('.exercise-heading > div:first-child');
        if(host && !host.querySelector('.bcv2-qref') && refs[i]){
          const node=doc.createElement('div');
          node.className='bcv2-qref';
          node.textContent=refs[i];
          const h2=host.querySelector('h2');
          if(h2)host.insertBefore(node,h2); else host.appendChild(node);
        }
      });
    }
  }

  frame.addEventListener('load',()=>{
    try{
      const doc=frame.contentDocument;
      const link=doc.createElement('link');
      link.rel='stylesheet';
      link.href='./decorando-visual-v2.css?v=2';
      link.id='base-completa-visual-v2';
      doc.head.appendChild(link);
      const observer=new MutationObserver(()=>requestAnimationFrame(polish));
      observer.observe(doc.body,{childList:true,subtree:true});
      polish();
      loading.style.display='none';
    }catch(e){
      loading.innerHTML='<div><b>BASE COMPLETA</b>Não foi possível carregar a prévia.</div>';
    }
  });
})();
</script>
</body>
</html>
