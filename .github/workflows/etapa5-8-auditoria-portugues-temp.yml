name: Etapa 5.8 - Inspecao curso Portugues
on:
  push:
    branches:
      - feature/trt8-2026-tecnico-administrativo
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Localizar atribuicao do catalogo de Portugues
        shell: bash
        run: |
          git grep -n -I -F 'CentralPortugueseCourse' -- '*.js' '*.html' | head -n 30 || true
          git grep -n -I -F 'portugues-autodidata-data.txt' -- '*.js' '*.html' | head -n 25 || true
      - name: Extrair indice do curso atual
        shell: bash
        run: |
          python - <<'PY'
          import json,gzip,base64
          from pathlib import Path
          content=Path('portugues-autodidata-data.txt').read_text().strip()
          decoded=gzip.decompress(base64.b64decode(content)).decode('utf-8')
          data=json.loads(decoded)
          print("TYPE",type(data).__name__,"TOP_LEVEL", list(data)[:30] if isinstance(data,dict) else len(data))
          print('SOURCE_COUNT',len(data))
          for key,val in data.items():
            if key == 'review':
              print('REVIEW',type(val).__name__,str(val)[:240])
              continue
            print('MODULE',json.dumps({'key':key,'kind':type(val).__name__,'sample':str(val)[:390]},ensure_ascii=False))
          PY
