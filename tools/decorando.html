.backdrop { display: none; }

/* Visual enxuto: superfícies planas, pouco contraste e apenas um tom de ação. */
:root {
  --ink: #252a27;
  --muted: #747a76;
  --green: #3f5e53;
  --paper: #f7f7f5;
  --line: #dedfdb;
}

html, body { background: var(--paper); }

.filter-page,
.compact-filter-page,
.audit-page { background: var(--paper); }

.filter-topbar {
  min-height: 66px;
  padding: 12px clamp(20px, 4vw, 48px);
  border-color: var(--line);
  background: #fff;
}

.brand { gap: 10px; }
.brand-mark {
  width: 34px;
  height: 34px;
  border-radius: 5px;
  background: #3f5e53;
  font-family: var(--font-ui), sans-serif;
  font-size: 11px;
}
.brand strong {
  font-family: var(--font-ui), sans-serif;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0;
}
.brand span { color: #858a86; font-size: 8px; letter-spacing: .08em; }

.header-action,
.theme-toggle,
.topbar-audit {
  border-color: #d9dbd7;
  border-radius: 5px;
  background: #fff;
  color: #59635e;
  box-shadow: none;
}

.compact-filter-content { max-width: 960px; padding: 38px 24px 56px; }
.compact-filter-heading { margin-bottom: 18px; }
.compact-filter-heading > span { display: none; }
.compact-filter-heading h1,
.audit-heading h1 {
  margin: 0 0 6px;
  font-family: var(--font-ui), sans-serif;
  font-size: clamp(24px, 3vw, 31px);
  font-weight: 650;
  letter-spacing: -.025em;
}
.compact-filter-heading p,
.audit-heading p { color: var(--muted); font-size: 11px; }

.selection-card {
  border-color: var(--line);
  border-radius: 8px;
  box-shadow: none;
}
.selection-section { padding: 20px 22px; border-color: #e7e8e4; }
.selection-label { margin-bottom: 13px; }
.selection-label > span {
  width: 23px;
  height: 23px;
  border: 1px solid #d9ddda;
  border-radius: 4px;
  background: transparent;
  color: #5f6d66;
  font-size: 9px;
}
.selection-label strong { font-size: 11px; }
.selection-label small { color: #8c918d; font-size: 8px; }

.discipline-choice,
.topic-choice-grid > button,
.subtopic-chips button,
.initial-status-options button,
.preference-grid > div,
.preference-grid button {
  border-color: #dedfdb;
  border-radius: 6px;
  background: #fff;
  box-shadow: none;
}
.discipline-choice { border-color: #c9d2ce; background: #f7f9f8; color: #344a42; }
.law-badge { border-radius: 5px; }
.topic-choice-grid > button { min-height: 57px; }
.topic-choice-grid > button > span { border-radius: 4px; }
.topic-choice-grid > button.selected,
.subtopic-chips button.selected,
.initial-status-options button.selected,
.preference-grid button.selected {
  border-color: #6f887f;
  background: #f7f9f8;
  color: #314b42;
}
.initial-status-options button.selected b {
  background: #e7ece9;
  color: #314b42;
}
.preference-grid > div { padding: 11px; }
.preference-grid button { color: #666d69; }

.compact-start {
  padding: 17px 22px;
  border-top: 0;
  background: #fff;
}
.compact-start strong { font-family: var(--font-ui), sans-serif; font-size: 18px; }
.compact-start > button,
.audit-heading > button,
.empty-status button {
  border-radius: 5px;
  background: #3f5e53;
  box-shadow: none;
}

.audit-content { max-width: 1080px; padding-top: 38px; }
.metric-grid article,
.audit-panel {
  border-color: var(--line);
  border-radius: 7px;
  box-shadow: none;
}
.metric-grid article.accent { border-color: #9aaba4; background: #fff; }
.metric-grid strong { font-family: var(--font-ui), sans-serif; font-size: 25px; }

.app-shell { grid-template-columns: 238px 1fr; }
.sidebar {
  padding: 20px 16px 18px;
  border-color: var(--line);
  background: #f2f2ef;
}
.sidebar .brand { margin: 0 5px 20px; }
.search-box {
  height: 38px;
  border-color: #d9dad6;
  border-radius: 5px;
  background: #fff;
}
.search-box input { font-size: 11px; }
.nav-label { margin-top: 22px; color: #8b908c; font-size: 8px; }
.law-nav > button { border-radius: 5px; }
.law-nav > button.active { border: 1px solid #d9dbd7; background: #fff; box-shadow: none; }
.chevron { display: none; }
.sidebar-progress { padding: 13px; border: 1px solid #dedfdb; border-radius: 6px; background: transparent; }

.topbar {
  min-height: 76px;
  padding: 15px clamp(20px, 4vw, 46px);
  border-color: var(--line);
  background: #fff;
}
.topbar h1 { font-family: var(--font-ui), sans-serif; font-size: 20px; font-weight: 650; }
.breadcrumb { font-size: 8px; font-weight: 600; letter-spacing: .04em; }
.daily-goal { padding-left: 22px; }

.study-grid,
.study-grid.question-first { max-width: 1120px; gap: 16px; padding-top: 26px; }
.study-grid.question-first { max-width: 930px; grid-template-columns: minmax(0, 1fr); }
.exercise-card,
.history-card,
.scroll-question-card,
.history-toggle {
  border-color: var(--line);
  border-radius: 7px;
  background: #fff;
  box-shadow: none;
}
.exercise-card { min-height: 520px; padding: 31px 34px 21px; }
.exercise-heading { padding-bottom: 18px; }
.exercise-heading h2 {
  margin-top: 6px;
  font-family: var(--font-ui), sans-serif;
  font-size: 17px;
  font-weight: 650;
  letter-spacing: 0;
}
.eyebrow,
.question-number { color: #65756f; font-size: 8px; letter-spacing: .11em; }
.question-meta { color: #7b817d; font-size: 8px; }
.question-type,
.question-actions > button {
  border: 1px solid #dcddda;
  border-radius: 5px;
  background: #fff;
  color: #666d69;
}
.question-actions > button.delete-action { border-color: #e1d6d4; color: #815a56; }
.main-statement { margin: 35px 0 31px; font-size: clamp(19px, 1.8vw, 24px); line-height: 1.62; }
.answer-buttons button {
  border-color: #d8dad6;
  border-radius: 5px;
  background: #fff;
  color: #434a46;
  box-shadow: none;
}
.answer-buttons button:hover,
.answer-buttons button.chosen { border-color: #587267; background: #f5f8f6; color: #314b42; }
.feedback { border-radius: 5px; }
.legal-basis { border-color: #dedfdb; border-radius: 6px; background: #f8f8f6; }
.article-header h2 { font-family: var(--font-ui), sans-serif; font-size: 23px; }
.importance select { border-radius: 5px; background: #fff; }
.history-toggle { padding: 13px; }
.scroll-study { max-width: 900px; }
.scroll-intro,
.scroll-load-more { border-radius: 6px; background: #f5f6f4; box-shadow: none; }
.scroll-question-card { padding: 28px 30px 22px; }
.delete-toast { border-radius: 6px; box-shadow: 0 8px 20px rgba(23,29,26,.14); }

[data-theme="dark"] {

function renderMarkedText(id,scope,raw,legal=false){

function selectionHost(node){
  const element=node?.nodeType===Node.ELEMENT_NODE?node:node?.parentElement;

function highlightToolbar(){
  let bar=document.getElementById('lei-selection-toolbar');
  if(bar)return bar;
  bar=document.createElement('div');bar.id='lei-selection-toolbar';bar.hidden=true;
  bar.setAttribute('role','toolbar');bar.setAttribute('aria-label','Destacar texto selecionado');
  bar.innerHTML='<span>Destacar</span><button type="button" data-color="yellow" aria-label="Amarelo"></button><button type="button" data-color="green" aria-label="Verde"></button><button type="button" data-color="blue" aria-label="Azul"></button><button type="button" data-color="pink" aria-label="Rosa"></button><button type="button" data-remove="1">Remover</button><button type="button" data-cancel="1" aria-label="Fechar">×</button>';
  bar.addEventListener('mousedown',event=>event.preventDefault());
  bar.addEventListener('click',event=>{
    const button=event.target.closest('button');if(!button)return;
    if(button.dataset.cancel){pendingTextSelection=null;bar.hidden=true;return}
    applyTextHighlight(button.dataset.remove?'remove':button.dataset.color);
  });

}
function captureTextSelection(){
  const selection=window.getSelection();
  if(!selection||selection.isCollapsed||!selection.toString().trim())return;
  const range=selection.getRangeAt(0),host=selectionHost(range.startContainer);
  if(!host||host!==selectionHost(range.endContainer)||!host.isConnected)return;
  const before=range.cloneRange();before.selectNodeContents(host);before.setEnd(range.startContainer,range.startOffset);
  const start=before.toString().length,end=start+range.toString().length;
  if(start===end)return;
  pendingTextSelection={id:host.dataset.highlightId,scope:host.dataset.highlightScope,start,end};
  const bar=highlightToolbar(),rect=range.getBoundingClientRect();
  bar.hidden=false;
  bar.style.left=Math.max(8,Math.min(rect.left,window.innerWidth-bar.offsetWidth-8))+'px';
  bar.style.top=Math.max(8,Math.min(rect.top>bar.offsetHeight+12?rect.top-bar.offsetHeight-8:rect.bottom+8,window.innerHeight-bar.offsetHeight-8))+'px';
}
function applyTextHighlight(action){
  const chosen=pendingTextSelection;if(!chosen)return;
  const {id,scope,start,end}=chosen;
  const bucket=saved.textHighlights[id]||{},current=Array.isArray(bucket[scope])?bucket[scope]:[];
  const next=[];
  for(const r of current){
    if(!r||!Number.isInteger(r.start)||!Number.isInteger(r.end)||!HIGHLIGHT_COLORS.includes(r.color))continue;
    if(r.end<=start||r.start>=end){next.push(r);continue}
    if(r.start<start)next.push({...r,end:start});
    if(r.end>end)next.push({...r,start:end});
  }
  if(action!=='remove'&&HIGHLIGHT_COLORS.includes(action))next.push({start,end,color:action});
  bucket[scope]=next.sort((a,b)=>a.start-b.start);saved.textHighlights[id]=bucket;
  pendingTextSelection=null;window.getSelection()?.removeAllRanges();save();render();
}

  if(field==="sub"){const pool=ui.selectedTopics.size?base.filter(a=>ui.selectedTopics.has(a.topicId)):base;const tl={};disciplineTopics().forEach(t=>tl[t.id]=t.label);pool.forEach(a=>add(a.subtopic,a.subtopic,{group:tl[a.topicId]||""}));return [...m.values()]}
  if(field==="bank"){base.forEach(a=>add(qcBank(a),qcBank(a)));return [...m.values()].sort((x,y)=>y.n-x.n)}
  if(field==="year"){base.forEach(a=>add(qcYear(a),qcYear(a)));return [...m.values()].sort((x,y)=>(y.key==="Sem ano"?-1:0)-(x.key==="Sem ano"?-1:0)||String(y.key).localeCompare(String(x.key)))}

function qcPopover(f){
  const F=QC_FIELDS[f];let opts;

  const q=(ui.ddQuery||"").trim().toLowerCase();
  const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const nq=norm(q);
  let list=nq?opts.filter(o=>norm(o.label).includes(nq)):opts;
  const total=list.length,CAP=250;if(list.length>CAP)list=list.slice(0,CAP);
  const sel=f==="disc"?new Set(ui.discPicked?[currentDiscipline().id]:[]):F.set();

    const g=o.group&&o.group!==lastG?(lastG=o.group,`<div class="qc-group">${esc(o.group)}</div>`):"";

    return g+`<button class="qc-opt ${on?"on":""}" onclick="qcPick('${f}','${qcEsc(o.key)}')">${lead}<span class="qc-opt-label">${esc(o.label)}${o.sub?`<small>${esc(o.sub)}</small>`:""}</span><em>${o.n}</em></button>`;
  }).join("");
  return `<div class="qc-backdrop" onclick="qcClose()"></div>
  <div class="qc-pop" role="dialog" aria-label="${F.label}">
    <div class="qc-pop-head"><strong>${F.label}</strong><button onclick="qcClose()" aria-label="Fechar">✕</button></div>
    ${F.search?`<div class="qc-search"><input id="qc-search" type="search" placeholder="Buscar em ${F.label.toLowerCase()}…" value="${esc(ui.ddQuery||"")}" oninput="qcSearch(this.value)" autocomplete="off"></div>`:""}
    <div class="qc-list" id="qc-list">${rows||`<div class="compact-empty">Nada encontrado.</div>`}${total>CAP?`<div class="qc-more">Mostrando ${CAP} de ${total}. Refine a busca.</div>`:""}</div>
    ${f!=="disc"?`<div class="qc-pop-foot"><button onclick="qcClearField('${f}')" ${sel.size?"":"disabled"}>Limpar</button><button class="primary" onclick="qcClose()">Concluir${sel.size?` (${sel.size})`:""}</button></div>`:""}
  </div>`;
}

function renderAudit(){
  const attempts=auditAttempts(),correct=attempts.filter(a=>a.correct).length,accuracy=attempts.length?Math.round(correct/attempts.length*100):0;
  const allList=allActiveAll(),seenAll=allList.filter(a=>hasAttempts(a.id)).length;
  const masteredAll=allList.filter(a=>attemptStats(a.id).mastered).length;
  const dayMap={};attempts.forEach(a=>{const k=dateOnly(a.date);dayMap[k]||={total:0,correct:0,latest:a.date};dayMap[k].total++;if(a.correct)dayMap[k].correct++;if(a.date>dayMap[k].latest)dayMap[k].latest=a.date});
  const days=Object.entries(dayMap).map(([date,d])=>({date,...d})).sort((a,b)=>b.latest.localeCompare(a.latest));
  const avg=days.length?(attempts.length/days.length).toFixed(1).replace(".",","):"0";
  const recent=[...attempts].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);
  const deleted=DATA.filter(a=>saved.deleted[a.id]);
  const lawStats=Object.values(DISCIPLINES).map(d=>{const at=auditAttempts(d.id),ok=at.filter(x=>x.correct).length;return {...d,total:at.length,accuracy:at.length?Math.round(ok/at.length*100):0}});

      <section class="audit-panel"><div class="audit-panel-title"><div><strong>Desempenho por lei</strong><small>Todas as tentativas</small></div></div><div class="law-stat-list">${lawStats.map(x=>`<div><span class="law-badge" style="background:${x.color}">${x.badge}</span><p><strong>${esc(x.law)}</strong><small>${x.total} questões respondidas</small></p><b>${x.accuracy}%</b></div>`).join('')}</div></section>
      <section class="audit-panel recent-panel"><div class="audit-panel-title"><div><strong>Atividade recente</strong><small>Últimas 10 respostas</small></div></div>${recent.length?`<div class="recent-list">${recent.map(a=>{const d=DISCIPLINES[a.article.discipline]||DISCIPLINES.cf;return `<div><span class="result-dot ${a.correct?"correct":"wrong"}"></span><p><strong>${d.badge} · ${esc(a.article.number)}</strong><small>${a.correct?"Acertou":"Errou"} — ${a.choice?"marcou Certo":"marcou Errado"}</small></p><time>${fmtDate(a.date)}</time></div>`}).join("")}</div>`:`<div class="audit-empty">Nenhuma atividade registrada.</div>`}</section>
      <section class="audit-panel deleted-panel"><div class="audit-panel-title"><div><strong>Questões excluídas</strong><small>Podem ser restauradas</small></div><b>${deleted.length}</b></div>${deleted.length?`<div class="deleted-list">${deleted.map(a=>{const d=DISCIPLINES[a.discipline]||DISCIPLINES.cf;return `<div><p><strong>${d.badge} · ${esc(a.number)}</strong><small>${esc(a.title)}</small></p><button onclick="restoreQuestion('${a.id}')">Restaurar</button></div>`}).join("")}</div>`:`<div class="audit-empty">Nenhuma questão excluída.</div>`}</section>
    </div>
  </section></main>`
}

function centralOpenTopic(topicId,direct){

  saved.preferences.discipline=discipline;save();
  const topics=disciplineTopics();

  ui.selectedTopics=new Set(target?[target.id]:[]);

}
