<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Português M7 — Correlação Verbal e Vozes Verbais</title>
<style>
:root{--bg:#f7f7f3;--card:#fffefb;--line:#e1e3de;--text:#24282f;--muted:#75808f;--accent:#315fc8;--soft:#f2f3ef;--good:#237d4b;--warn:#865d14}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1000px;margin:auto;padding:22px 18px 70px}.top,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px}.top h1{margin:0 0 6px;font-size:24px}.top p{margin:6px 0}.muted{color:var(--muted)}.progress{height:8px;background:#e8eae6;border-radius:99px;overflow:hidden;margin-top:14px}.progress span{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}.tab{padding:11px 12px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;text-align:left;font-weight:750;cursor:pointer}.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}.panel{display:none}.panel.active{display:block}.session{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:9px 0;overflow:hidden}.session summary{cursor:pointer;padding:15px 16px;font-weight:800;list-style:none}.session summary::-webkit-details-marker{display:none}.session summary:after{content:'›';float:right;color:var(--muted);font-size:20px;transition:.15s}.session[open] summary:after{transform:rotate(90deg)}.body{padding:5px 16px 18px;border-top:1px solid #ecece8;line-height:1.62}.body h3{margin:18px 0 7px;font-size:17px}.body p{margin:8px 0}.body table{width:100%;border-collapse:collapse;margin:12px 0;font-size:14px}.body th,.body td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}.body ol,.body ul{line-height:1.65}.trap,.exam,.remember,.warning{padding:11px 12px;border-radius:10px;margin:12px 0;background:var(--soft);border-left:3px solid #8993a0}.exam{border-left-color:var(--accent)}.remember{border-left-color:var(--good)}.warning,.trap{border-left-color:#c18b24}.check{display:flex;gap:8px;align-items:flex-start;margin-top:16px;padding-top:12px;border-top:1px dashed #d7dad5;font-weight:650}.check input{margin-top:3px}.quiz{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;background:#fbfbf8}.quiz p{margin:0 0 10px}.answer{display:none;margin-top:10px;padding:10px;border-radius:8px;background:#edf5ef;color:#234e34}.answer.show{display:block}.show-answer,.card button,.tec-open{padding:8px 11px;border:1px solid #d3d7d1;border-radius:8px;background:#fff;color:var(--text);font-weight:700;cursor:pointer}input,select,textarea{font:inherit;max-width:100%;padding:9px;border:1px solid #d4d8d2;border-radius:8px;background:#fff;color:var(--text)}textarea{width:100%;min-height:100px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:700}.round-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.round-box{padding:12px;border:1px solid var(--line);border-radius:10px;background:#fafaf7}.round-box input{width:100%}.review-prompts{line-height:1.65}.review-prompts li{margin:6px 0}.error-item{border-top:1px solid var(--line);padding:12px 0}.error-item:first-child{margin-top:12px}.error-item p{white-space:pre-wrap}.status{margin-top:8px;color:var(--muted);font-size:12px}.tec-box{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:13px;border:1px solid var(--line);border-radius:10px;background:#fafaf7}.tec-open{background:var(--accent);border-color:var(--accent);color:#fff}@media(max-width:720px){.wrap{padding:14px 11px 54px}.top h1{font-size:20px}.tabs{grid-template-columns:1fr 1fr}.body{padding:4px 12px 16px}.body table{font-size:12px;display:block;overflow:auto}.form-grid,.round-grid{grid-template-columns:1fr}.session summary{padding:13px}.tab{font-size:12px}.tec-box{display:block}.tec-open{width:100%;margin-top:10px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><h1>M7 — Correlação Verbal e Vozes Verbais</h1><p class="muted">Teoria revisada em duas passagens, com método de resolução e foco em FCC/TJ-CE.</p><div class="progress"><span id="bar"></span></div><p><b id="pct">0%</b> da leitura concluída · <span id="readCount">0 de 7 sessões</span></p></div>
<div class="tabs"><button class="tab active" data-tab="theory">Teoria · 7 sessões</button><button class="tab" data-tab="review">Revisão ativa</button><button class="tab" data-tab="rounds">R1 · R2 · Final</button><button class="tab" data-tab="spaced">24h · 7d · 30d</button><button class="tab" data-tab="errors">Caderno de erros</button><button class="tab" data-tab="tec">TEC</button></div>
<section id="theory" class="panel active"><div id="m7Theory"></div></section>
<section id="review" class="panel"><div class="card"><h2>Revisão ativa</h2><div id="m7Review"></div></div></section>
<section id="rounds" class="panel"><div class="card"><h2>R1 · R2 · Final</h2><div id="m7Rounds"></div></div></section>
<section id="spaced" class="panel"><div class="card"><h2>Revisões espaçadas</h2><div id="m7Spaced"></div></div></section>
<section id="errors" class="panel"><div class="card"><h2>Caderno de erros</h2><div id="m7Errors"></div></div></section>
<section id="tec" class="panel"><div class="card"><h2>TEC</h2><div id="m7Tec"></div></div></section>
</div>
<script src="portugues-m7-content-v1.js"></script>
<script src="portugues-m7-content-v2.js"></script>
<script src="portugues-m7-content-v3.js"></script>
<script src="portugues-m7-runtime-v1.js"></script>
</body>
</html>
