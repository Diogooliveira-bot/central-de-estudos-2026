<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc"><title id="title">Rede local conectada à internet</title><desc id="desc">Diagrama de uma rede com computadores, ponto de acesso, switch, roteador e internet.</desc><rect width="1600" height="800" fill="#f4f8fc"/><text x="100" y="90" font-family="Arial" font-size="43" font-weight="700" fill="#173a5e">Exemplo de rede: funções dos equipamentos</text><g stroke="#7fa5bf" stroke-width="7" fill="none"><path d="M240 355H570"/><path d="M240 590H570"/><path d="M640 240V520"/><path d="M710 380H930"/><path d="M1000 380H1210"/><path d="M1280 380H1430"/></g><g font-family="Arial" text-anchor="middle"><g><rect x="100" y="290" width="140" height="120" rx="18" fill="#fff" stroke="#2aa4b5" stroke-width="4"/><text x="170" y="355" font-size="28" fill="#173a5e">PC</text><text x="170" y="388" font-size="21" fill="#4a647c">Ethernet</text></g><g><rect x="100" y="525" width="140" height="120" rx="18" fill="#fff" stroke="#2aa4b5" stroke-width="4"/><text x="170" y="590" font-size="28" fill="#173a5e">Notebook</text><text x="170" y="623" font-size="21" fill="#4a647c">Wi‑Fi</text></g><g><rect x="570" y="315" width="140" height="130" rx="18" fill="#def6f7" stroke="#2aa4b5" stroke-width="4"/><text x="640" y="370" font-size="28" fill="#173a5e">Switch</text><text x="640" y="404" font-size="21" fill="#4a647c">quadros/MAC</text></g><g><rect x="930" y="315" width="140" height="130" rx="18" fill="#dcecff" stroke="#2f6fae" stroke-width="4"/><text x="1000" y="370" font-size="28" fill="#173a5e">Roteador</text><text x="1000" y="404" font-size="21" fill="#4a647c">pacotes/IP</text></g><g><rect x="1210" y="315" width="140" height="130" rx="18" fill="#fff1ce" stroke="#d98d1f" stroke-width="4"/><text x="1280" y="370" font-size="28" fill="#173a5e">Modem</text><text x="1280" y="404" font-size="21" fill="#4a647c">acesso</text></g><g><rect x="1430" y="315" width="120" height="130" rx="65" fill="#eff3f8" stroke="#4a647c" stroke-width="4"/><text x="1490" y="370" font-size="27" fill="#173a5e">Internet</text></g></g><g font-family="Arial" font-size="25" fill="#4a647c"><text x="100" y="735">Em equipamentos domésticos, modem, roteador, firewall, switch e ponto de acesso podem estar integrados em uma única caixa.</text></g></svg>