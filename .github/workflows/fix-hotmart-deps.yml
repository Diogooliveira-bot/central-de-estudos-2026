name: Corrigir vulnerabilidades na versão isolada Hotmart
on:
  push:
    branches:
      - feature/hotmart-ativacao-automatica-20261025
permissions:
  contents: write
jobs:
  dependency-safety:
    if: "github.ref == 'refs/heads/feature/hotmart-ativacao-automatica-20261025' && contains(github.event.head_commit.message, '[dependency-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Fixar versões corrigidas na branch de testes
        run: |
          npm pkg set "dependencies.nodemailer=^10.1.4"
          npm pkg set "overrides.zod=^4.6.6"
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=high
      - name: Rodar testes existentes e de pagamento
        run: |
          npm run test:hotmart-webhook
          npm run test:premium-and-auth
          npm test
          npm run build:vercel-output
      - name: Registrar correção apenas na branch Hotmart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: atualizar dependências vulneráveis para teste Hotmart"
            git push origin HEAD:refs/heads/feature/hotmart-ativacao-automatica-20261025
          fi
