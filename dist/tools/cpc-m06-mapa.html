<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CPC M06 — Mapa Mental</title><style>
:root{--navy:#083565;--ink:#102b4e;--bg:#f5f7fb;--line:#dbe5ef;--muted:#63758a;--shadow:0 18px 55px rgba(15,43,78,.13)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg)}body{padding:18px}.wrap{max-width:1160px;margin:auto}.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}.top h1{font-size:clamp(22px,3.5vw,38px);margin:0}.top p{margin:4px 0 0;color:var(--muted);font-size:13px}.top .spacer{flex:1}
button{border:0;border-radius:12px;background:var(--navy);color:#fff;padding:10px 14px;font-weight:800;cursor:pointer}.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.stage{position:relative;display:flex;align-items:center;justify-content:center;min-height:72vh;background:#e9eff7;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.viewport{width:100%;padding:22px;display:flex;align-items:center;justify-content:center}.slide{display:none;width:min(900px,calc(100vw - 120px));min-height:600px}.slide.active{display:flex}.card{width:100%;background:var(--soft,#fff);border-radius:28px;overflow:hidden;box-shadow:0 18px 50px rgba(13,40,76,.15);display:flex;flex-direction:column;border:1px solid rgba(8,53,101,.12)}.head{display:flex;align-items:center;gap:16px;padding:24px 28px 18px}.num{width:58px;height:58px;flex:0 0 58px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:27px;font-weight:950;background:var(--accent,#2088d8)}.title{font-size:clamp(24px,3vw,40px);line-height:1;font-weight:950;color:#0d315d;text-transform:uppercase}.icon{margin-left:auto;font-size:38px}.body{padding:2px 28px 28px;font-size:clamp(17px,2vw,23px);line-height:1.3}.body ul{margin:8px 0 0;padding-left:28px}.body li{margin:9px 0}.box{margin-top:20px;padding:18px 20px;border:2px solid color-mix(in srgb,var(--accent) 55%,#fff);border-radius:18px;background:rgba(255,255,255,.65)}.box b{display:block;font-size:18px;text-transform:uppercase;margin-bottom:7px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini{padding:14px;border-radius:14px;background:rgba(255,255,255,.72);border:1px solid rgba(13,49,93,.14)}.mini b{font-size:13px;text-transform:uppercase}.nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;padding:0;border-radius:50%;font-size:27px;display:grid;place-items:center}.prev{left:12px}.next{right:12px}.foot{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}.foot .info{flex:1}.foot b{display:block;font-size:17px}.foot small{color:var(--muted)}.progress{width:190px;height:7px;border-radius:99px;background:#dce5ef;overflow:hidden}.progress i{display:block;height:100%;background:var(--navy)}.dots{display:flex;gap:6px;flex-wrap:wrap}.dot{width:9px;height:9px;border-radius:99px;background:#c3cfde}.dot.on{width:26px;background:var(--navy)}.full{width:min(900px,100%);background:#fff;border-radius:24px;padding:14px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;box-shadow:var(--shadow)}.mini-card{border-radius:14px;padding:12px;background:var(--soft);border:1px solid rgba(13,49,93,.12)}.mini-card b{display:block;color:#0d315d;font-size:14px;text-transform:uppercase;margin-bottom:4px}.mini-card span{font-size:10px;line-height:1.35;display:block}
.c1{--accent:#1c9ddd;--soft:#e7f5fc}.c2{--accent:#d59d00;--soft:#fff4d9}.c3{--accent:#36a85d;--soft:#e8f7ec}.c4{--accent:#ef7159;--soft:#feebe7}.c5{--accent:#8052d0;--soft:#f0eafb}.c6{--accent:#14a68d;--soft:#e7f8f4}.c7{--accent:#ed476f;--soft:#fdeaf0}.c8{--accent:#2088d8;--soft:#e8f4fc}.c9{--accent:#d29b00;--soft:#fff4d9}
@media(max-width:720px){body{padding:10px}.stage{min-height:70vh}.viewport{padding:10px 6px}.slide{width:calc(100vw - 42px);min-height:67vh}.card{min-height:67vh;border-radius:20px}.head{padding:18px 17px 12px;gap:10px}.num{width:45px;height:45px;flex-basis:45px;font-size:22px}.title{font-size:24px}.icon{font-size:28px}.body{padding:0 17px 20px;font-size:17px}.cols{grid-template-columns:1fr}.nav{width:40px;height:40px}.prev{left:4px}.next{right:4px}.progress{width:110px}.full{grid-template-columns:1fr}}
body.preview{padding:0;background:transparent;overflow:hidden}body.preview .top,body.preview .nav,body.preview .foot{display:none!important}body.preview .stage{min-height:0;height:100vh;border:0;border-radius:0;box-shadow:none;background:transparent}body.preview .viewport{padding:0}body.preview .slide{width:100%;min-height:100vh}body.preview .card{border-radius:20px;box-shadow:none;min-height:100vh}body.preview .body{font-size:17px}
</style></head><body><div class="wrap"><div class="top"><div><h1>CPC M06 — Mapa Mental</h1><p>Juiz, auxiliares da justiça, Ministério Público, Advocacia Pública e Defensoria Pública</p></div><div class="spacer"></div><button class="ghost" onclick="go(0)">↺ Início</button></div><div class="stage" id="stage"><button class="nav prev" onclick="move(-1)">‹</button><div class="viewport" id="viewport"></div><button class="nav next" onclick="move(1)">›</button></div><div class="foot"><div class="info"><b id="label"></b><small>Deslize para o lado ou use as setas.</small></div><div class="progress"><i id="bar"></i></div><div class="dots" id="dots"></div></div></div><script>
const D=[
{c:'c1',n:1,t:'Visão geral',i:'💡',items:['Arts. 139–148: juiz, poderes, responsabilidade e imparcialidade.','Arts. 149–175: auxiliares da justiça.','Arts. 176–181: Ministério Público.','Arts. 182–184: Advocacia Pública.','Arts. 185–187: Defensoria Pública.'],box:['Regra de bolso','JUIZ → IMPARCIALIDADE → AUXILIARES → MP → FAZENDA → DEFENSORIA']},
{c:'c2',n:2,t:'Juiz',i:'⚖️',items:['Art. 139 concentra os principais poderes-deveres.','Pode adotar medidas indutivas, coercitivas, mandamentais e sub-rogatórias.','Medidas atípicas exigem fundamentação, contraditório, proporcionalidade e adequação.','Art. 140 veda o non liquet.','Art. 141 limita o julgamento ao pedido e à causa de pedir.'],box:['Atenção','Art. 139, IV, não autoriza restrições automáticas ou punitivas.']},
{c:'c3',n:3,t:'Impedimento e suspeição',i:'🚫',items:['Impedimento = causas objetivas e mais graves.','Suspeição = causas subjetivas/pessoais.','Art. 146: arguição em 15 dias da ciência do fato.','Se o juiz não reconhece, apresenta razões em 15 dias e remete ao tribunal.','Art. 144, VIII, não deve ser tratado como hipótese vigente isolada.'],box:['Não confundir','Impedimento e suspeição possuem fundamentos e consequências diferentes.']},
{c:'c4',n:4,t:'Auxiliares',i:'🧰',items:['Art. 149 traz rol exemplificativo.','Oficial de justiça cumpre diligências, mandados e pode avaliar quando cabível.','Perito atua quando há conhecimento técnico/científico.','Intérprete/tradutor auxilia na compreensão necessária ao processo.','Depositário/administrador guarda e conserva bens.'],box:['Perito','Escusa: 15 dias. Informação inverídica por dolo ou culpa: danos + inabilitação de 2 a 5 anos.']},
{c:'c5',n:5,t:'Conciliação e mediação',i:'🤝',items:['Art. 166: independência, imparcialidade, autonomia, confidencialidade, oralidade, informalidade e decisão informada.','Conciliador pode sugerir soluções, preferencialmente sem vínculo anterior.','Mediador facilita comunicação, preferencialmente quando há vínculo anterior.','Após atuar, impedimento por 1 ano para assessorar, representar ou patrocinar as partes.'],box:['Pegadinha','A diferença conciliador x mediador é preferencial, não absoluta.']},
{c:'c6',n:6,t:'Ministério Público',i:'🏛️',items:['Pode atuar como parte ou fiscal da ordem jurídica.','Art. 178: interesse público/social, incapaz e litígios coletivos possessórios.','Fazenda Pública, sozinha, não obriga intervenção do MP.','Como fiscal, pode produzir prova, requerer medidas e recorrer.','Prazo em dobro + intimação pessoal, salvo prazo próprio expresso.'],box:['Prazo-chave','Art. 178 traz 30 dias para intervenção como fiscal; não vira automaticamente 60.']},
{c:'c7',n:7,t:'Advocacia Pública',i:'🏢',items:['Art. 183: União, Estados, DF, Municípios, autarquias e fundações de direito público têm prazo em dobro.','Termo inicial: intimação pessoal.','Prazo próprio expresso afasta a dobra.','Empresa pública e sociedade de economia mista não recebem automaticamente a prerrogativa.'],box:['Exemplo','Impugnação do art. 535 = 30 dias próprios, sem dobra pelo art. 183.']},
{c:'c8',n:8,t:'Defensoria Pública',i:'🛡️',items:['Prazo em dobro + intimação pessoal do defensor.','Prazo próprio expresso afasta a dobra.','Juiz pode intimar pessoalmente o assistido quando providência depender apenas dele.','Curadoria especial é exercida pela Defensoria nas hipóteses legais.','Honorários sucumbenciais são admitidos inclusive contra ente de vinculação, segundo orientação atual.'],box:['Não confundir','Intimação pessoal do defensor inicia prazo; intimação pessoal do assistido serve para ato ou informação que só ele pode fornecer.']},
{c:'c9',n:9,t:'Você precisa lembrar',i:'✅',items:['139 = poderes-deveres.','140 = non liquet proibido.','144/145 = impedimento e suspeição.','146 = incidente em 15 dias.','149 = auxiliares.','178–180 = MP.','183 = Fazenda.','186 = Defensoria.','10 · 15 · 30 · 2–5 anos · 1 ano = números de prova.'],box:['Mini macete','MP + FAZENDA + DEFENSORIA = DOBRO + PESSOAL + EXCEÇÃO DO PRAZO PRÓPRIO']}
]
let idx=0;const preview=new URLSearchParams(location.search).get('preview')==='1';if(preview)document.body.classList.add('preview');
function e(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function card(d){let body;if(d.custom){body='<div class="body"><div class="cols"><div class="mini"><b>Absoluta × relativa</b><p>Absoluta não prorroga; relativa pode prorrogar.</p></div><div class="mini"><b>Conexão × continência</b><p>Conexão: pedido ou causa em comum. Continência: mesmas partes + mesma causa + pedido abrangente.</p></div><div class="mini"><b>Perpetuatio × prevenção</b><p>Art. 43 estabiliza competência; art. 59 define o juízo prevento.</p></div><div class="mini"><b>Incompetência × conflito</b><p>Incompetência é vício do juízo; conflito é divergência concreta entre órgãos jurisdicionais.</p></div></div></div>'}else{body='<div class="body"><ul>'+d.items.map(x=>'<li>'+e(x)+'</li>').join('')+'</ul><div class="box"><b>'+e(d.box[0])+'</b>'+e(d.box[1])+'</div></div>'}return '<article class="card '+d.c+'"><div class="head"><span class="num">'+d.n+'</span><span class="title">'+e(d.t)+'</span><span class="icon">'+d.i+'</span></div>'+body+'</article>'}
function full(){return '<div class="full">'+D.map(d=>'<div class="mini-card '+d.c+'"><b>'+d.n+' — '+e(d.t)+'</b><span>'+(d.items?e(d.items.slice(0,3).join(' • ')):'Absoluta × relativa • conexão × continência • perpetuatio × prevenção')+'</span></div>').join('')+'</div>'}
function render(){document.getElementById('viewport').innerHTML='<div class="slide active">'+(idx<D.length?card(D[idx]):full())+'</div>';document.getElementById('label').textContent=idx<D.length?(D[idx].n+' — '+D[idx].t):'Mapa completo — CPC M06';document.getElementById('bar').style.width=((idx+1)/(D.length+1)*100)+'%';[...document.querySelectorAll('.dot')].forEach((d,i)=>d.classList.toggle('on',i===idx));if(!preview&&idx===D.length){try{parent.postMessage({type:'cpc-map-complete',module:'w6'},location.origin)}catch(_){}}if(preview&&idx!==0){idx=0;render()}}
function move(n){idx=(idx+n+D.length+1)%(D.length+1);render()}function go(n){idx=n;render()}const dots=document.getElementById('dots');for(let i=0;i<D.length+1;i++){const d=document.createElement('span');d.className='dot';d.onclick=()=>{idx=i;render()};dots.appendChild(d)}let sx=0,sy=0;document.getElementById('stage').addEventListener('touchstart',ev=>{sx=ev.touches[0].clientX;sy=ev.touches[0].clientY},{passive:true});document.getElementById('stage').addEventListener('touchend',ev=>{const dx=ev.changedTouches[0].clientX-sx,dy=ev.changedTouches[0].clientY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.2)move(dx<0?1:-1)},{passive:true});document.addEventListener('keydown',ev=>{if(ev.key==='ArrowRight')move(1);if(ev.key==='ArrowLeft')move(-1)});render();
</script></body></html>
