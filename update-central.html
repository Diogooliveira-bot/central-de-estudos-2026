<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atualizar Central</title><style>body{font-family:system-ui;background:#f4f7fb;color:#182033;display:grid;place-items:center;min-height:100vh;margin:0;padding:20px}.box{background:#fff;border:1px solid #dfe5ee;border-radius:18px;padding:24px;max-width:460px;width:100%;box-shadow:0 12px 40px #0001;text-align:center}h1{font-size:22px;margin:0 0 10px}p{line-height:1.5;color:#64748b}.ok{color:#15803d;font-weight:700}</style></head><body><div class="box"><h1>Atualizando a Central…</h1><p id="msg">Removendo somente o cache antigo da aplicação. Seu progresso e seus cartões serão preservados.</p></div><script>(async()=>{const msg=document.getElementById('msg');try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister().catch(()=>false)))}if(window.caches){const keys=await caches.keys();await Promise.all(keys.filter(k=>/^central-/i.test(k)).map(k=>caches.delete(k)))}msg.className='ok';msg.textContent='Atualização concluída. Abrindo o Anki atualizado…';setTimeout(()=>location.replace('/tools/anki.html?central_fresh=6683-'+Date.now()),700)}catch(e){msg.textContent='Não foi possível limpar o cache automaticamente. Recarregue esta página e tente novamente.'}})();</script></body></html>
