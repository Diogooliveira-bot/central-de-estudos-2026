name: Validar convites de alunos

on:
  push:
    branches:
      - feature/convites-alunos-individuais-20261020
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invitation-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configurar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Validar sintaxe
        run: |
          node --check lib/invite-handler.js
          node --check api/auth.js
          node --check lib/invites.js
          node --check middleware.js
          node --check tests/invites-unit.mjs
      - name: Testar convites e autenticação
        run: node --test tests/invites-unit.mjs tests/auth-unit.mjs

      - name: Regressão global da Central
        run: npm test
