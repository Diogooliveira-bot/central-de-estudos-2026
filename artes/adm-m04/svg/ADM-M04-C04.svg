b477f" stroke-width="4"/><rect x="489" y="435" width="454" height="68" rx="34" fill="url(#center)"/><g transform="translate(540 445)" fill="none" stroke="#063c78" stroke-width="4" stroke-linejoin="round"><path d="M4 8c11-5 19-4 26 1v34c-7-5-15-6-26-1zM56 8c-11-5-19-4-26 1v34c7-5 15-6 26-1z"/><path d="M11 15h12M11 22h12M37 15h12M37 22h12" stroke-width="3" stroke-linecap="round"/></g><text x="742" y="482" text-anchor="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="42" font-weight="700" fill="#062b5c"><tspan x="742" dy="0.0">Ponto central</tspan></text><text x="416" y="550" text-anchor="start" font-family="Liberation Sans,Arial,sans-serif" font-size="31" font-weight="400" fill="#090d14"><tspan x="416" dy="0.0">O poder disciplinar permite apurar infrações</tspan><tspan x="416" dy="36.0">e aplicar sanções a quem mantém vínculo</tspan><tspan x="416" dy="36.0">especial com a Administração.</tspan></text><rect x="616" y="728" width="5" height="71" rx="3" fill="#0b477f"/><rect x="28" y="805" width="578" height="220" rx="29" fill="url(#card)" stroke="#19afe0" stroke-width="3"/><path d="M196 825v180" stroke="#1eb6e2" stroke-width="4"/><g transform="translate(56 850)" aria-label="clipboard"><title>clipboard</title><circle cx="55" cy="55" r="53" fill="#073d78"/><g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="27" y="20" width="47" height="65" rx="5"/><path d="M39 20v-6h23v6M36 41h28M36 52h28M36 63h15m7 10 7 7 13-16"/></g></g><rect x="211" y="823" width="311.3" height="38" rx="20" fill="#ffd442"/><text x="224" y="853" text-anchor="start" font-family="Liberation Sans,Arial,sans-serif" font-size="29" font-weight="700" fill="#12110e"><tspan x="224" dy="0.0">Quem pode alcançar</tspan></text><text x="211" y="887" text-anchor="start" font-family="Liberation Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#111419"><tspan x="211" dy="0.0">Servidores e particulares sujeitos a</tspan><tspan x="211" dy="27.8">vínculo jurídico especial com o</tspan><tspan x="211" dy="27.8">Poder Público.</tspan></text><rect x="623" y="805" width="578" height="220" rx="29" fill="url(#card)" stroke="#19afe0" stroke-width="3"/><path d="M791 825v180" stroke="#1eb6e2" stroke-width="4"/><g transform="translate(651 850)" aria-label="federal-law"><title>federal-law</title><circle cx="55" cy="55" r="53" fill="#073d78"/><g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 25c14-7 25-5 30 2 5-7 16-9 30-2v51c-14-7-25-5-30 2-5-7-16-9-30-2zM50 27v51M28 38h14m-14 9h14m16-9h14m-14 9h14"/></g></g><rect x="806" y="823" width="159.8" height="38" rx="20" fill="#ffd442"/><text x="819" y="853" text-anchor="start" font-family="Liberation Sans,Arial,sans-serif" font-size="29" font-weight="700" fill="#12110e"><tspan x="819" dy="0.0">Apuração</tspan></text><text x="806" y="887" text-anchor="start" font-family="Liberation Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#111419"><tspan x="806" dy="0.0">A Administração verifica os fatos e</tspan><tspan x="806" dy="27.8">aplica a consequência prevista no</tspan><tspan x="806" dy="27.8">regime jurídico.</tspan></text><rect x="28" y="1048" width="578" height="220" rx="29" fill="url(#card)" stroke="#19afe0" stroke-width="3"/><path d="M196 1068v180" stroke="#1eb6e2" stroke-width="4"/><g transform="translate(56 1093)" aria-label="court"><title>court</title><circle cx="55" cy="55" r="53" fill="#073d78"/><g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M50 17 15 32h70L50 17zM22 39h56M25 42v31m16-31v31m18-31v31m16-31v31M19 77h62M14 85h72"/></g></g><rect x="211" y="1066" width="159.8" height="38" rx="20" fill="#ffd442"/><text x="224" y="1096" text-anchor="start" font-family="Liberation Sans,Arial,sans-serif" font-size="29" font-weight="700" fill="#12110e"><tspan x="224" dy="0.0">Garantias</tspan></text><text x="211" y="1130" text-anchor="start" font-family="Liberation Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#111419"><tspan x="211" dy="0.0">Processo, contraditório e ampla</tspan><tspan x="211" dy="27.8">defesa devem ser respeitados</tspan><tspan x="211" dy="27.8">quando cabíveis.</tspan></text><rect x="623" y="1048" width="578" height="220" rx="29" fill="url(#card)" stroke="#19afe0" stroke-width="3"/><path d="M791 1068v180" stroke="#1eb6e2" stroke-width="4"/><g transform="translate(651 1093)" aria-label="statute-trap"><title>statute-trap</title><circle cx="55" cy="55" r="53" fill="#073d78"/><g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M50 16 87 81H13z"/><path d="M50 38v21m0 11v1" stroke="#fff" stroke-width="7"/></g></g><rect x="806" y="1066" width="301.6" height="38" rx="20" fill="#ffd442"/><text x="819" y="1096" text-anchor="start" font-family="Liberation Sans,Arial,sans-serif" font-size="29" font-weight="700" fill="#12110e"><tspan x="819" dy="0.0">Pegadinha de prova</tspan></text><text x="806" y="1130" text-anchor="start" font-family="Liberation Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#111419"><tspan x="806" dy="0.0">Poder disciplinar depende de</tspan><tspan x="806" dy="27.8">vínculo especial; polícia</tspan><tspan x="806" dy="27.8">administrativa pode atingir</tspan><tspan x="806" dy="27.8">particulares em geral.</tspan></text><rect x="19" y="1308" width="1191" height="211" rx="48" fill="url(#tip)"/><path d="M19 1356a48 48 0 0 1 48-48h314v211H67a48 48 0 0 1-48-48z" fill="url(#navy)"/><g transform="translate(68 1379)" fill="none" stroke="#ffd829" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 4a19 19 0 0 0-11 34c3 3 5 7 5 11h20c0-4 2-8 5-11A19 19 0 0 0 17 4z"/><path d="M12 54h20M15 61h14M17 14v12M17 33v1" stroke="#fff" stroke-width="4"/></g><text x="247" y="1406" text-anchor="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="41" font-weight="700" fill="#fff"><tspan x="2