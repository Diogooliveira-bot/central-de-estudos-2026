name: Administrativo — revisão didática M01–M10
on:
  pull_request:
    paths:
      - 'content/adm/adm-review-didactic-*.js'
      - 'ui/adm-apostila-reading-v1.js'
      - 'tests/adm-review-didactic-v2-unit.mjs'
      - 'tests/adm-review-didactic-m11-m20-unit.mjs'
      - 'tests/adm-review-all-m01-m20-unit.mjs'
      - 'package.json'
      - '.github/workflows/adm-didatico-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adm-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:adm-didatico
