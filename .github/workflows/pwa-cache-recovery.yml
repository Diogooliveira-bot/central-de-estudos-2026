name: PWA cache recovery tests
on:
  pull_request:
    paths:
      - sw.js
      - tests/pwa-cache-recovery-unit.mjs
      - package.json
  push:
    branches: [main]
    paths:
      - sw.js
      - tests/pwa-cache-recovery-unit.mjs
      - package.json

permissions:
  contents: read

jobs:
  pwa-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --test tests/pwa-cache-recovery-unit.mjs
