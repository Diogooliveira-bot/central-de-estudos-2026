name: Civil — leitura única
on:
  pull_request:
    paths:
      - 'content/civil/civil-teoria-guiada-reader-v1.js'
      - 'central-v119.html'
      - 'tests/civil-teoria-guiada-unit.mjs'
      - 'tests/civil-leitura-unica-unit.mjs'
      - '.github/workflows/civil-leitura-unica.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validar leitura única de Direito Civil e estabilidade das disciplinas
        run: node --test tests/civil-leitura-unica-unit.mjs tests/civil-teoria-guiada-unit.mjs tests/civil-standardization-unit.mjs
