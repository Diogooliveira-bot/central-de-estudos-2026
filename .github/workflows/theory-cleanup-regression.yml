name: Teoria — limpeza de questões e referências
on:
  pull_request:
    branches: [main]
    paths:
      - 'ui/old-questions-removed-v1.js'
      - 'ui/cf-native-study-v2.js'
      - 'tests/old-questions-removed-unit.mjs'
      - '.github/workflows/theory-cleanup-regression.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Testes direcionados com conteúdos reais
        run: node --test tests/old-questions-removed-unit.mjs
