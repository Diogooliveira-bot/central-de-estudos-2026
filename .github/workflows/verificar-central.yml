name: Verificar a Central (atualizacao de conteudo)
on:
  pull_request:
  workflow_dispatch:
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Erro de sintaxe, pagina quebrada, arquivo faltando, versoes desencontradas, conteudo mudou sem versao nova.
      - run: git fetch origin main
      - run: node scripts/verificar-central.mjs --base origin/main
