<svg xmlns="http://www.w3.org/2000/svg" width="1229" height="1536" viewBox="0 0 1229 1536">
<defs><linearGradient id="navy" x1="0" x2="1"><stop stop-color="#005399"/><stop offset=".6" stop-color="#073d78"/><stop offset="1" stop-color="#00569d"/></linearGradient><linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#0bc9df"/><stop offset="1" stop-color="#00b8d7"/></linearGradient><linearGradient id="pale" x1="0" x2="1"><stop stop-color="#c2e7fb"/><stop offset="1" stop-color="#c8edff"/></linearGradient><linearGradient id="center" x1="0" x2="1"><stop stop-color="#d0edfa"/><stop offset="1" stop-color="#92d4f0"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f4fcff"/></linearGradient><linearGradient id="tip" x1="0" x2="1"><stop stop-color="#e5f9ff"/><stop offset="1" stop-color="#c6efff"/></linearGradient></defs><rect width="1229" height="1536" fill="#fff"/><image x="160" y="0" width="910" height="172" preserveAspectRatio="xMidYMid meet" href="../template-assets/logo.png"/><image x="0" y="228" width="355" height="580" preserveAspectRatio="xMidYMid meet" href="../template-assets/mascote.png"/><rect x="261" y="176" width="836" height="105" rx="52" fill="#07508a"/><text x="679" y="247" text-anchor="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="66" font-weight="700" fill="#fff"><tspan x="679" dy="0.0">Direito Administrativo</tspan></text><rect x="447" y="266" width="449" height="80" rx="40" fill="url(#cyan)"/><text x="671.5" y="322" text-anchor="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="51" font-weight="700" fill="#041d3a"><tspan x="671.5" dy="0.0">Capítulo 10</tspan></text><rect x="341" y="352" width="845" height="70" rx="35" fill="url(#pale)"/><text x="763.5" y="397" text-anchor="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="36" font-weight="700" fill="#081a32"><tspan x="763.5" dy="0.0">Contagem de prazos e outras regras úteis</tspan></text><rect x="380" y="475" width="676" height="262" rx="34" fill="#fff" stroke="#0b477f" stroke-width="4"/><rect x="489" y="435" width="454" height="68" rx="34" fill="url(#center)"/><g transform="translate(540 445)" fill="none" stroke="#063c78" stroke-width="4" stroke-linejoin="round"><path d="M4 8c11-5 19-4 26 1v34c-7-5-15-6-26-1zM56 8c-11-5-19-4-26 1v34c7-5 15-6 26-1z"/><path d="M11 15h12M11 22h12M37 15h12M37 22h12" stroke-width="3" stroke-linecap="round"/></g><text x="742" y="482" text-anchor="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="42" font-weight="700" fill="#062b5c"><tspan x="742" dy="0.0">Ponto central</tspan></text><text x="416" y="550" text-anchor="start" font-family="Liberation Sans,Arial,sans-serif" font-size="31" font-weight="400" fill="#090d14"><tspan x="416" dy="0.0">Na Lei 9.784/1999, prazos em dias são</tspan><tspan x="416" dy="36.0">contínuos; exclui-se o dia inicial e inclui-se</tspan><tspan x="416" dy="36.0">o vencimento, com exceções expressas.</tspan></text><rect x="616" y="728" width="5" height="71" rx="3" fill="#0b477f"/><rect x="28" y="805" width="578" height="220" rx="29" fill="url(#card)" stroke="#19afe0" stroke-width="3"/><path d="M196 825v180" stroke="#1eb6e2" stroke-width="4"/><g transform="translate(56 850)" aria-label="calendar-law"><title>calendar-law</title><circle cx="55" cy="55" r="53" fill="#073d78"/><g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="18" y="24" width="64" height="58" rx="6"/><path d="M31 16v17m38-17v17M19 42h62M32 57h14m8 0h12m-34 12h14"/></g></g><rect x="211" y="823" width="201.7" height="38" rx="20" fill="#ffd442"/><text x="224" y="853" text-anchor="start" font-family="Liberation Sans,Arial,sans-serif" font-size="29" font-weight="700" fill="#12110e"><tspan x="224" dy="0.0">Marco inicial</tspan></text><text x="211" y="887" text-anchor="start" font-family="Liberation Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#111419"><tspan x="211" dy="0.0">A contagem começa na ciência</tspan><tspan x="211" dy="27.8">oficial; exclui o dia do começo e</tspan><tspan x="211" dy="27.8">inclui o dia do vencimento.</tspan></text><rect x="623" y="805" width="578" height="220" rx="29" fill="url(#card)" stroke="#19afe0" stroke-width="3"/><path d="M791 825v180" stroke="#1eb6e2" stroke-width="4"/><g transform="translate(651 850)" aria-label="age"><title>age</title><circle cx="55" cy="55" r="53" fill="#073d78"/><g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="50" r="35"/><path d="M50 27v25l17 11M21 24l-8-8m66 8 8-8"/></g></g><rect x="806" y="823" width="211.3" height="38" rx="20" fill="#ffd442"/><text x="819" y="853" text-anchor="start" font-family="Liberation Sans,Arial,sans-serif" font-size="29" font-weight="700" fill="#12110e"><tspan x="819" dy="0.0">Dias corridos</tspan></text><text x="806" y="887" text-anchor="start" font-family="Liberation Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#111419"><tspan x="806" dy="0.0">Prazos em dias contam-se</tspan><tspan x="806" dy="27.8">continuamente. Se o vencimento</tspan><tspan x="806" dy="27.8">cair sem expediente, passa ao</tspan><tspan x="806" dy="27.8">próximo dia útil.</tspan></text><rect x="28" y="1048" width="578" height="220" rx="29" fill="url(#card)" stroke="#19afe0" stroke-width="3"/><path d="M196 1068v180" stroke="#1eb6e2" stroke-width="4"/><g transform="translate(56 1093)" aria-label="number-trap"><title>number-trap</title><circle cx="55" cy="55" r="53" fill="#073d78"/><g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="50" r="34"/><text x="50" y="63" text-anchor="middle" font-size="40" font-weight="700" fill="#fff" stroke="none">#</text></g></g><rect x="211" y="1066" width="214.6" height="38" rx="20" fill="#ffd442"/><text x="224" y="1096" text-anchor="start" font-family="Liberation Sans,Arial,sans-serif" font-size="29" font-weight="700" fill="#12110e"><tspan x="224" dy="0.0">Meses e anos</tspan></text><text x="211" y="1130" text-anchor="start" font-family="Liberation Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#111419"><tspan x="211" dy="0.0">Contam-se de data a data; se</tspan><tspan x="211" dy="27.8">faltar dia equivalente no mês final,</tspan><tspan x="211" dy="27.8">considera-se o último dia do mês.</tspan></text><rect x="623" y="1048" width="578" height="220" rx="29" fill="url(#card)" stroke="#19afe0" stroke-width="3"/><path d="M791 1068v180" stroke="#1eb6e2" stroke-width="4"/><g transform="translate(651 1093)" aria-label="statute-trap"><title>statute-trap</title><circle cx="55" cy="55" r="53" fill="#073d78"/><g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M50 16 87 81H13z"/><path d="M50 38v21m0 11v1" stroke="#fff" stroke-width="7"/></g></g><rect x="806" y="1066" width="301.6" height="38" rx="20" fill="#ffd442"/><text x="819" y="1096" text-anchor="start" font-family="Liberation Sans,Arial,sans-serif" font-size="29" font-weight="700" fill="#12110e"><tspan x="819" dy="0.0">Pegadinha de prova</tspan></text><text x="806" y="1130" text-anchor="start" font-family="Liberation Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#111419"><tspan x="806" dy="0.0">Só conte em dias úteis quando a</tspan><tspan x="806" dy="27.8">lei disser isso, como na</tspan><tspan x="806" dy="27.8">antecedência de intimação e em</tspan><tspan x="806" dy="27.8">manifestações específicas.</tspan></text><rect x="19" y="1308" width="1191" height="211" rx="48" fill="url(#tip)"/><path d="M19 1356a48 48 0 0 1 48-48h314v211H67a48 48 0 0 1-48-48z" fill="url(#navy)"/><g transform="translate(68 1379)" fill="none" stroke="#ffd829" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 4a19 19 0 0 0-11 34c3 3 5 7 5 11h20c0-4 2-8 5-11A19 19 0 0 0 17 4z"/><path d="M12 54h20M15 61h14M17 14v12M17 33v1" stroke="#fff" stroke-width="4"/></g><text x="247" y="1406" text-anchor="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="41" font-weight="700" fill="#fff"><tspan x="247" dy="0.0">Dica de</tspan></text><text x="247" y="1454" text-anchor="middle" font-family="Liberation Sans,Arial,sans-serif" font-size="41" font-weight="700" fill="#fff"><tspan x="247" dy="0.0">Prova</tspan></text><path d="M381 1331v165" stroke="#073f76" stroke-width="4"/><text x="417" y="1371" text-anchor="start" font-family="Liberation Sans,Arial,sans-serif" font-size="36" font-weight="700" fill="#07508a"><tspan x="417" dy="0.0">✓</tspan></text><text x="465" y="1369" text-anchor="start" font-family="Liberation Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#111820"><tspan x="465" dy="0.0">Art. 66: exclui início, inclui vencimento; prazo em dias</tspan><tspan x="465" dy="30.5">é contínuo.</tspan></text><text x="417" y="1441" text-anchor="start" font-family="Liberation Sans,Arial,sans-serif" font-size="36" font-weight="700" fill="#07508a"><tspan x="417" dy="0.0">✓</tspan></text><text x="465" y="1439" text-anchor="start" font-family="Liberation Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#111820"><tspan x="465" dy="0.0">Art. 67: prazos não se suspendem, salvo força maior</tspan><tspan x="465" dy="30.5">comprovada.</tspan></text><text x="1200" y="1520" text-anchor="end" font-family="Liberation Sans,Arial,sans-serif" font-size="12" font-weight="400" fill="#527089"><tspan x="1200" dy="0.0">BASE COMPLETA · REVISÃO GUIADA · ADM M06</tspan></text></svg>