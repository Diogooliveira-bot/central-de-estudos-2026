name: Validar integração TEC Penal e CPP
on:
  push:
    branches: ['integracao/tec-penal-cpp-20261014']
  pull_request:
    paths:
      - 'content/penal-cpp-tec-links.js'
      - 'ui/tec-penal-cpp-links.js'
      - 'ui/penal-cpp-tec-links.css'
      - 'tests/penal-cpp-tec-links-unit.mjs'
      - 'tests/fixtures/penal-cpp-tec-validated.json'
      - '.github/workflows/tec-penal-cpp-integration.yml'
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/build-home-progress.mjs
      - run: git diff --exit-code -- central-home-progress-data.js
