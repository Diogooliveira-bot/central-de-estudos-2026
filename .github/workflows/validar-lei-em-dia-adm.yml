name: Validar Lei em Dia Administrativo
on:
  push:
    branches:
      - feat/lei-em-dia-adm-publicacao-20261008
    paths:
      - 'tools/decorando*'
      - 'tests/lei-em-dia-adm*'
      - 'central-offline-files-v66172.json'
      - 'sw.js'
      - 'package.json'
      - '.github/workflows/validar-lei-em-dia-adm.yml'
  pull_request:
    paths:
      - 'tools/decorando*'
      - 'tests/lei-em-dia-adm*'
      - 'central-offline-files-v66172.json'
      - 'sw.js'
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node version
        run: node --version
      - name: Instalar dependências do projeto sem scripts de instalação
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Testes de dados, integração e regressão
        run: |
          npm run test:lei-adm
          node --test tests/lei-em-dia-sincronizacao.mjs
          npm test
      - name: Instalar Chromium para teste de interface
        run: npx playwright install --with-deps chromium
      - name: Simular aluno na Lei em Dia em desktop e celular
        run: node tests/lei-em-dia-adm-browser.mjs
