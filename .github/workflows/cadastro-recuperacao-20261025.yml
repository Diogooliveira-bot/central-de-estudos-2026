name: Validar cadastro e recuperação de senha
on:
  push:
    branches:
      - fix/cadastro-recuperacao-20261025
      - fix/recuperacao-admin-20261025
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  autenticacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Verificar sintaxe dos arquivos
        run: |
          node --check api/auth.js
          node --check lib/password-reset.js
          node --check middleware.js
          node --check sw.js
      - name: Testar autenticação, convites e recuperação de senha
        run: npm run test:password-reset
