<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Central de Estudos • v6.6.57</title>
  <style>
    html,body{margin:0;min-height:100%;background:#08111f;color:#e5eefb;font-family:Arial,sans-serif}
    main{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    .box{max-width:560px;border:1px solid #334155;border-radius:16px;padding:24px;background:#101b2d}
    .spin{width:30px;height:30px;margin:0 auto 14px;border:3px solid #334155;border-top-color:#8b7cf6;border-radius:50%;animation:r .8s linear infinite}
    small{display:block;color:#9fb0c7;margin-top:8px}@keyframes r{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main><div class="box"><div class="spin"></div><b>Abrindo a Central de Estudos…</b><small>v6.6.57 • Lei seca visual</small></div></main>
  <script src="/central-data-1.js"></script>
<script src="/central-data-2.js"></script>
  <script>
  (async function(){
    try{
      const encoded=(window.__CENTRAL_GZIP_PARTS__||[]).join('');
      const raw=atob(encoded),bytes=new Uint8Array(raw.length);
      for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
      const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      const html=await new Response(stream).text();
      document.open();document.write(html);document.close();
    }catch(error){
      document.querySelector('.box').innerHTML='<b>Não foi possível abrir a Central.</b><small>Atualize o Google Chrome e recarregue a página.</small>';
      console.error(error);
    }
  })();
  </script>
</body>
</html>
