name: Validar navegação premium da Central

on:
  push:
    branches: [feature/navegacao-premium-admin-20261021]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Sintaxe JavaScript
        run: |
          node --check ui/student-shell-v3.js
          node --check tests/navigation-premium-unit.mjs
      - name: Suite de regressão da Central
        run: npm test
