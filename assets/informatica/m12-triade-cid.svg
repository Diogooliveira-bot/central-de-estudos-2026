<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc"><title id="title">Tríade CID da segurança da informação</title><desc id="desc">Diagrama mostrando Confidencialidade, Integridade e Disponibilidade.</desc><rect width="1600" height="760" fill="#f4f8fc"/><text x="100" y="90" font-family="Arial" font-size="43" font-weight="700" fill="#173a5e">Tríade CID: objetivos de proteção</text><g font-family="Arial" text-anchor="middle"><path d="M800 175L1190 590H410Z" fill="#e6f3fa" stroke="#2f6fae" stroke-width="6"/><circle cx="800" cy="180" r="108" fill="#dff6f5" stroke="#2aa4b5" stroke-width="5"/><text x="800" y="170" font-size="31" font-weight="700" fill="#173a5e">Confidencialidade</text><text x="800" y="210" font-size="22" fill="#4a647c">acesso autorizado</text><circle cx="410" cy="590" r="108" fill="#fff0db" stroke="#d98d1f" stroke-width="5"/><text x="410" y="580" font-size="31" font-weight="700" fill="#173a5e">Integridade</text><text x="410" y="620" font-size="22" fill="#4a647c">sem alteração indevida</text><circle cx="1190" cy="590" r="108" fill="#e8f3e7" stroke="#4f9b65" stroke-width="5"/><text x="1190" y="580" font-size="31" font-weight="700" fill="#173a5e">Disponibilidade</text><text x="1190" y="620" font-size="22" fill="#4a647c">acesso quando necessário</text><path d="M760 355l40-45 40 45v80c0 55-40 91-40 91s-40-36-40-91z" fill="#173a5e"/><path d="M780 399l17 18 34-42" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/></g></svg>