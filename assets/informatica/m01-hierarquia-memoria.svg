<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Hierarquia de memória e armazenamento</title><desc id="desc">Pirâmide comparando registradores, cache, RAM e armazenamento.</desc>
<rect width="1600" height="900" fill="#f8fafc"/><rect x="70" y="58" width="12" height="112" rx="6" fill="#16b7b1"/>
<text x="108" y="104" fill="#102a43" font-family="Arial, sans-serif" font-size="42" font-weight="700">Hierarquia de memória e armazenamento</text><text x="108" y="144" fill="#486581" font-family="Arial, sans-serif" font-size="23">M01 · da maior velocidade à maior capacidade</text>
<text x="145" y="235" fill="#102a43" font-family="Arial, sans-serif" font-size="24" font-weight="700">Quanto mais próximo da CPU, mais rápido e menor tende a ser o recurso.</text>
<path d="M575 278 L805 278 L920 410 L460 410 Z" fill="#16b7b1"/><text x="690" y="346" text-anchor="middle" fill="#102a43" font-family="Arial, sans-serif" font-size="31" font-weight="700">REGISTRADORES</text><text x="690" y="379" text-anchor="middle" fill="#102a43" font-family="Arial, sans-serif" font-size="20">uso imediato pela CPU</text>
<path d="M460 430 L920 430 L1035 562 L345 562 Z" fill="#79d6d1"/><text x="690" y="500" text-anchor="middle" fill="#102a43" font-family="Arial, sans-serif" font-size="31" font-weight="700">CACHE</text><text x="690" y="533" text-anchor="middle" fill="#102a43" font-family="Arial, sans-serif" font-size="20">dados e instruções usados com frequência</text>
<path d="M345 582 L1035 582 L1150 714 L230 714 Z" fill="#bcebe7"/><text x="690" y="652" text-anchor="middle" fill="#102a43" font-family="Arial, sans-serif" font-size="31" font-weight="700">RAM · VOLÁTIL</text><text x="690" y="685" text-anchor="middle" fill="#102a43" font-family="Arial, sans-serif" font-size="20">programas e dados em uso</text>
<path d="M230 734 L1150 734 L1228 822 L152 822 Z" fill="#d9e2ec"/><text x="690" y="785" text-anchor="middle" fill="#102a43" font-family="Arial, sans-serif" font-size="30" font-weight="700">SSD / HDD · NÃO VOLÁTIL</text>
<rect x="1165" y="282" width="325" height="235" rx="24" fill="#102a43"/><text x="1200" y="335" fill="#83e4df" font-family="Arial, sans-serif" font-size="23" font-weight="700">LEMBRE-SE</text><text x="1200" y="382" fill="#fff" font-family="Arial, sans-serif" font-size="22">RAM não é SSD.</text><text x="1200" y="420" fill="#d9e2ec" font-family="Arial, sans-serif" font-size="19">A RAM perde conteúdo</text><text x="1200" y="447" fill="#d9e2ec" font-family="Arial, sans-serif" font-size="19">sem energia. O SSD/HDD</text><text x="1200" y="474" fill="#d9e2ec" font-family="Arial, sans-serif" font-size="19">guarda arquivos.</text>
<rect x="1165" y="550" width="325" height="206" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="1200" y="601" fill="#102a43" font-family="Arial, sans-serif" font-size="23" font-weight="700">MEMÓRIA VIRTUAL</text><text x="1200" y="642" fill="#486581" font-family="Arial, sans-serif" font-size="19">Usa parte do armazenamento</text><text x="1200" y="669" fill="#486581" font-family="Arial, sans-serif" font-size="19">para complementar páginas.</text><text x="1200" y="710" fill="#102a43" font-family="Arial, sans-serif" font-size="19" font-weight="700">Não cria RAM física.</text>
</svg>