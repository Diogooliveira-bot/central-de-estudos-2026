name: Resend email integration tests
on:
  push:
    branches:
      - feature/resend-email-integration-20261109
  pull_request:
    paths:
      - 'lib/resend-email.js'
      - 'lib/transactional-email.js'
      - 'lib/password-reset.js'
      - 'lib/free-signup-handler.js'
      - 'tests/resend-email-unit.mjs'
      - 'tests/transactional-email-unit.mjs'
      - 'tests/password-reset-unit.mjs'
      - 'tests/transactional-email-templates-unit.mjs'
      - 'package.json'
jobs:
  resend-unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:emails
