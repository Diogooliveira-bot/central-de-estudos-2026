name: Lancamento Base Completa - integracao controlada

on:
  push:
    branches:
      - integration/lancamento-base-completa-20261028
    paths:
      - 'api/**'
      - 'lib/**'
      - 'db/migrations/**'
      - 'cadastro-gratuito.html'
      - 'preferencias-contato.html'
      - 'login.html'
      - 'middleware.js'
      - 'central-boot-ready.js'
      - 'central-v119.html'
      - 'ui/**'
      - 'content/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/lancamento-integration-validation.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'api/**'
      - 'lib/**'
      - 'db/migrations/**'
      - 'cadastro-gratuito.html'
      - 'preferencias-contato.html'
      - 'login.html'
      - 'middleware.js'
      - 'central-boot-ready.js'
      - 'central-v119.html'
      - 'ui/**'
      - 'content/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/lancamento-integration-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias travadas
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verificar sintaxe dos handlers alterados
        run: node --check lib/free-signup-handler.js && node --check lib/free-signup-contact-preferences.js && node --check lib/hotmart-webhook.js && node --check api/auth.js
      - name: Regressao comercial, acesso e seguranca
        run: >-
          node --test
          tests/commercial-journey-4-5-unit.mjs
          tests/public-free-signup-4-5-unit.mjs
          tests/free-signup-contact-preferences-4-5-unit.mjs
          tests/hotmart-webhook-unit.mjs
          tests/plan-access-unit.mjs
          tests/password-reset-unit.mjs
          tests/protected-content-unit.mjs
          tests/preview-guest-middleware-unit.mjs
          tests/pwa-cache-recovery-unit.mjs
          tests/content-publication-integrity-unit.mjs
          tests/removed-disciplines-unit.mjs
          tests/public-app-url-unit.mjs
          tests/premium-expiry-reminders-unit.mjs
          tests/premium-expiry-handler-unit.mjs
  commercial-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Dependencias travadas
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Captura SMTP isolada, sem destinatarios reais
        run: |
          docker run -d --name bc-mailpit --rm -p 127.0.0.1:1025:1025 -p 127.0.0.1:8025:8025 axllent/mailpit:v1.27.8
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8025/api/v1/messages >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Confirmacao e recuperacao por SMTP local
        run: node tests/free-signup-mailpit-4-5.mjs
      - name: Chromium para desktop e celular
        run: npx playwright install --with-deps chromium --only-shell
      - name: Jornada visual desktop e celular, APIs simuladas
        run: node tests/free-signup-browser-4-5.mjs
        env:
          BC_BROWSER_EVIDENCE_DIR: artifacts/launch-browser
      - name: Leitor universal na Central, tres viewports e 40 leituras ADM
        run: node tests/universal-reader-central-browser.mjs
      - name: Evidencias visuais sem credenciais ou alunos reais
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: launch-commercial-browser
          path: artifacts/launch-browser/*.png
          if-no-files-found: warn
          retention-days: 14
