<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Central de Estudos</title>
  <style>
    html,body{min-height:100%;margin:0;background:#050505;color:#eef2f7;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    body{display:grid;place-items:center}.box{text-align:center;padding:24px}.mark{width:42px;height:42px;margin:0 auto 13px;border-radius:12px;display:grid;place-items:center;background:#171717;border:1px solid #2e2e2e;font-size:22px}.spinner{width:26px;height:26px;margin:16px auto 0;border:3px solid #292929;border-top-color:#745df4;border-radius:50%;animation:spin .75s linear infinite}h1{font-size:17px;margin:0}p{font-size:12px;color:#9ca3af;margin:7px 0}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="box"><div class="mark">📚</div><h1>Central de Estudos</h1><p>Preparando a versão mais recente…</p><div class="spinner"></div></main>
  <script>
  (async function(){
    try{
      if('serviceWorker' in navigator){
        var reg=await navigator.serviceWorker.register('/sw.js?central_boot=66105-'+Date.now(),{scope:'/'});
        try{await reg.update()}catch(e){}
        await navigator.serviceWorker.ready;
      }
    }catch(e){}
    location.replace('/index.html?central_fresh=66105-'+Date.now());
  })();
  </script>
</body>
</html>
