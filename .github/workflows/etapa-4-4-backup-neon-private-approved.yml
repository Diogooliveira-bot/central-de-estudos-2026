name: Etapa 4.4 - BACKUP PRIVADO Neon PG18 (somente branches autorizadas)
# Não executa na main, em PR ou em push comum. Os nomes das branches atuam
# como autorização de disparo APÓS configuração de Environment com revisão humana.
on:
  push:
    branches:
      - 'backup/pg18-drive-smoke-4-4-*'
      - 'backup/pg18-real-approved-4-4-*'
permissions:
  contents: read
concurrency:
  group: bc-neon-backup-production-exclusive
  cancel-in-progress: false
jobs:
  drive-smoke:
    if: startsWith(github.ref, 'refs/heads/backup/pg18-drive-smoke-4-4-') && github.repository == 'Diogooliveira-bot/central-de-estudos-2026'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: bc-neon-backup-private
    steps:
      - name: Checkout da branch específica, sem persistir credenciais
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Instalar ferramentas gratuitas para teste com dados FICTÍCIOS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rclone gnupg
      - name: Upload de teste CRIPTOGRAFADO sem nenhuma conexão Neon
        env:
          BC_DRIVE_TEST_APPROVED: ${{ vars.BC_DRIVE_TEST_APPROVED }}
          BC_RCLONE_CONFIG_B64: ${{ secrets.BC_RCLONE_CONFIG_B64 }}
        shell: bash
        run: bash scripts/test-drive-private-upload-synthetic.sh

      - name: Validar acesso Neon sem leitura de dados
        shell: bash
        env:
          PGHOST: ep-wild-math-awuoq9pk.c-12.us-east-1.aws.neon.tech
          PGPORT: '5432'
          PGDATABASE: neondb
          PGUSER: ${{ secrets.BC_NEON_BACKUP_USER }}
          PGPASSWORD: ${{ secrets.BC_NEON_BACKUP_PASSWORD }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: /etc/ssl/certs/ca-certificates.crt
          PGCONNECT_TIMEOUT: '15'
          PGOPTIONS: '-c default_transaction_read_only=on'
        run: |
          set -Eeuo pipefail
          set +x
          [[ "${PGUSER:-}" == bc_neon_backup_ro && -n "${PGPASSWORD:-}" ]] || { echo 'NEON_AUTH_CHECK_BLOCKED: usuario ou senha ausente'; exit 1; }
          diagfile="$(mktemp)"
          trap 'rm -f "$diagfile"' EXIT
          policy="$(
            docker run --rm --network host \
              --env PGHOST --env PGPORT --env PGDATABASE --env PGUSER \
              --env PGPASSWORD --env PGSSLMODE --env PGSSLROOTCERT \
              --env PGCONNECT_TIMEOUT --env PGOPTIONS \
              postgres:18 psql -X -At -v ON_ERROR_STOP=1 -c "
                SELECT CASE WHEN
                  current_user = 'bc_neon_backup_ro'
                  AND current_setting('server_version_num')::int BETWEEN 180000 AND 189999
                  AND EXISTS (
                    SELECT 1 FROM pg_roles
                    WHERE rolname = current_user
                      AND rolcanlogin
                      AND NOT (rolsuper OR rolcreatedb OR rolcreaterole OR rolreplication OR rolbypassrls)
                  )
                  AND NOT has_database_privilege(current_user,current_database(),'CREATE')
                  AND NOT EXISTS (
                    SELECT 1 FROM pg_namespace n
                    WHERE n.nspname NOT IN ('pg_catalog','information_schema')
                      AND n.nspname NOT LIKE 'pg_toast%'
                      AND has_schema_privilege(current_user,n.oid,'CREATE')
                  )
                  AND NOT EXISTS (
                    SELECT 1 FROM pg_class c
                    JOIN pg_namespace n ON n.oid=c.relnamespace
                    WHERE n.nspname NOT IN ('pg_catalog','information_schema')
                      AND n.nspname NOT LIKE 'pg_toast%'
                      AND c.relkind IN ('r','p','v','f','m')
                      AND (
                        has_table_privilege(current_user,c.oid,'INSERT')
                        OR has_table_privilege(current_user,c.oid,'UPDATE')
                        OR has_table_privilege(current_user,c.oid,'DELETE')
                        OR has_table_privilege(current_user,c.oid,'TRUNCATE')
                      )
                  )
                  AND NOT EXISTS (
                    SELECT 1 FROM pg_class c
                    JOIN pg_namespace n ON n.oid=c.relnamespace
                    WHERE n.nspname NOT IN ('pg_catalog','information_schema')
                      AND n.nspname NOT LIKE 'pg_toast%'
                      AND c.relkind='S'
                      AND (
                        has_sequence_privilege(current_user,c.oid,'USAGE')
                        OR has_sequence_privilege(current_user,c.oid,'UPDATE')
                      )
                  )
                THEN 'NEON_AUTH_READONLY_OK' ELSE 'NEON_AUTH_POLICY_REJECTED' END
              " 2>"$diagfile"
          )" || {
            if grep -qi 'password authentication failed' "$diagfile"; then
              echo 'NEON_AUTH_REJECTED: credenciais recusadas, conferir senha e usuario no GitHub'
            elif grep -Eqi 'certificate verify failed|root certificate|SSL error|SSL SYSCALL|TLS' "$diagfile"; then
              echo 'NEON_TLS_CONNECTION_ERROR: verificar validacao TLS'
            elif grep -Eqi 'could not translate host name|Name or service not known' "$diagfile"; then
              echo 'NEON_DNS_ERROR: verificar DNS'
            elif grep -Eqi 'timeout expired|timed out|Connection refused|Network is unreachable' "$diagfile"; then
              echo 'NEON_NETWORK_ERROR: conexão não completada'
            elif grep -Eqi 'permission denied|no pg_hba.conf entry' "$diagfile"; then
              echo 'NEON_ACCESS_REJECTED: permissão de conexão'
            elif grep -Eqi 'ERROR:|syntax error|does not exist|not a' "$diagfile"; then
              echo 'NEON_SQL_ERROR: diagnóstico de consulta; nenhuma tabela alterada'
            else
              echo 'NEON_CONNECTION_UNKNOWN_ERROR: não revelar detalhes potencialmente sensíveis'
            fi
            exit 1
          }
          [[ "$policy" == NEON_AUTH_READONLY_OK ]] || { echo 'NEON_AUTH_POLICY_REJECTED: sem alterar dados'; exit 1; }
          echo 'NEON_CREDENTIALS_PG18_TLS_READONLY_OK; NENHUMA TABELA DE ALUNOS CONSULTADA.'

  backup-real:
    if: startsWith(github.ref, 'refs/heads/backup/pg18-real-approved-4-4-') && github.repository == 'Diogooliveira-bot/central-de-estudos-2026'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: bc-neon-backup-private
    steps:
      - name: Checkout sem credenciais Git persistentes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Instalar cliente seguro de upload privado
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rclone gnupg
      - name: Backup REAL somente após 5 portões de segurança
        env:
          BC_BACKUP_APPROVED: ${{ vars.BC_BACKUP_APPROVED }}
          BC_PRIVATE_DESTINATION_APPROVED: ${{ vars.BC_PRIVATE_DESTINATION_APPROVED }}
          BC_DRIVE_PREFLIGHT_VERIFIED: ${{ vars.BC_DRIVE_PREFLIGHT_VERIFIED }}
          BC_RCLONE_CONFIG_B64: ${{ secrets.BC_RCLONE_CONFIG_B64 }}
          BC_GPG_PUBLIC_KEY_B64: ${{ secrets.BC_GPG_PUBLIC_KEY_B64 }}
          BC_GPG_RECIPIENT_FPR: ${{ vars.BC_GPG_RECIPIENT_FPR }}
          PGHOST: ep-wild-math-awuoq9pk.c-12.us-east-1.aws.neon.tech
          PGPORT: '5432'
          PGDATABASE: neondb
          PGUSER: ${{ secrets.BC_NEON_BACKUP_USER }}
          PGPASSWORD: ${{ secrets.BC_NEON_BACKUP_PASSWORD }}
        shell: bash
        run: bash scripts/backup-neon-pg18-once.sh
