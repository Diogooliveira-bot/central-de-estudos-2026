<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Português M10 — Pontuação</title>
<style>
:root{color-scheme:light;--bg:#f6f7f5;--card:#fff;--soft:#f2f4f1;--line:#dfe4de;--text:#20262d;--muted:#74808c;--accent:#2f5fc4;--good:#23794b;--warn:#9a6b17}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:980px;margin:auto;padding:22px 18px 70px}.top,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px}.top h1{margin:0 0 6px;font-size:25px;letter-spacing:-.02em}.top p{margin:6px 0}.muted{color:var(--muted)}.progress{height:8px;background:#e7ebe6;border-radius:999px;overflow:hidden;margin-top:14px}.progress span{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.tab{padding:11px 13px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;font-weight:750;cursor:pointer}.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}.panel{display:none}.panel.active{display:block}.session{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:9px 0;overflow:hidden}.session summary{cursor:pointer;padding:15px 16px;font-weight:800;list-style:none;display:flex;gap:11px;align-items:center}.session summary::-webkit-details-marker{display:none}.session summary:after{content:"›";margin-left:auto;color:var(--muted);font-size:20px;transition:.15s}.session[open] summary:after{transform:rotate(90deg)}.session-no{font-size:11px;color:var(--accent);border:1px solid #cbd8ef;border-radius:7px;padding:3px 6px;letter-spacing:.04em}.body{padding:6px 16px 19px;border-top:1px solid #ecefeb;line-height:1.68}.body h3{font-size:17px;margin:20px 0 7px;letter-spacing:-.01em}.body p{margin:8px 0}.body ul,.body ol{padding-left:22px;line-height:1.68}.body li{margin:5px 0}.body table{width:100%;border-collapse:collapse;margin:13px 0;font-size:14px}.body th,.body td{border:1px solid var(--line);padding:9px;text-align:left;vertical-align:top}.body th{background:#f5f7f4}.remember,.warning,.exam{padding:12px 13px;border-radius:10px;margin:13px 0;background:var(--soft);border-left:3px solid var(--good)}.warning{border-left-color:var(--warn)}.exam{border-left-color:var(--accent)}.check{display:flex;gap:9px;align-items:flex-start;margin-top:18px;padding-top:14px;border-top:1px dashed #d4dad3;font-weight:700}.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent)}.tec-card{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}.tec-card h2{margin:5px 0 7px;font-size:21px}.tec-card p{margin:0;color:var(--muted);max-width:680px;line-height:1.6}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:850}.tec-open{border:0;border-radius:10px;background:var(--accent);color:#fff;padding:11px 15px;font-weight:800;cursor:pointer;min-height:44px}.tec-guide{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:15px;background:var(--soft)}.tec-guide p{margin:6px 0 0;line-height:1.6;color:var(--muted)}
@media(max-width:720px){.wrap{padding:14px 11px 54px}.top h1{font-size:21px}.body{padding:5px 12px 17px}.body table{display:block;overflow:auto;font-size:12px}.session summary{padding:13px 12px}.tec-card{display:block;padding:16px}.tec-open{width:100%;margin-top:14px}}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#09111f;--card:#0e1928;--soft:#111e30;--line:#29394f;--text:#edf3fb;--muted:#9aabc1;--accent:#6d8ff0;--good:#36a56b;--warn:#c99a3c}.body th{background:#111e30}.session-no{border-color:#40587a}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><h1>M10 — Pontuação</h1><p class="muted">Teoria consolidada a partir do PDF oficial, com sintaxe, efeitos de sentido, bizus executáveis e foco FCC/TJ-CE.</p><div class="progress"><span id="bar"></span></div><p><b id="pct">0%</b> da leitura concluída · <span id="readCount">0 de 10 sessões</span></p></div>
<div class="tabs"><button class="tab active" data-tab="theory">Teoria · 10 sessões</button><button class="tab" data-tab="tec">Questões TEC ↗</button></div>
<section id="theory" class="panel active"><div id="m10Theory"></div></section><section id="tec" class="panel"><div id="m10Tec"></div></section>
</div>
<script src="portugues-m10-content-v1.js"></script><script src="portugues-m10-content-v2.js"></script><script src="portugues-m10-content-v3.js"></script><script src="portugues-m10-runtime-v1.js"></script>
</body></html>
