name: Importar PDF do Leo na Agenda
on:
  pull_request:
    paths:
      - 'ui/agenda-pdf-leo-v1.js'
      - 'ui/agenda-pdf-leo-v1.css'
      - 'vendor/pdfjs/**'
      - 'tests/agenda-pdf-leo-unit.mjs'
      - 'tests/agenda-pdf-leo-browser.mjs'
      - '.github/workflows/agenda-pdf-leo.yml'
  workflow_dispatch:
jobs:
  agenda-pdf-leo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install chromium
      - run: node --test tests/agenda-pdf-leo-unit.mjs
      # PDF fictício gerado no próprio teste; nenhum dado de aluno.
      - run: node tests/agenda-pdf-leo-browser.mjs
