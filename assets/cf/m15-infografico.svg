 </g><rect x="70" y="95" rx="26" width="300" height="170" fill="#f7e9f2"/><text x="94" y="135" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#2f2b28">Meio Ambiente</text><text x="94" y="171" font-family="Arial, sans-serif" font-size="17" fill="#4f4a46">Direito de todos; dever do Poder</text><text x="94" y="196" font-family="Arial, sans-serif" font-size="17" fill="#4f4a46">Público e da coletividade.</text><rect x="430" y="70" rx="26" width="300" height="170" fill="#fff1c9"/><text x="454" y="110" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#2f2b28">Responsabilidade</text><text x="454" y="146" font-family="Arial, sans-serif" font-size="17" fill="#4f4a46">Reparação pode coexistir com</text><text x="454" y="171" font-family="Arial, sans-serif" font-size="17" fill="#4f4a46">sanções penais e administrativas.</text><rect x="820" y="95" rx="26" width="300" height="170" fill="#e3f3e7"/><text x="844" y="135" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#2f2b28">Família</text><text x="844" y="171" font-family="Arial, sans-serif" font-size="17" fill="#4f4a46">Base da sociedade, igualdade</text><text x="844" y="196" font-family="Arial, sans-serif" font-size="17" fill="#4f4a46">conjugal e planejamento familiar</text><text x="844" y="221" font-family="Arial, sans-serif" font-size="17" fill="#4f4a46">livre.</text><rect x="80" y="480" rx="26" width="300" height="170" fill="#e8eefc"/><text x="104" y="520" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#2f2b28">Art. 227</text><text x="104" y="556" font-family="Arial, sans-serif" font-size="17" fill="#4f4a46">Família + sociedade + Estado.</text><text x="104" y="581" font-family="Arial, sans-serif" font-size="17" fill="#4f4a46">Absoluta prioridade.</text><rect x="435" y="520" rx="26" width="300" height="170" fill="#efe8f8"/><text x="459" y="560" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#2f2b28">Filhos e Menores</text><text x="459" y="596" font-family="Arial, sans-serif" font-size="17" fill="#4f4a46">Igualdade de filiação e</text><text x="459" y="621" font-family="Arial, sans-serif" font-size="17" fill="#4f4a46">inimputabilidade abaixo de 18</text><text x="459" y="646" font-family="Arial, sans-serif" font-size="17" fill="#4f4a46">anos.</text><rect x="825" y="480" rx="26" width="300" height="170" fill="#e4f4f2"/><text x="849" y="520" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#2f2b28">Pessoa Idosa</text><text x="849" y="556" font-family="Arial, sans-serif" font-size="17" fill="#4f4a46">Dignidade, participação, lar</text><text x="849" y="581" font-family="Arial, sans-serif" font-size="17" fill="#4f4a46">preferencial e transporte urbano</text><text x="849" y="606" font-family="Arial, sans-serif" font-size="17" fill="#4f4a46">65+.</text></svg>