name: Padronização Premium — Direito Civil M01–M15

on:
  push:
    branches: [preview/legal-complete-premium-v1-20261025]
    paths:
      - '.github/workflows/verify-etapa7-civil-m01-m15.yml'
      - 'tests/etapa7-civil-m01-m15-browser.mjs'
      - 'ui/civil-native-study-v1.*'
      - 'ui/native-reading-session.js'
      - 'ui/civil-bens-apostila-v1.js'
      - 'ui/legal-complete-premium-v1.*'
      - 'content/civil/civil-native-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bc-etapa7-civil-m01-m15
  cancel-in-progress: true

jobs:
  chromium:
    if: github.repository == 'Diogooliveira-bot/central-de-estudos-2026'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout isolado sem credenciais persistentes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Dependências sem scripts
        run: npm ci --ignore-scripts
      - name: Sintaxe dos leitores Civil
        run: |
          node --check tests/etapa7-civil-m01-m15-browser.mjs
          node --check ui/civil-native-study-v1.js
          node --check ui/civil-bens-apostila-v1.js
      - name: Regressões jurídicas anteriores
        run: node --test tests/legal-complete-premium-theme-unit.mjs tests/etapa3-premium-pilots-unit.mjs
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Conferir 15 módulos Civil no leitor nativo
        run: node tests/etapa7-civil-m01-m15-browser.mjs
      - name: Salvar capturas e métricas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etapa7-civil-m01-m15-chromium
          path: artifacts/etapa7-civil-m01-m15/*
          if-no-files-found: ignore
          retention-days: 14
