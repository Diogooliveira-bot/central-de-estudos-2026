name: Generate Vade Mecum PDFs

permissions:
  contents: write

on:
  pull_request:
    paths:
      - "scripts/generate_vademecum_pdfs.py"
      - ".github/workflows/generate-vademecum-pdfs.yml"
  workflow_dispatch:

jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 weasyprint

      - name: Generate official-law PDFs
        run: python scripts/generate_vademecum_pdfs.py

      - name: Commit PDFs into repository branch
        run: |
          rm -rf assets/vademecum-pdf
          mkdir -p assets/vademecum-pdf
          cp generated_vademecum_pdfs/*.pdf assets/vademecum-pdf/
          cp generated_vademecum_pdfs/relatorio.csv assets/vademecum-pdf/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vademecum-pdf
          git diff --cached --quiet || git commit -m "content: add official Vade Mecum PDFs"
          git push origin HEAD:generate-vademecum-pdfs-20261005

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: PDFs_VadeMecum
          path: PDFs_VadeMecum.zip
          if-no-files-found: error
          retention-days: 7
