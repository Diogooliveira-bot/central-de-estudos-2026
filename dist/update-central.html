<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atualizar Central</title><style>body{font-family:system-ui;background:#f7f7f4;color:#1f2933;display:grid;place-items:center;min-height:100vh;margin:0;padding:20px}.box{box-sizing:border-box;background:#fffefb;border:1px solid #e7e8e3;border-radius:12px;padding:24px;max-width:460px;width:100%;box-shadow:0 8px 28px #232d370b;text-align:center}h1{font:600 24px Georgia,serif;margin:0 0 10px}p{line-height:1.55;color:#718096}.ok{color:#2f7d69;font-weight:700}.ver{font-size:12px;color:#8b96a3;margin-top:12px}</style></head><body><div class="box"><h1>Atualizando a Central…</h1><p id="msg">Removendo somente o cache antigo da aplicação. Seu progresso, respostas, cartões e histórico serão preservados.</p><div class="ver">Destino: v6.6.119 · visual minimalista</div></div><script>(async()=>{const TARGET='66119';const msg=document.getElementById('msg');try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister().catch(()=>false)))}if(window.caches){const keys=await caches.keys();await Promise.all(keys.filter(k=>/^central-/i.test(k)).map(k=>caches.delete(k)))}if('serviceWorker'in navigator){const reg=await navigator.serviceWorker.register('/sw.js?central_boot='+TARGET+'-'+Date.now(),{scope:'/',updateViaCache:'none'});try{await reg.update()}catch(_){}await navigator.serviceWorker.ready}msg.className='ok';msg.textContent='v6.6.119 carregada. Abrindo a Central…';setTimeout(()=>location.replace('/central-v119.html?central_fresh='+TARGET+'-'+Date.now()),600)}catch(e){msg.textContent='Não foi possível concluir a atualização automática. Verifique a internet, recarregue esta página e tente novamente.'}})();</script></body></html>
