name: Generate Vade Mecum PDFs

on:
  pull_request:
    paths:
      - "scripts/generate_vademecum_pdfs.py"
      - ".github/workflows/generate-vademecum-pdfs.yml"
  workflow_dispatch:

jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 weasyprint

      - name: Generate official-law PDFs
        run: python scripts/generate_vademecum_pdfs.py

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: PDFs_VadeMecum
          path: PDFs_VadeMecum.zip
          if-no-files-found: error
          retention-days: 7
