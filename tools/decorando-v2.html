`;
function apply(){
 try{
   const d=frame.contentDocument;
   if(!d||!d.head)throw new Error('sem acesso ao documento');
   let s=d.getElementById('base-completa-visual-v2');
   if(!s){s=d.createElement('style');s.id='base-completa-visual-v2';d.head.appendChild(s)}
   s.textContent=css;
   d.documentElement.style.setProperty('--green','#1698c4');
   d.title='BASE COMPLETA · Decorando a Lei Seca';
   const brandStrong=d.querySelector('.filter-topbar .brand strong');
   if(brandStrong)brandStrong.textContent='Decorando a Lei Seca';
   const brandSub=d.querySelector('.filter-topbar .brand span');
   if(brandSub)brandSub.textContent='BASE COMPLETA';
 }catch(e){
   document.getElementById('fail').style.display='block';
 }
}
frame.addEventListener('load',()=>{apply();setTimeout(apply,80);setTimeout(apply,500)});
})();
</script>
