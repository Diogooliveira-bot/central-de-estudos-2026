<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Controle jurídico do Vade Mecum — Base Completa</title>
<style>
:root{--navy:#12344d;--blue:#0a7ea4;--pale:#eef7fa;--ink:#172b3a;--muted:#667786;--line:#d8e2e8;--ok:#19704a;--warn:#8a5a12}*{box-sizing:border-box}body{margin:0;background:#f7fafc;color:var(--ink);font:500 14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.shell{max-width:1180px;margin:auto;padding:28px 18px 64px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:20px}.top h1{margin:0;font-size:27px;color:var(--navy)}.top p{margin:5px 0 0;color:var(--muted)}a,button{border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--navy);padding:9px 12px;text-decoration:none;font-weight:750;cursor:pointer}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.metric,.panel{background:#fff;border:1px solid var(--line);border-radius:14px}.metric{padding:15px}.metric small{color:var(--muted);text-transform:uppercase;font-size:10px;letter-spacing:.05em}.metric b{display:block;font-size:25px;margin-top:3px}.panel{padding:17px;margin-top:14px}h2{font-size:16px;margin:0 0 12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}input,select,textarea{border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);padding:10px;font:inherit}.toolbar input{flex:1;min-width:220px}.toolbar select{min-width:180px}.list{display:grid;gap:8px}.law{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:12px}.law small{display:block;color:var(--muted);margin-top:3px}.pill{display:inline-block;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800}.pill.ok{background:#e7f5ed;color:var(--ok)}.pill.pending{background:#fff3dc;color:var(--warn)}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form label{display:grid;gap:5px;font-size:11px;font-weight:800}.form .wide{grid-column:1/-1}.form textarea{min-height:92px;resize:vertical}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.status{min-height:20px;color:var(--muted);margin-top:9px}.events{display:grid;gap:7px}.event{border-bottom:1px solid #edf1f4;padding:8px 0}.event small{color:var(--muted)}@media(max-width:760px){.top{display:block}.top nav{margin-top:12px}.metrics{grid-template-columns:1fr}.law{grid-template-columns:1fr}.form{grid-template-columns:1fr}.form .wide{grid-column:auto}}
</style>
</head>
<body><main class="shell">
<header class="top"><div><h1>Controle jurídico do Vade Mecum</h1><p>Conferências, fontes oficiais e histórico. Acesso exclusivo dos administradores.</p></div><nav><a href="/tools/vade.html">Abrir Vade Mecum</a> <a href="/usuarios.html">← Administração</a></nav></header>
<section class="metrics"><div class="metric"><small>Legislações</small><b id="total">—</b></div><div class="metric"><small>Conferidas</small><b id="verified">—</b></div><div class="metric"><small>Pendentes</small><b id="pending">—</b></div></section>
<section class="panel"><h2>Inventário</h2><div class="toolbar"><input id="search" placeholder="Buscar por lei ou nome"><select id="filter"><option value="all">Todas</option><option value="verified">Conferidas</option><option value="pending">Pendentes</option><option value="conflict">Com conflito</option></select></div><div id="laws" class="list">Carregando…</div></section>
<section class="panel" id="editor" hidden><h2>Registrar conferência</h2><form id="form" class="form"><input id="lawId" type="hidden"><label class="wide">Legislação<input id="lawName" readonly></label><label>Situação<select id="lawStatus"><option value="verified">Conferida</option><option value="pending">Pendente</option><option value="conflict">Conflito para validação</option><option value="inventory">Apenas inventariada</option></select></label><label>Data da última conferência<input id="lawDate" type="date"></label><label>Dispositivos atualizados<input id="updated" type="number" min="0" value="0"></label><label>Dispositivos adicionados<input id="added" type="number" min="0" value="0"></label><label class="wide">Fontes oficiais — uma URL HTTPS por linha<textarea id="sources"></textarea></label><label class="wide">Observações administrativas<textarea id="notes"></textarea></label><div class="wide"><button class="primary" type="submit">Salvar no histórico</button> <button type="button" id="cancel">Cancelar</button><div id="formStatus" class="status"></div></div></form></section>
<section class="panel"><h2>Histórico recente</h2><div id="events" class="events">Carregando…</div></section>
</main>
<script>
(function(){'use strict';let data={laws:[],events:[]};const q=(id)=>document.getElementById(id),esc=(s)=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function json(url,opt){const response=await fetch(url,opt),body=await response.json().catch(()=>({}));if(!response.ok)throw new Error(body.error||`HTTP ${response.status}`);return body}
function date(value){if(!value)return'—';try{return new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:value.includes?.('T')?'short':undefined}).format(new Date(value.length===10?value+'T12:00:00':value))}catch(_){return value}}
function render(){const term=q('search').value.trim().toLowerCase(),filter=q('filter').value;const list=data.laws.filter(law=>(!term||(law.name+' '+law.id).toLowerCase().includes(term))&&(filter==='all'||(filter==='pending'?law.status!=='verified':law.status===filter)));q('laws').innerHTML=list.length?list.map(law=>`<article class="law"><div><b>${esc(law.name)}</b><small>${esc(law.id)} · ${law.articleCount} artigos/blocos · ${law.lastVerifiedAt?'conferido em '+date(law.lastVerifiedAt):'sem conferência integral'}</small></div><span class="pill ${law.status==='verified'?'ok':'pending'}">${law.status==='verified'?'CONFERIDA':law.status==='conflict'?'CONFLITO':'PENDENTE'}</span><button data-edit="${esc(law.id)}">Atualizar</button></article>`).join(''):'<p>Nenhuma legislação encontrada.</p>';q('laws').querySelectorAll('[data-edit]').forEach(button=>button.onclick=()=>edit(button.dataset.edit))}
function edit(id){const law=data.laws.find(item=>item.id===id);if(!law)return;q('lawId').value=law.id;q('lawName').value=law.name;q('lawStatus').value=law.status;q('lawDate').value=law.lastVerifiedAt?String(law.lastVerifiedAt).slice(0,10):'';q('updated').value=law.devicesUpdated||0;q('added').value=law.devicesAdded||0;q('sources').value=(law.sourceUrls||[]).join('\n');q('notes').value=law.notes||'';q('editor').hidden=false;q('editor').scrollIntoView({behavior:'smooth'})}
function paint(){q('total').textContent=data.summary.total;q('verified').textContent=data.summary.verified;q('pending').textContent=data.summary.pending;render();q('events').innerHTML=data.events.length?data.events.map(event=>`<div class="event"><b>${esc(event.lawId)}</b> · ${esc(event.by)}<br><small>${date(String(event.at))} · ${esc(event.action)}</small></div>`).join(''):'<span class="status">Ainda não há intervenções manuais. O inventário inicial permanece preservado.</span>'}
async function load(){const me=await json('/api/auth?action=me');if(!me.authenticated||me.user?.role!=='admin'){location.replace('/login.html?next=/vade-admin.html');return}data=await json('/api/vade-audit');paint()}
q('search').oninput=render;q('filter').onchange=render;q('cancel').onclick=()=>q('editor').hidden=true;q('form').onsubmit=async event=>{event.preventDefault();q('formStatus').textContent='Salvando…';try{await json('/api/vade-audit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lawId:q('lawId').value,status:q('lawStatus').value,lastVerifiedAt:q('lawDate').value||null,devicesUpdated:Number(q('updated').value||0),devicesAdded:Number(q('added').value||0),sourceUrls:q('sources').value.split(/\n/).map(x=>x.trim()).filter(Boolean),notes:q('notes').value})});q('editor').hidden=true;await load()}catch(error){q('formStatus').textContent=error.message}};load().catch(error=>q('laws').textContent=error.message)})();
</script></body></html>
