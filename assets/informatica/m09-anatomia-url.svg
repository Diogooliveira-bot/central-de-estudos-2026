<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc"><title id="title">Anatomia de uma URL</title><desc id="desc">Diagrama identificando protocolo, domínio, caminho, consulta e fragmento em uma URL.</desc><rect width="1600" height="650" fill="#f4f8fc"/><text x="100" y="100" font-family="Arial" font-size="44" font-weight="700" fill="#173a5e">Como ler uma URL</text><rect x="100" y="180" width="1400" height="110" rx="18" fill="#fff" stroke="#d5e1ec" stroke-width="3"/><text x="145" y="250" font-family="Consolas,monospace" font-size="37" fill="#173a5e">https://exemplo.org/consulta?id=12#resultado</text><g font-family="Arial" font-size="28" font-weight="700"><path d="M155 310v70h130" stroke="#2aa4b5" stroke-width="5" fill="none"/><text x="100" y="430" fill="#176d7a">Protocolo</text><text x="100" y="468" font-size="23" font-weight="400" fill="#4a647c">https</text><path d="M395 310v70h140" stroke="#2aa4b5" stroke-width="5" fill="none"/><text x="450" y="430" fill="#176d7a">Domínio</text><text x="450" y="468" font-size="23" font-weight="400" fill="#4a647c">exemplo.org</text><path d="M720 310v70h130" stroke="#2aa4b5" stroke-width="5" fill="none"/><text x="820" y="430" fill="#176d7a">Caminho</text><text x="820" y="468" font-size="23" font-weight="400" fill="#4a647c">/consulta</text><path d="M1035 310v70h110" stroke="#2aa4b5" stroke-width="5" fill="none"/><text x="1120" y="430" fill="#176d7a">Consulta</text><text x="1120" y="468" font-size="23" font-weight="400" fill="#4a647c">?id=12</text><path d="M1290 310v70h70" stroke="#2aa4b5" stroke-width="5" fill="none"/><text x="1320" y="430" fill="#176d7a">Fragmento</text><text x="1320" y="468" font-size="23" font-weight="400" fill="#4a647c">#resultado</text></g><text x="100" y="575" font-family="Arial" font-size="25" fill="#4a647c">URL identifica um recurso; HTTPS protege o transporte, mas não comprova por si só a legitimidade do site.</text></svg>