name: Patch Decorando focus answer

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_decorando_focus_answer.py'
      - '.github/workflows/patch-decorando-focus-answer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/patch_decorando_focus_answer.py

      - name: Commit patched Decorando
        run: |
          if git diff --quiet -- tools/decorando.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/decorando.html
          git commit -m "fix: keep answered Decorando question visible until navigation"
          git push
