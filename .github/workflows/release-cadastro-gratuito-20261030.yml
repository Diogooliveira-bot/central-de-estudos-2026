name: Cadastro Gratuito - release isolada
on:
  push:
    branches:
      - release/cadastro-gratuito-production-20261030
    paths:
      - 'cadastro-gratuito.html'
      - 'usuarios.html'
      - 'central-free-disciplines.js'
      - 'central-discipline-loader.js'
      - 'central-v119.html'
      - 'lib/protected-content.js'
      - 'tests/central-free-boot-browser.mjs'
      - 'tests/helpers/free-plan-content.mjs'
      - 'tools/decorando.html'
      - 'lib/lei-em-dia-questions-handler.js'
      - 'ui/reader-standard-v1.js'
      - 'ui/cf-native-study-v2.js'
      - 'tests/reader-standard-browser.mjs'
      - 'ui/reader-questions-v1.js'
      - 'ui/acronyms-v1.js'
      - 'tests/reader-questions-browser.mjs'
      - 'api/auth.js'
      - 'lib/admin-public-signups-handler.js'
      - 'tests/admin-public-signups-unit.mjs'
      - 'lib/free-signup-handler.js'
      - 'termos-de-uso.html'
      - 'politica-de-privacidade.html'
      - 'politica-de-cookies.html'
      - 'tests/public-free-signup-4-5-unit.mjs'
      - 'tests/free-signup-browser-4-5.mjs'
      - 'ui/discipline-standard.js'
      - 'cpc-study-system-v1.js'
      - 'content/cpc/cpc-fixation-questions-m01-m06-v1.js'
      - 'ui/civil-native-study-v1.js'
      - 'tests/internal-questions-browser.mjs'
      - 'tests/civil-sharing-links-unit.mjs'
      - 'lei-em-dia-aprovadas-20261012.js'
      - 'tools/decorando-data-cf-leis.js'
      - 'tools/decorando-data-led-aprovadas.js'
      - 'tests/lei-em-dia-constitucional.mjs'
      - '.github/workflows/release-cadastro-gratuito-20261030.yml'
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout seguro
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Dependencias
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Testes unitarios cadastro, protecao Premium e aceites
        run: node --test tests/public-free-signup-4-5-unit.mjs tests/plan-access-unit.mjs tests/admin-public-signups-unit.mjs tests/protected-content-unit.mjs tests/cf-m01-didatico-unit.mjs tests/civil-cpc-juridica-review-unit.mjs tests/fixation-only-contract-unit.mjs tests/lei-em-dia-constitucional.mjs tests/lei-em-dia-catalogo-integridade.mjs
      - name: Sintaxe da API administrativa
        run: node --check lib/admin-public-signups-handler.js
      - name: Chromium isolado
        run: npx playwright install chromium --only-shell
      - name: Browser cadastro gratuito e Turnstile simulado
        run: node tests/free-signup-browser-4-5.mjs
      - name: Gratuito com a mesma interface do Premium (6 disciplinas)
        run: node tests/central-free-boot-browser.mjs
      - name: Teoria completa no padrão único (6 disciplinas)
        run: node tests/reader-standard-browser.mjs
      - name: Questões interativas e siglas com descrição
        run: node tests/reader-questions-browser.mjs
      - name: Questões internas de Penal e Processo Civil (Premium)
        run: node tests/internal-questions-browser.mjs
      - name: Civil - módulos, infográfico e catálogo preservados
        run: node --test tests/civil-sharing-links-unit.mjs
