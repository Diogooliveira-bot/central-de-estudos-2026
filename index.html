/* =========================================================
   V6.6.6 — SISTEMA VISUAL GLOBAL
   Apenas apresentação. Nenhuma regra de estudo é alterada.
   ========================================================= */
html[data-central-theme="dark"]{
 --bg:#000000;--side:#000000;--panel:#0a0a0a;--panel2:#111111;--line:#1f1f1f;
 --line2:#2a2a2a;--text:#f2f2f2;--muted:#9a9a9a;--purple:#3b82f6;--purple2:#2563eb;
 --surface-hover:#111111;--input:#0a0a0a;--soft:#0a0a0a;--top:#000000;
}
html[data-central-theme="light"]{
 --bg:#f6f7fa;--side:#ffffff;--panel:#ffffff;--panel2:#ffffff;--line:#e3e7ef;
 --line2:#d3d9e4;--text:#16213a;--muted:#5a6883;--purple:#2f66d0;--purple2:#2451b3;
 --surface-hover:#f0f3f8;--input:#ffffff;--soft:#ffffff;--top:#ffffff;
}
html,body{background:var(--bg);color:var(--text)}
body,button,input,textarea,select{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body,.topbar,aside,.card,.subject,.disc-card,.cf-module,#ankiView{
 transition:background-color .16s ease,border-color .16s ease,color .16s ease;
}
aside{background:var(--side);border-color:var(--line)}
.brand{border-color:var(--line)}
.brand-icon{background:var(--panel2);border-color:var(--line2)}
.nav .label{color:var(--muted)}
.nav button{color:var(--muted);font-weight:650}
.nav button:hover,.nav button.active{background:var(--surface-hover);color:var(--text)}
.topbar{background:var(--top);border-color:var(--line)}
.top-actions{display:flex;gap:6px}
.top-actions button{background:var(--panel2);border-color:var(--line2);color:var(--text)}
.workspace,.view{background:var(--bg)}
.card,.disc-card{background:var(--panel);border-color:var(--line)}
.card-head{border-color:var(--line)}
.btn{background:var(--panel2);border-color:var(--line2);color:var(--text)}
.btn:hover{background:var(--surface-hover)}
.btn.primary{background:var(--purple2);border-color:var(--purple);color:#fff}
.field input,.field textarea,.field select{background:var(--input);border-color:var(--line2);color:var(--text)}
.subject,.cf-module{background:var(--soft);border-color:var(--line)}
.subject-head,.cf-module-head{color:var(--text)}
.subject-head:hover,.cf-module-head:hover{background:var(--surface-hover)}
.topic-row:hover{background:var(--surface-hover)}
.topic-title,.cf-module-title{color:var(--text)}
.sum,.note-item,.tips,.detail-panel,
.cf-step,.cf-syllabus,.cf-theory,.cf-resource-box,.cf-question,.cf-error-panel,
.cf-result-grid div,.cf-metric{
 background:var(--panel)!important;border-color:var(--line)!important;color:var(--text);
}
.cf-session-head{
 background:var(--panel2)!important;border-color:var(--line)!important;color:var(--text);
}
.cf-option,.cf-strike,.cf-btn{
 background:var(--panel2);border-color:var(--line2);color:var(--text);
}
.cf-option:hover,.cf-btn:hover{background:var(--surface-hover)}
.cf-theory-text,.cf-advanced div{color:var(--muted)}
.cf-notes{
 background:var(--input)!important;color:var(--text)!important;border-color:var(--line2)!important;
}
.module-frame{background:var(--bg)}
/* Os estados semânticos permanecem iguais em ambos os temas. */
.btn.green,.cf-feedback.good,.anki-duo-feedback.good{color:#bff5da}
.btn.red,.cf-feedback.bad,.anki-duo-feedback.bad{color:#ffcbd0}

/* Anki segue o mesmo fundo, cards, bordas e tipografia da Central. */
#ankiView{background:var(--bg)!important;color:var(--text)}
.anki-duo-shell{color:var(--text)!important}
.anki-duo-header{border-color:var(--line)!important}
.anki-duo-brand,.anki-duo-icon,.anki-duo-deckbutton{color:var(--text)!important}
.anki-duo-home h1,.anki-duo-heading h1,.anki-duo-overview h1,.anki-duo-content{color:var(--text)!important}
.anki-duo-eyebrow,.anki-duo-subtitle,.anki-duo-hint,.anki-duo-studytop,.anki-duo-tags,
.anki-duo-form label,.anki-duo-row p,.anki-duo-stat small,.anki-duo-history summary,
.anki-duo-history-row,.anki-duo-editor-summary,.anki-duo-editor-note{color:var(--muted)!important}
.anki-duo-btn,.anki-duo-icon,.anki-duo-choice,.anki-duo-table,.anki-duo-table-head,
.anki-duo-overview-counts div,.anki-duo-custom,.anki-duo-card,.anki-duo-resultgrid div,
.anki-duo-stat,.anki-duo-row,.anki-duo-settings-item,.anki-duo-history,.anki-duo-editor-history,
.anki-duo-cardtool{
 background:var(--panel)!important;border-color:var(--line)!important;color:var(--text)!important;
}
.anki-duo-table-head,.anki-duo-cardtool,.anki-duo-choice{background:var(--panel2)!important}
.anki-duo-table-row{border-color:var(--line)!important;color:var(--text)!important}
.anki-duo-table-row:hover{background:var(--surface-hover)!important}

      const candidate = typeof localStorage !== 'undefined' ? localStorage : window.localStorage;
      const probe = '__central_agenda_probe__';
      candidate.setItem(probe, '1');
      candidate.removeItem(probe);
      return candidate;
    } catch (_) {
      return {
        getItem: (key) => memory.has(String(key)) ? memory.get(String(key)) : null,
        setItem: (key, value) => memory.set(String(key), String(value)),
        removeItem: (key) => memory.delete(String(key)),
      };
    }
  }

  const agendaStorage = storage();
  const element = (id) => document.getElementById(id);
  const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  })[char]);
  const today = () => {
    const date = new Date();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${date.getFullYear()}-${month}-${day}`;
  };
  const key = (date) => `${KEY_PREFIX}${date}`;

  function status(message = '', kind = '') {
    const host = element('agendaStandaloneStatus');
    if (!host) return;
    host.textContent = message;
    host.className = `agenda-standalone-status${kind ? ` ${kind}` : ''}`;
  }

  function read(date) {
    const raw = agendaStorage.getItem(key(date));
    if (!raw) return [];
    try {
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (_) {
      try {
        agendaStorage.setItem(`central-v6:agenda-corrompida:${date}:${Date.now()}`, raw);
        agendaStorage.removeItem(key(date));
      } catch (_) {}
      status('Um registro antigo inválido foi separado. A Agenda continua disponível.', 'warning');
      return [];
    }
  }

  function write(date, tasks) {
    try {
      agendaStorage.setItem(key(date), JSON.stringify(Array.isArray(tasks) ? tasks : []));
      return true;
    } catch (_) {
      status('Não foi possível salvar esta alteração neste navegador.', 'error');
      return false;
    }
  }

  function disciplineLabel(value) {
    const labels = {
      pt: 'Português', trab: 'Direito do Trabalho', ptra: 'Direito Processual do Trabalho',
      cf: 'Direito Constitucional', adm: 'Direito Administrativo',
      civil: 'Direito Civil', cpc: 'Direito Processual Civil', penal: 'Direito Penal',
      cpp: 'Direito Processual Penal', rlm: 'Raciocínio Lógico-Matemático',
    };
    return labels[String(value)] || String(value || 'Geral');
  }

  function currentDate() {
    const input = element('agendaDate');
    if (input && !input.value) input.value = today();
    return input?.value || today();
  }

  function studyButton(task) {
    const subjects = {pt:'Português',cf:'Direito Constitucional',adm:'Direito Administrativo',civil:'Direito Civil',cpc:'Direito Processual Civil',penal:'Direito Penal',cpp:'Direito Processual Penal',rlm:'Raciocínio Lógico-Matemático',trab:'Direito do Trabalho',ptra:'Direito Processual do Trabalho'};
    const id = Object.keys(subjects).find(id => task.discipline === id || task.discipline === subjects[id]);
    return id ? `<button class="btn sm agenda-study" type="button" onclick="centralHardSubject('${id}')" aria-label="Estudar ${escapeHtml(subjects[id])}">Estudar</button>` : '';
  }

  function renderHomeSummary() {
    const date = today();
    const tasks = read(date);
    const pending = tasks.filter((task) => !task.done);
    const done = tasks.length - pending.length;
    const percentage = tasks.length ? Math.round((done / tasks.length) * 100) : 0;
    const count = element('dayCount');
    const bar = element('dayBar');
    const percent = element('dayPct');
    const host = element('homeAgenda');
    const pendingHost = element('homePending');
    const todayLabel = element('homeTodayLabel');
    const todayText = element('today');
    const formatted = new Intl.DateTimeFormat('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' }).format(new Date(date + 'T12:00:00'));
    if (todayText) todayText.textContent = formatted.charAt(0).toUpperCase() + formatted.slice(1);
    if (todayLabel) todayLabel.textContent = pending.length ? `${pending.length} pendente(s) para hoje` : (tasks.length ? 'Tudo concluído hoje.' : 'Nenhuma tarefa cadastrada para hoje.');
    if (count) count.textContent = `${done} de ${tasks.length}`;
    if (bar) bar.style.width = `${percentage}%`;
    if (percent) percent.textContent = `${percentage}%`;
    if (host) {
      host.innerHTML = tasks.length ? tasks.map((task) => `
        <div class="agenda-row ${task.done ? 'done' : ''}">
          <input type="checkbox" ${task.done ? 'checked' : ''} onchange="CentralAgenda.toggle('${date}','${escapeHtml(task.id)}',this.checked)">
          <div class="agenda-time">${escapeHtml(task.time || '—')}</div>
          <div class="agenda-copy"><b>${escapeHtml(disciplineLabel(task.discipline))}</b><small>${escapeHtml(task.task)}</small></div>
          ${studyButton(task)}
          <button class="btn sm" type="button" onclick="CentralAgenda.open()">Editar</button>
        </div>`).join('') : '<div class="muted small" style="padding:12px">Agenda de hoje vazia. Toque em Editar para adicionar estudo, questões ou revisão.</div>';
    }
    if (pendingHost) {
      pendingHost.innerHTML = pending.length ? pending.slice(0, 6).map((task) => `
        <div class="pending-item">
          <b>${escapeHtml(task.time || 'Sem horário')} · ${escapeHtml(disciplineLabel(task.discipline))}</b>
          <small>${escapeHtml(task.task)}</small>
        </div>`).join('') + (pending.length > 6 ? '<div class="muted small" style="padding:10px 0">Mais pendências na agenda.</div>' : '') : '<div class="muted small" style="padding:12px 0">Nada pendente para hoje.</div>';
    }
  }

  function render() {
    const host = element('agendaEditor');
    if (!host) return false;
    const date = currentDate();
    const tasks = read(date);
    host.innerHTML = tasks.length ? tasks.map((task) => `
      <div class="agenda-edit-row ${task.done ? 'done' : ''}">
        <span>${escapeHtml(task.time || '—')}</span>
        <span><b>${escapeHtml(disciplineLabel(task.discipline))}</b><br><span class="muted">${escapeHtml(task.task)}</span></span>
        ${studyButton(task)}
        <input type="checkbox" aria-label="Marcar tarefa como concluída" ${task.done ? 'checked' : ''} onchange="CentralAgenda.toggle('${date}','${escapeHtml(task.id)}',this.checked)">
        <button class="btn red sm" type="button" aria-label="Excluir tarefa" onclick="CentralAgenda.remove('${date}','${escapeHtml(task.id)}')">×</button>
      </div>`).join('') : '<div class="muted small agenda-empty">Nenhuma tarefa neste dia.</div>';
    return true;
  }

  function closeMobileMenu() {
    element('centralSidebar')?.classList.remove('mobile-open');
    element('mobileSidebarBackdrop')?.classList.remove('show');
    element('mobileSidebarBackdrop')?.setAttribute('aria-hidden', 'true');
    element('mobileMenuBtn')?.setAttribute('aria-expanded', 'false');
  }

  function open(button = null) {
    VIEW_IDS.forEach((id) => element(id)?.classList.add('hidden'));
    const view = element('agendaView');
    if (!view) return false;
    view.classList.remove('hidden');
    // A Agenda precisa de uma camada própria no Android. O restante da Central
    // usa várias estratégias de posicionamento para módulos e iframes; esta
    // classe evita que essas regras deixem a tela da Agenda com altura zero.
    view.classList.add('central-agenda-visible');
    const crumb = element('crumb');
    if (crumb) crumb.textContent = 'Agenda';
    document.querySelectorAll('#centralSidebar .nav button').forEach((item) => item.classList.remove('active'));
    const activeButton = button || document.querySelector('[data-central-agenda]');
    activeButton?.classList.add('active');
    closeMobileMenu();
    view.scrollTop = 0;
    try { window.scrollTo(0, 0); } catch (_) {}
    currentDate();
    status('');
    render();
    try { window.centralUpdateViewRoute?.('agendaView'); } catch (_) {}
    return false;
  }

  function add() {
    const taskInput = element('agendaTask');
    const task = String(taskInput?.value || '').trim();
    if (!task) {
      status('Digite a tarefa antes de adicionar.', 'warning');
      taskInput?.focus();
      return false;
    }
    const date = currentDate();
    const tasks = read(date);
    tasks.push({
      id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
      time: element('agendaTime')?.value || '',
      discipline: disciplineLabel(element('agendaDisc')?.value || ''),
      task,
      done: false,
    });
    if (write(date, tasks)) {
      taskInput.value = '';
      status('Tarefa adicionada.', 'success');
      render();
      renderHomeSummary();
    }
    return false;
  }

  function toggle(date, id, done) {
    const tasks = read(date);
    const task = tasks.find((item) => String(item.id) === String(id));
    if (task) task.done = Boolean(done);
    if (write(date, tasks)) {
      render();
      renderHomeSummary();
    }
    return false;
  }

  function remove(date, id) {
    const tasks = read(date).filter((item) => String(item.id) !== String(id));
    if (write(date, tasks)) {
      status('Tarefa excluída.', 'success');
      render();
      renderHomeSummary();
    }
    return false;
  }

  const api = { open, add, toggle, remove, render, read, renderHomeSummary };
  window.CentralAgenda = api;
  window.openAgenda = open;
  window.addAgenda = add;
  window.toggleAgenda = toggle;
  window.deleteAgenda = remove;
  window.renderAgendaEditor = render;

  function initialize() {
    const date = element('agendaDate');
    const addButton = element('agendaAddButton');
    if (date) date.onchange = render;
    if (addButton) addButton.onclick = add;
    currentDate();
    renderHomeSummary();
    window.addEventListener('storage', (event) => {
      if (String(event.key || '').startsWith(KEY_PREFIX)) renderHomeSummary();
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initialize, { once: true });
  else initialize();
})();

(function(){
'use strict';
function ov(){return document.getElementById('moduleFrameOverlay')}
function ensure(){
 if(ov())return ov();
 const f=document.getElementById('moduleFrame');
 if(!f)return null;
 const d=document.createElement('div');
 d.id='moduleFrameOverlay';
 d.innerHTML='<div class="mfw-spin"></div><div class="mfw-err"><b style="font-size:15px">Não foi possível carregar este conteúdo.</b><p style="margin:8px 0 12px;font-size:13px;color:var(--muted)">O endereço pode ter saído do ar ou o arquivo pode não existir neste dispositivo. Tente novamente ou volte pela navegação.</p><button class="btn primary" onclick="moduleFrameRetry()">↻ Tentar de novo</button></div>';
 (f.parentElement||document.body).style.position=(f.parentElement&&getComputedStyle(f.parentElement).position!=='static')?getComputedStyle(f.parentElement).position:'relative';
 f.parentElement.appendChild(d);
 return d;
}
let timer=null;
let _curIsPdf=false;
window.moduleFrameWatch=function(url){
 const o=ensure();if(!o)return;
 _curIsPdf=/\.pdf($|[?#])/i.test(String(url||''));
 o.classList.remove('err');o.classList.add('show');
 clearTimeout(timer);
 timer=setTimeout(()=>{const o2=ov();if(o2&&o2.classList.contains('show'))o2.classList.add('err')},9000);
};
window.moduleFrameLoaded=function(){
 const o=ov();if(!o)return;
 const f=document.getElementById('moduleFrame');if(!f)return;
 let ok=true;
 if(_curIsPdf){ok=true}
 else{
  try{
   const doc=f.contentDocument;
   if(!doc)ok=false; // Chrome não expõe doc em falha de carregamento
   else{
    const txt=String(doc.body&&doc.body.textContent||'');
    if(/ERR_[A-Z_]+|file not found/i.test(txt))ok=false;
   }
  }catch(e){ok=true} // cross-origin = carregou conteúdo externo real
 }
 if(ok){clearTimeout(timer);o.classList.remove('show');o.classList.remove('err')}
 else{o.classList.add('err')}
};
window.moduleFrameRetry=function(){
 const f=document.getElementById('moduleFrame');if(!f)return;
 const u=f.src;if(!u)return;
 window.moduleFrameWatch(u);f.src=u;
};
})();
