<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Ativar Premium — Base Completa</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#19354b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(140deg,#f4f8fc,#e6f0f7)}
main{width:min(94vw,480px);padding:32px;background:white;border:1px solid #d9e4ee;border-radius:18px;box-shadow:0 12px 45px #17314d17}
mark{background:#e1f4ef;color:#166550;padding:6px 10px;border-radius:9px;font-size:12px;font-weight:750}
h1{font-size:25px;line-height:1.2;margin:22px 0 10px}p{color:#567087;line-height:1.5}
label{display:block;font-weight:700;font-size:13px;margin:16px 0 6px}
input{width:100%;padding:12px 14px;font:inherit;border:1px solid #b7cbdc;border-radius:9px;color:#19354b}
button{margin:22px 0 6px;padding:13px;width:100%;border:0;border-radius:9px;background:#173b5c;color:white;font:700 15px system-ui;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
a{color:#18598c}small{color:#61768c}
#notice{font-size:13px;min-height:24px;margin-top:16px}#notice.error{color:#a53528}form[hidden]{display:none}
</style></head><body><main>
<mark>BASE COMPLETA PREMIUM</mark>
<h1>Ative seu acesso</h1>
<p>Pagamento aprovado? Crie sua senha para começar a estudar na nossa plataforma.</p>
<div id="notice" role="status" aria-live="polite">Verificando seu link...</div>
<form id="form" hidden autocomplete="on">
<label for="fullname">Seu nome completo</label><input id="fullname" name="name" autocomplete="name" minlength="3" maxlength="120" required>
<label for="password">Crie uma senha</label><input id="password" name="new-password" type="password" minlength="8" maxlength="200" autocomplete="new-password" required>
<label for="confirm">Repita a senha</label><input id="confirm" name="confirm-password" type="password" minlength="8" maxlength="200" autocomplete="new-password" required>
<button id="submit" type="submit">Ativar meu Premium</button>
<small>Seu link é individual e pode ser usado apenas uma vez.</small>
</form>
<p><a href="/login.html">Já tem conta? Entre aqui.</a></p>
</main><script>
(function(){
'use strict';
const notice=document.getElementById('notice'),form=document.getElementById('form');
const submit=document.getElementById('submit');
const fragment=new URLSearchParams(location.hash.slice(1));
const token=fragment.get('token')||'';
history.replaceState(null,'',location.pathname);
function message(text,error){notice.textContent=text;notice.className=error?'error':''}
async function api(action,body){
 const response=await fetch('/api/hotmart-claim?action='+encodeURIComponent(action),{
 method:'POST',credentials:'same-origin',cache:'no-store',
 headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 let result={};try{result=await response.json()}catch(_){}
 if(!response.ok)throw Error(result.error||'Não foi possível concluir');
 return result;
}
(async function(){
 if(!/^[A-Za-z0-9_-]{43}$/.test(token)){message('Link inválido. Verifique o e-mail da Hotmart.',true);return}
 try{
   const result=await api('check',{token});
   if(!result.valid){message('Este link expirou ou já foi utilizado. Se você já tem conta, faça login.',true);return}
   form.hidden=false;message('Link confirmado. Preencha os campos abaixo.');
 }catch(error){message(error.message,true)}
})();
form.addEventListener('submit',async function(event){
 event.preventDefault();
 const name=document.getElementById('fullname').value.trim();
 const password=document.getElementById('password').value;
 if(password!==document.getElementById('confirm').value){message('As senhas digitadas são diferentes.',true);return}
 submit.disabled=true;message('Criando seu acesso...');
 try{
   await api('redeem',{token,name,password});
   message('Acesso ativado. Abrindo sua Central...');
   location.replace('/central-v119.html');
 }catch(error){submit.disabled=false;message(error.message,true)}
});
})();
</script></body></html>
