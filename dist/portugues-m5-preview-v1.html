<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Português M5 — Colocação Pronominal</title>
<style>
body{margin:0;background:#f7f7f3;color:#24282f;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:980px;margin:auto;padding:24px 18px 64px}.top,.card{background:#fffefb;border:1px solid #e1e3de;border-radius:14px;padding:18px;margin-bottom:12px}.top h1{margin:0 0 6px;font-size:24px}.muted{color:#7d8796}.tabs{display:grid;gap:8px;margin:14px 0}.tab{padding:12px 14px;border:1px solid #e1e3de;background:#fffefb;border-radius:10px;text-align:left;font-weight:700}.tab.active{background:#3568d4;color:#fff;border-color:#3568d4}.panel{display:none}.panel.active{display:block}.session{background:#fffefb;border:1px solid #e1e3de;border-radius:12px;margin:9px 0}.session summary{cursor:pointer;padding:14px 16px;font-weight:700}.body{padding:2px 16px 16px;border-top:1px solid #ecece8;line-height:1.62}.body table{width:100%;border-collapse:collapse;margin:12px 0}.body th,.body td{border:1px solid #e1e3de;padding:8px;text-align:left;vertical-align:top}.trap,.exam,.remember,.warning{padding:11px 12px;border-radius:10px;margin:12px 0;background:#f4f5f1}.check{display:flex;gap:8px;margin-top:12px;padding-top:10px;border-top:1px dashed #d9ddd7}.progress{height:7px;background:#ebece8;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:#3568d4}input,select,textarea,button{font:inherit}input,select,textarea{max-width:100%;padding:8px;border:1px solid #d9ddd7;border-radius:8px;background:#fff}textarea{min-height:90px;width:100%;box-sizing:border-box}.card button{padding:8px 12px;border:1px solid #d9ddd7;border-radius:8px;background:#fff;cursor:pointer}.tec-link{display:inline-block;margin-top:10px;padding:9px 12px;border-radius:8px;background:#3568d4;color:#fff;text-decoration:none;font-weight:700}@media(max-width:720px){.wrap{padding:16px 12px 48px}.top h1{font-size:20px}.body table{font-size:14px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><h1>M5 — Colocação Pronominal</h1><p class="muted">Conteúdo consolidado a partir do PDF oficial · versão de produção.</p><div class="progress"><span id="bar"></span></div><p><b id="pct">0%</b> da leitura concluída</p></div>
<div class="tabs"><button class="tab active" data-tab="theory">Teoria · 6 sessões</button><button class="tab" data-tab="review">Revisão ativa</button><button class="tab" data-tab="rounds">R1 · R2 · Final</button><button class="tab" data-tab="spaced">24h · 7d · 30d</button><button class="tab" data-tab="errors">Caderno de erros</button><button class="tab" data-tab="tec">TEC</button></div>
<section id="theory" class="panel active"><div id="m5Theory"></div></section>
<section id="review" class="panel"><div class="card"><h2>Revisão ativa</h2><div id="m5Review"></div></div></section>
<section id="rounds" class="panel"><div class="card"><h2>R1 · R2 · Final</h2><div id="m5Rounds"></div></div></section>
<section id="spaced" class="panel"><div class="card"><h2>Revisões espaçadas</h2><div id="m5Spaced"></div></div></section>
<section id="errors" class="panel"><div class="card"><h2>Caderno de erros</h2><div id="m5Errors"></div></div></section>
<section id="tec" class="panel"><div class="card"><h2>TEC</h2><div id="m5Tec"><p class="muted">Abrindo o caderno oficial já cadastrado na Central quando disponível.</p></div></div></section>
</div>
<script src="portugues-m5-content-v1.js"></script>
<script src="portugues-m5-content-v2.js"></script>
<script src="portugues-m5-runtime-v1.js"></script>
<script>
(function(){
function renderTec(){var host=document.getElementById('m5Tec');if(!host)return;try{var arr=window.TEC_CADERNOS_DATA&&window.TEC_CADERNOS_DATA.cadernos;if(Array.isArray(arr)){var x=arr.find(function(c){return /coloca[cç][aã]o|pronominal/i.test((c.title||'')+' '+(c.name||'')+' '+(c.label||''))});if(x&&x.url){host.innerHTML='<p><b>'+(x.title||x.name||x.label||'Caderno TEC de Colocação Pronominal')+'</b></p><a class="tec-link" href="'+x.url+'" target="_blank" rel="noopener">Abrir TEC ↗</a>';return}}}catch(e){}host.innerHTML='<p class="muted">Use o caderno de Colocação Pronominal já cadastrado na Central.</p>'}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',renderTec);else renderTec();
})();
</script>
</body>
</html>
