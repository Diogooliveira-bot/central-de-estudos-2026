<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Validação da Central — tela pequena e offline</title><style>
*{box-sizing:border-box}body{margin:0;background:#e7eaed;color:#24343e;font:14px/1.5 system-ui,sans-serif}header{padding:12px 20px;background:white;border-bottom:1px solid #ccc;display:flex;flex-wrap:wrap;gap:10px;align-items:center}button{padding:9px 12px;cursor:pointer}main{margin:16px auto;width:390px;max-width:100%;height:780px;border:1px solid #899;box-shadow:0 2px 10px #0002}iframe{border:0;width:100%;height:100%;display:block}#status{display:block;padding:8px 20px}label{display:flex;align-items:center;gap:7px}select{padding:8px}button:disabled{opacity:.5}
</style></head><body><header><strong>Validação em prévia</strong><label>Largura <select id="width"><option value="390">Celular · 390 px</option><option value="360">Celular · 360 px</option><option value="768">Tablet · 768 px</option></select></label><button id="prepare">Preparar cache offline</button><button id="offline" disabled>Simular offline</button><button id="online" disabled>Restaurar conexão</button></header><output id="status">Conexão normal. A página abaixo é a Central real.</output><main id="device"><iframe id="central" title="Central em tela pequena" src="/central-v119.html"></iframe></main><script>
const status=document.getElementById('status'),frame=document.getElementById('central');let worker;
document.getElementById('width').addEventListener('change',e=>document.getElementById('device').style.width=e.target.value+'px');
function call(type){return new Promise((resolve,reject)=>{const channel=new MessageChannel();channel.port1.onmessage=e=>e.data.error?reject(new Error(e.data.error)):resolve(e.data);worker.postMessage({type},[channel.port2]);});}
document.getElementById('prepare').onclick=async()=>{status.textContent='Preparando o cache real da Central…';try{const reg=await navigator.serviceWorker.register('/validation-offline-sw.js',{scope:'/',updateViaCache:'none'});if(reg.installing||reg.waiting)await new Promise(resolve=>{const sw=reg.installing||reg.waiting;sw.addEventListener('statechange',()=>{if(sw.state==='activated')resolve();});});worker=reg.active;if(!worker)throw new Error('Worker ainda indisponível');const result=await call('VALIDATION_PREPARE');status.textContent='Cache preparado: '+result.cached+' arquivos. Recursos necessários: '+(result.missing.length?'faltando '+result.missing.join(', '):'todos disponíveis')+'.';document.getElementById('offline').disabled=result.missing.length>0;}catch(e){status.textContent='Falha: '+e.message;}};
document.getElementById('offline').onclick=async()=>{await call('VALIDATION_OFFLINE');status.textContent='OFFLINE SIMULADO: todas as buscas de rede do worker falham. Central recarregada pelo cache.';frame.src='/central-v119.html';document.getElementById('online').disabled=false;};
document.getElementById('online').onclick=async()=>{await call('VALIDATION_ONLINE');await navigator.serviceWorker.register('/sw.js',{scope:'/',updateViaCache:'none'});status.textContent='Conexão normal restaurada.';};
</script></body></html>
