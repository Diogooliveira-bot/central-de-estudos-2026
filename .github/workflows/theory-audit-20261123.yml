name: Auditoria de teoria e referências — novembro 2026
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/audit-theory-refs-20261123.mjs
      - .github/workflows/theory-audit-20261123.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Auditoria somente leitura
        run: node scripts/audit-theory-refs-20261123.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: auditoria-teoria-questoes-referencias
          path: audits/teoria-20261123/
