name: Etapa 5.2 - Validacao TRT8
on:
  push:
    branches:
      - feature/multi-editais-trt8-2026
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar a transcricao do edital TRT8
        run: node --test tests/trt8-verticalization-unit.mjs
