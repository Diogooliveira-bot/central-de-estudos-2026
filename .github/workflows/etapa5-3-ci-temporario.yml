name: Etapa 5.3 - Testes Multi Editais
on:
  push:
    branches:
      - feature/multi-editais-trt8-2026
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci --ignore-scripts
      - name: Testes completos
        run: npm test
