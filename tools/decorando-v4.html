<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1698c4">
<title>Decorando a Lei Seca — Base Completa</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f6f8;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
#decorandoFrame{display:block;width:100%;height:100%;border:0;background:#f4f6f8}
#backCentral{position:fixed;z-index:2147483647;left:12px;bottom:12px;border:1px solid #dbe1e5;background:rgba(255,255,255,.96);color:#53616b;border-radius:14px;padding:10px 14px;font:800 12px system-ui;box-shadow:0 8px 20px rgba(25,43,58,.10);cursor:pointer}
@media(max-width:520px){#backCentral{left:10px;bottom:10px;padding:9px 12px}}
</style>
</head>
<body>
<iframe id="decorandoFrame" title="Decorando a Lei Seca — Base Completa"></iframe>
<button id="backCentral" type="button">← Central</button>
<script>
(function(){
 const frame=document.getElementById('decorandoFrame');
 frame.src='decorando.html'+location.search+location.hash;
 document.getElementById('backCentral').onclick=function(){location.href='../index.html'};
 frame.addEventListener('load',function(){
   try{
     const d=frame.contentDocument;
     if(!d)return;
     if(!d.getElementById('decorando-base-completa-blue-v4')){
       const link=d.createElement('link');
       link.id='decorando-base-completa-blue-v4';
       link.rel='stylesheet';
       link.href='decorando-blue-v4.css?v=20260929';
       d.head.appendChild(link);
     }
     const patchBrand=function(){
       d.querySelectorAll('.filter-topbar .brand,.sidebar-brand').forEach(function(node){
         const mark=node.querySelector('.brand-mark'); if(mark)mark.textContent='BC';
         const strong=node.querySelector('strong'); if(strong)strong.textContent='Decorando a Lei Seca';
         const span=node.querySelector('span'); if(span&&span!==mark)span.textContent='BASE COMPLETA';
       });
     };
     patchBrand();
     new MutationObserver(patchBrand).observe(d.body,{childList:true,subtree:true});
   }catch(e){}
 });
})();
</script>
</body>
</html>
