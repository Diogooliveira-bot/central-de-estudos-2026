const DATA={"modules":[{"id":"rlm1","num":1,"title":"Números inteiros e racionais","subtitle":"Operações, potenciação e expressões numéricas","questionGaps":["operações com inteiros e racionais","expressões numéricas","potenciação aplicada a problemas"],"summary":"Construa segurança operacional: sinal, prioridade e representação racional. Na prova, o erro costuma nascer da tradução do enunciado ou da ordem das operações, não da conta longa.","theory":[["Conjuntos numéricos","Inteiros incluem negativos, zero e positivos. Racionais são números que podem ser escritos como a/b, com a e b inteiros e b diferente de zero; incluem inteiros, frações e decimais exatos ou periódicos."],["Sinais e operações","Na adição de sinais iguais, somam-se módulos e conserva-se o sinal; em sinais diferentes, subtraem-se módulos e fica o sinal do maior módulo. Em multiplicação e divisão, sinais iguais dão positivo e diferentes dão negativo."],["Expressões numéricas","Resolva agrupamentos de dentro para fora; depois potências; em seguida multiplicações e divisões, da esquerda para a direita; por fim adições e subtrações, também da esquerda para a direita."],["Potenciação","a⁰=1 para a≠0; aᵐ·aⁿ=aᵐ⁺ⁿ; aᵐ/aⁿ=aᵐ⁻ⁿ; (aᵐ)ⁿ=aᵐⁿ. Base negativa entre parênteses muda o sinal conforme a paridade do expoente; −2² significa −(2²)."],["Decimais e frações","Decimal exato vira fração sobre potência de 10 e depois é simplificado. Para comparar racionais, use denominador comum, produto cruzado com denominadores positivos ou forma decimal controlada."]],"method":["Marque os agrupamentos e a prioridade antes de calcular.","Registre o sinal de cada fator separadamente.","Converta tudo para a mesma representação quando comparar.","Faça uma estimativa para detectar resultado impossível."],"formulas":["Prioridade: ( ) → potências → × e ÷ → + e −","(−a)ⁿ é positivo se n for par e negativo se n for ímpar","a⁻ⁿ = 1/aⁿ, para a≠0"],"traps":["Tratar −3² como (+9).","Fazer adição antes de uma divisão à esquerda.","Confundir decimal periódico com irracional."]},{"id":"rlm2","num":2,"title":"Múltiplos, divisores e problemas","subtitle":"Divisibilidade, fatoração, MDC e MMC","questionGaps":["múltiplos e divisores","MDC e MMC","problemas de periodicidade e agrupamento"],"summary":"MDC aparece quando se quer dividir ou agrupar no maior tamanho possível; MMC aparece quando ciclos precisam coincidir ou quando se busca o menor múltiplo comum.","theory":[["Divisibilidade","Por 2: último algarismo par. Por 3 e 9: soma dos algarismos divisível por 3 ou 9. Por 4: últimos dois algarismos. Por 5: termina em 0 ou 5. Por 6: divisível por 2 e 3. Por 8: últimos três algarismos. Por 10: termina em 0."],["Primos e fatoração","Número primo maior que 1 possui exatamente dois divisores positivos. A decomposição em fatores primos torna visíveis todos os divisores, o MDC e o MMC."],["MDC","Na fatoração, use apenas fatores comuns com os menores expoentes. Interpretação típica: maior comprimento de pedaço, maior capacidade de grupo ou maior quantidade por lote sem sobra."],["MMC","Na fatoração, use todos os fatores com os maiores expoentes. Interpretação típica: primeiro reencontro de eventos periódicos, menor quantidade divisível por várias medidas."],["Relação útil","Para dois inteiros positivos a e b: MDC(a,b)·MMC(a,b)=a·b. Use como conferência, não como substituto da leitura do problema."]],"method":["Pergunte se o problema quer repartir no maior padrão ou sincronizar no menor tempo.","Fatore cada número em primos.","Escolha menores expoentes para MDC e maiores para MMC.","Volte à unidade do enunciado."],"formulas":["MDC: fatores comuns com menor expoente","MMC: todos os fatores com maior expoente","MDC(a,b)·MMC(a,b)=a·b"],"traps":["Usar MMC em problema de maior tamanho de grupo.","Esquecer que 1 não é primo.","Aceitar divisão com sobra quando o enunciado exige grupos iguais."]},{"id":"rlm3","num":3,"title":"Frações","subtitle":"Equivalência, operações e problemas","questionGaps":["operações com frações","fração de uma quantidade","problemas com parte, todo e restante"],"summary":"Toda questão de fração tem três perguntas: qual é o todo, qual parte foi tomada e se a nova fração incide sobre o todo inicial ou sobre o restante.","theory":[["Equivalência e simplificação","Multiplicar ou dividir numerador e denominador pelo mesmo número não nulo preserva o valor. Simplifique pelo MDC para chegar à forma irredutível."],["Adição e subtração","Com denominadores iguais, opere os numeradores. Com denominadores diferentes, obtenha denominador comum, preferencialmente pelo MMC, e converta as frações."],["Multiplicação e divisão","Multiplique numeradores e denominadores, simplificando antes quando possível. Dividir por uma fração é multiplicar pelo inverso dela."],["Parte e todo","Para calcular p/q de N, faça N·p/q. Se uma fração é aplicada ao restante, a base mudou: represente as etapas multiplicativamente."],["Comparação","Com denominadores positivos, produto cruzado compara a/b e c/d por ad e bc. Em problemas, confira se frações somadas se referem ao mesmo todo."]],"method":["Defina o todo como 1 ou como uma variável.","Identifique a base de cada fração.","Monte a operação antes de simplificar.","Teste se o resultado está entre 0 e o todo quando o contexto exigir."],"formulas":["a/b + c/d = (ad+bc)/bd","a/b ÷ c/d = a/b · d/c","Restante após fração f: total·(1−f)"],"traps":["Somar numeradores e denominadores diretamente.","Aplicar uma fração do restante sobre o total original.","Inverter a primeira fração na divisão."]},{"id":"rlm4","num":4,"title":"Razões, proporções e regra de três","subtitle":"Divisão proporcional e grandezas","questionGaps":["razões e proporções","divisão em partes proporcionais","regra de três simples e composta"],"summary":"O centro do módulo é reconhecer como as grandezas variam. Só depois de classificar relação direta ou inversa deve-se montar a proporção.","theory":[["Razão","Razão compara duas grandezas por divisão. Uniformize unidades antes de formar a/b. Escala, velocidade média, densidade e produtividade são razões contextualizadas."],["Proporção","a/b=c/d implica ad=bc, com denominadores não nulos. A propriedade fundamental resolve termo desconhecido, mas a proporção precisa representar corretamente o contexto."],["Divisão proporcional direta","Se um total T é dividido na razão a:b:c, as partes são T·a/(a+b+c), T·b/(a+b+c) e T·c/(a+b+c)."],["Divisão inversamente proporcional","Se a divisão é inversa a a, b e c, use pesos 1/a, 1/b e 1/c, reduza-os a uma razão inteira e só então distribua o total."],["Regra de três","Direta: grandezas crescem ou diminuem juntas. Inversa: uma cresce quando a outra diminui. Na composta, compare cada grandeza com a incógnita mantendo as demais constantes."]],"method":["Organize grandezas em colunas e iguale unidades.","Fixe a coluna da incógnita.","Classifique cada relação como direta ou inversa.","Inverta apenas as colunas inversas e resolva."],"formulas":["Proporção: a/b=c/d ⇔ ad=bc","Parte direta: T·peso/soma dos pesos","Velocidade média = distância total/tempo total"],"traps":["Calcular média de velocidades pela média aritmética sem analisar distâncias e tempos.","Inverter todas as razões na regra composta.","Misturar horas com minutos."]},{"id":"rlm5","num":5,"title":"Porcentagem","subtitle":"Variações, taxas sucessivas e problemas","questionGaps":["porcentagem e problemas","aumentos e descontos sucessivos","taxa reversa e comparação percentual"],"summary":"Porcentagem é fator multiplicativo. Aumentos e descontos sucessivos atuam sobre bases diferentes e, por isso, não devem ser somados automaticamente.","theory":[["Conversão","p%=p/100. Para calcular p% de V, use V·p/100. Uma taxa de 12% corresponde ao fator 1,12 no aumento e 0,88 no desconto."],["Variações sucessivas","Aplique fatores em sequência. Aumento de 20% e desconto de 20% gera 1,20·0,80=0,96, isto é, queda líquida de 4%."],["Valor original","Se o valor final F resulta de taxa t, então original=F/(1+t) no aumento ou F/(1−t) no desconto. Não subtraia a taxa do valor final como se a base fosse a mesma."],["Comparação relativa","Se A é p% maior que B, A=B(1+p). O percentual pelo qual B é menor que A usa A como base e não é, em geral, o mesmo p."],["Pontos percentuais","Passar de 20% para 25% é aumento de 5 pontos percentuais, mas crescimento relativo de 25%. A banca examinadora alterna essas duas leituras."]],"method":["Identifique claramente a base de 100%.","Converta a taxa em fator.","Multiplique fatores sucessivos.","Converta o fator final em variação percentual."],"formulas":["Aumento: V(1+t)","Desconto: V(1−t)","Variação líquida: fator final−1"],"traps":["Somar taxas sucessivas.","Confundir percentual com ponto percentual.","Usar o valor final como base de uma taxa aplicada ao valor inicial."]},{"id":"rlm6","num":6,"title":"Relações, conjuntos e diagramas lógicos","subtitle":"Pessoas, lugares, objetos, quantificadores e restrições","questionGaps":["problemas de ordenação e associação fora de proposições categóricas","relações de parentesco, posição e vizinhança"],"summary":"Traduza cada frase para uma restrição visível. O banco local tem 65 questões de concursos de diagramas, proposições categóricas e quantificadores; para associação e ordenação, complemente na plataforma.","theory":[["Modelagem de relações","Crie tabela para pessoa×atributo, linha para ordem e diagrama para inclusão. Marque certezas, exclusões e possibilidades separadamente; não trate ausência de informação como negação."],["Quantificadores","“Todo A é B” significa A⊆B. “Nenhum A é B” significa A∩B=∅. “Algum A é B” exige ao menos um elemento na interseção. “Algum A não é B” exige elemento de A fora de B."],["Negação categórica","Negar “todo A é B” dá “algum A não é B”. Negar “nenhum A é B” dá “algum A é B”. Negar “algum A é B” dá “nenhum A é B”."],["Inclusão e existência","De “todo A é B” não se conclui que exista A. E de A⊆B não se conclui B⊆A. Existência só vem de premissa particular ou informação expressa."],["Restrições combinadas","Em problemas de posições, fixe referências absolutas primeiro, depois relativas. Em associação, escolha a linha/coluna mais restrita e propague exclusões sem adivinhar."]],"method":["Liste entidades e atributos.","Traduza cada premissa em símbolo, tabela ou diagrama.","Propague apenas consequências necessárias.","Teste alternativas procurando um contraexemplo permitido."],"formulas":["Todo A é B: A⊆B","Nenhum A é B: A∩B=∅","Negação de ∀: existe ao menos um contraexemplo"],"traps":["Converter “todo A é B” em “todo B é A”.","Supor existência a partir de uma universal.","Confundir “alguns” com “somente alguns”."]},{"id":"rlm7","num":7,"title":"Raciocínios verbal, matemático e sequencial","subtitle":"Orientação espacial/temporal, conceitos e discriminação","questionGaps":["sequências numéricas e figurais","orientação espacial e temporal","formação de conceitos e discriminação de elementos","raciocínio verbal e matemático aplicado"],"summary":"Procure a regra mais simples que explica todos os termos, não apenas os dois primeiros. Em orientação, escolha um referencial fixo antes de executar movimentos.","theory":[["Sequências","Teste diferenças, razões, alternância, blocos intercalados, posição n e padrões com algarismos. Uma regra válida deve explicar todos os termos fornecidos."],["Raciocínio verbal","Identifique relação entre palavras: categoria, parte-todo, função, causa, oposição ou intensidade. Preserve a mesma direção da relação ao completar analogias."],["Orientação espacial","Desenhe eixos ou rosa dos ventos. Transforme giros em mudanças de direção e deslocamentos em coordenadas; só calcule distância depois do ponto final."],["Orientação temporal","Converta períodos para unidade comum e use ciclos modulares quando houver dias da semana, escalas ou repetições. Diferencie duração de horário de chegada."],["Conceitos e discriminação","Busque a propriedade compartilhada pelo grupo e violada pelo intruso. Prefira critério objetivo e consistente a semelhança superficial."]],"method":["Separe sequências intercaladas quando o padrão oscilar.","Escreva diferenças e segundas diferenças.","Em espaço/tempo, fixe origem e unidade.","Valide a regra em todos os dados e só então projete."],"formulas":["PA: aₙ=a₁+(n−1)r","PG: aₙ=a₁·qⁿ⁻¹","Ciclos: use o resto da divisão pelo tamanho do ciclo"],"traps":["Escolher uma regra que explica apenas o final.","Somar deslocamentos sem considerar direção.","Confundir posição do termo com valor do termo."]},{"id":"rlm8","num":8,"title":"Proposições, equivalências e negações","subtitle":"Conectivos, condicionais e álgebra proposicional","questionGaps":["tabelas-verdade completas fora do recorte de equivalências","classificação de tautologia, contradição e contingência"],"summary":"O banco local oferece 51 questões de concursos deste núcleo. A estratégia mais rápida é reconhecer equivalências-padrão e negar de fora para dentro, respeitando o conectivo principal.","theory":[["Proposição e conectivos","Proposição admite valor verdadeiro ou falso. Conjunção p∧q exige ambas verdadeiras; disjunção inclusiva p∨q exige ao menos uma; condicional p→q só é falsa em V→F; bicondicional exige valores iguais."],["Condicional","p→q equivale a ¬p∨q e à contrapositiva ¬q→¬p. A recíproca q→p e a inversa ¬p→¬q não são equivalentes em geral."],["Negações de conectivos","¬(p∧q)=¬p∨¬q; ¬(p∨q)=¬p∧¬q; ¬(p→q)=p∧¬q. Na bicondicional, a negação exige valores diferentes."],["“Se e somente se”","p↔q equivale a (p→q)∧(q→p) e também a (p∧q)∨(¬p∧¬q)."],["Tradução verbal","“Somente se” introduz condição necessária; “se” introduz condição suficiente. Antes da álgebra, nomeie proposições simples e localize o conectivo principal."]],"method":["Nomeie as proposições simples.","Coloque parênteses para revelar o conectivo principal.","Aplique a equivalência ou negação correspondente.","Volte ao português e compare todas as partes da alternativa."],"formulas":["p→q ≡ ¬p∨q ≡ ¬q→¬p","¬(p→q) ≡ p∧¬q","¬(p∧q) ≡ ¬p∨¬q","¬(p∨q) ≡ ¬p∧¬q"],"traps":["Negar condicional como ¬p→¬q.","Confundir contrapositiva com recíproca.","Ler “ou” sempre como exclusivo."]},{"id":"rlm9","num":9,"title":"Argumentos e conclusões válidas","subtitle":"Hipóteses, inferências e métodos da tabela-verdade","questionGaps":["problemas gerais de hipótese e conclusão sem formalização proposicional","validade por contraexemplo em estruturas não categóricas"],"summary":"O banco local oferece 84 questões de concursos de argumentos. Validade significa: não existe situação em que todas as premissas sejam verdadeiras e a conclusão falsa.","theory":[["Validade","Argumento válido preserva verdade das premissas para a conclusão. Isso não exige que as premissas sejam de fato verdadeiras, apenas que a combinação premissas verdadeiras/conclusão falsa seja impossível."],["Modus ponens","De p→q e p, conclui-se q. Afirmar o antecedente é regra válida. Afirmar o consequente para concluir p é falácia."],["Modus tollens","De p→q e ¬q, conclui-se ¬p. Negar o consequente é válido. Negar o antecedente para concluir ¬q é falácia."],["Encadeamento","De p→q e q→r, conclui-se p→r. No silogismo disjuntivo, de p∨q e ¬p, conclui-se q, considerando a disjunção inclusiva."],["Teste sistemático","Para verificar validade por tabela, procure linha com todas as premissas V e conclusão F. Se não existir, o argumento é válido. Em questões verbais, derive consequências antes de olhar alternativas."]],"method":["Formalize premissas e conclusão.","Comece por fatos simples e condicionais acionadas.","Propague modus ponens, modus tollens e cadeias.","Se necessário, tente construir contraexemplo com premissas verdadeiras e conclusão falsa."],"formulas":["p→q, p ⟹ q","p→q, ¬q ⟹ ¬p","p→q, q→r ⟹ p→r","p∨q, ¬p ⟹ q"],"traps":["Afirmar o consequente.","Negar o antecedente.","Confundir conclusão possível com conclusão necessária."]}],"questions":[]};const KEY='central-v6:rlm-disciplina-v6637';let session=null;const letters=['A','B','C','D','E'];function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}let RLM_MEMORY_STATE={answers:{},modules:{}};function state(){try{const raw=RLM_STORAGE.getItem(KEY);if(raw){const parsed=JSON.parse(raw);RLM_MEMORY_STATE=parsed;return parsed}}catch(e){}return RLM_MEMORY_STATE}function save(s){RLM_MEMORY_STATE=s;try{RLM_STORAGE.setItem(KEY,JSON.stringify(s))}catch(e){}updateStats()}function qFor(id){return DATA.questions.filter(q=>q.module===id)}function updateStats(){const s=state(),answered=Object.keys(s.answers||{}).length;document.getElementById('doneStat').textContent=Math.round(answered/Math.max(1,DATA.questions.length)*100)+'%'}function renderHome(){document.getElementById('moduleGrid').innerHTML=DATA.modules.map(m=>{const n=qFor(m.id).length;return '<article class="card" role="button" tabindex="0" data-rlm-module="'+m.id+'" onclick="openModule(&quot;'+m.id+'&quot;)"><div class="num">MÓDULO '+String(m.num).padStart(2,'0')+'</div><h3>'+esc(m.title)+'</h3><p class="muted">'+esc(m.subtitle)+'</p><span class="badge '+(n?'real':'gap')+'">'+(n?n+' questões de concursos':'complementar questões')+'</span></article>'}).join('');updateStats()}function showHome(){session=null;document.getElementById('home').style.display='block';document.getElementById('moduleView').classList.remove('active');document.getElementById('quizView').classList.remove('active');try{history.replaceState(null,'',location.pathname)}catch(e){}}function openModule(id){const m=DATA.modules.find(x=>x.id===id),qs=qFor(id),v=document.getElementById('moduleView');document.getElementById('home').style.display='none';document.getElementById('quizView').classList.remove('active');v.classList.add('active');v.innerHTML='<div class="module-head"><div><button class="back" onclick="showHome()">← Voltar ao mapa</button><div class="num">MÓDULO '+String(m.num).padStart(2,'0')+'</div><h2>'+esc(m.title)+'</h2><p class="muted">'+esc(m.subtitle)+'</p></div><span class="ba     return fastQuestionBase('proporcoes','termo-proporcao',`Determine x: ${a}/${b} = ${c}/x`,fastNumericOptions(rng,ans),`Produto dos meios igual ao dos extremos: ${a}x=${b}×${c}. Logo, x=${ans}.`);
  }
  const scale=fastPick(rng,[2,5,10,20]),map=fastInt(rng,2,9),ans=map*scale;
  return fastQuestionBase('proporcoes','escala',`Em uma escala na qual 1 cm representa ${scale} km, uma distância de ${map} cm representa quantos quilômetros?`,fastNumericOptions(rng,ans,fastNumberText,scale),`Relação direta: ${map}×${scale}=${ans} km.`);
}

function fastGeneratePercent(rng) {
  const type=fastInt(rng,0,5);
  const rates=[5,10,12.5,20,25,30,40,50,75];
  if(type===0){
    const p=fastPick(rng,rates),base=fastPick(rng,[40,60,80,100,120,160,200,240,300,400]),ans=base*p/100;
    return fastQuestionBase('porcentagem','percentual-valor',`Quanto é ${fastNumberText(p)}% de ${base}?`,fastNumericOptions(rng,ans),`${p}% = ${p/100}. Atalho: calcule 10%, 5%, 25% ou 50% e componha. Resultado: ${fastNumberText(ans)}.`);
  }
  if(type===1){
    const p=fastPick(rng,[10,20,25,30,40]),price=fastPick(rng,[80,100,120,160,200,240]),ans=price*(1-p/100);
    return fastQuestionBase('porcentagem','desconto',`Um produto de ${fastCurrency(price)} recebeu desconto de ${p}%. Qual é o novo preço?`,fastNumericOptions(rng,ans,fastCurrency,Math.max(1,price*p/100)),`O fator de desconto é ${fastNumberText(1-p/100)}. ${price}×${fastNumberText(1-p/100)}=${fastCurrency(ans)}.`);
  }
  if(type===2){
    const p=fastPick(rng,[10,20,25,30,50]),value=fastPick(rng,[40,60,80,100,120,160,200]),ans=value*(1+p/100);
    return fastQuestionBase('porcentagem','aumento',`Um valor de ${fastCurrency(value)} aumentou ${p}%. Qual é o novo valor?`,fastNumericOptions(rng,ans,fastCurrency,Math.max(1,value*p/100)),`Use o fator 1+${p}/100=${fastNumberText(1+p/100)}. Resultado: ${fastCurrency(ans)}.`);
  }
  if(type===3){
    const p=fastPick(rng,[10,20,25,50]),original=fastPick(rng,[80,100,120,160,200,240]),final=original*(1-p/100);
    return fastQuestionBase('porcentagem','valor-original',`Após desconto de ${p}%, o preço ficou em ${fastCurrency(final)}. Qual era o preço original?`,fastNumericOptions(rng,original,fastCurrency,Math.max(1,original*p/100)),`O valor final é ${100-p}% do original. Divida ${fastCurrency(final)} por ${fastNumberText(1-p/100)}: ${fastCurrency(original)}.`);
  }
  if(type===4){
    const p=fastPick(rng,[10,20,25,40,50]),old=fastPick(rng,[40,80,100,120,160,200]),now=old*(1+p/100);
    return fastQuestionBase('porcentagem','taxa-variacao',`Um valor passou de ${fastNumberText(old)} para ${fastNumberText(now)}. Qual foi o aumento percentual?`,fastNumericOptions(rng,p,fastPercent,5),`A variação foi ${fastNumberText(now-old)}. Divida pela base inicial: ${fastNumberText(now-old)}/${old}=${fastNumberText(p/100)}, isto é, ${p}%.`);
  }
  const p1=fastPick(rng,[10,20,25,30]),p2=fastPick(rng,[10,20,25]),factor=(1+p1/100)*(1-p2/100),ans=(factor-1)*100;
  return fastQuestionBase('porcentagem','taxas-sucessivas',`Um preço aumentou ${p1}% e depois recebeu desconto de ${p2}%. Qual foi a variação percentual total?`,fastNumericOptions(rng,ans,fastPercent,5),`Multiplique os fatores: ${fastNumberText(1+p1/100)}×${fastNumberText(1-p2/100)}=${fastNumberText(factor)}. Variação total: ${fastPercent(ans)}.`);
}

function fastGenerateQuestion(blockId, seed, index = 0) {
  const rng=fastRng((Number(seed)||1) + index*104729);
  let actual=blockId;
  if(blockId==='misto') actual=fastPick(rng,['operacoes','divisibilidade','fracoes','proporcoes','porcentagem']);
  const generators={operacoes:fastGenerateOperations,divisibilidade:fastGenerateDivisibility,fracoes:fastGenerateFractions,proporcoes:fastGenerateProportions,porcentagem:fastGeneratePercent};
  const q=generators[actual](rng);
  const goal=(FAST_BLOCKS.find(b=>b.id===blockId)||FAST_BLOCKS.find(b=>b.id===actual)).goal;
  return {...q,id:`fast-${blockId}-${seed}-${index}-${q.template}`,sessionBlock:blockId,goalSeconds:goal,seed,index,retry:false};
}
function fastValidateQuestion(q) {
  return !!q && typeof q.prompt==='string' && q.prompt.length>4 && Array.isArray(q.options) && q.options.length===5 && new Set(q.options).size===5 && Number.isInteger(q.answerIndex) && q.answerIndex>=0 && q.answerIndex<5 && q.options[q.answerIndex]===q.answer && q.kind==='authorial-mechanical' && q.label.includes('NÃO É QUESTÃO FCC') && q.explanation.length>10;
}

function fastFreshState(){return {version:1,startedAt:null,attempts:[],sessions:[],reasonCounts:{conta:0,demora:0,conhecimento:0,interpretacao:0}}}
function fastLoadState(){try{return {...fastFreshState(),...JSON.parse(RLM_STORAGE.getItem(FAST_STORAGE_KEY)||'{}')}}catch(e){return fastFreshState()}}
function fastSaveState(s){RLM_STORAGE.setItem(FAST_STORAGE_KEY,JSON.stringify(s));fastUpdateHero()}
function fastMedian(values){if(!values.length)return 0;const a=[...values].sort((x,y)=>x-y),m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2}
function fastBlockStats(id){
  const a=fastLoadState().attempts.filter(x=>x.block===id),correct=a.filter(x=>x.correct).length,times=a.map(x=>x.ms/1000);
  return {attempts:a.length,correct,accuracy:a.length?Math.round(correct/a.length*100):0,median:times.length?Math.round(fastMedian(times)*10)/10:0,slow:a.filter(x=>x.slow).length};
}
function fastCurrentDay(){const s=fastLoadState();if(!s.startedAt)return 1;return Math.min(21,Math.max(1,Math.floor((Date.now()-new Date(s.startedAt).getTime())/86400000)+1))}
function fastEsc(value=''){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fastUpdateHero(){
  if(typeof document==='undefined')return;const el=document.getElementById('fastHeroStat');if(!el)return;
  const s=fastLoadState();el.textContent=s.sessions.length?`${s.sessions.length} sessão(ões) concluída(s)`:'Começar treino de velocidade';
}
function fastHideOtherViews(){
  const home=document.getElementById('home'),module=document.getElementById('moduleView'),quiz=document.getElementById('quizView');
  if(home)home.style.display='none';if(module)module.classList.remove('active');if(quiz)quiz.classList.remove('active');
}
function openFastHome(){fastStopTimer();fastSession=null;fastHideOtherViews();const v=document.getElementById('fastView');v.classList.add('active');location.hash='calculo';fastRenderHome();window.scrollTo({top:0,behavior:'smooth'})}
function fastClose(){fastStopTimer();const v=document.getElementById('fastView');if(v)v.classList.remove('active');if(window.fastOriginalShowHome)window.fastOriginalShowHome();else if(window.showHome)window.showHome()}
function fastRenderHome(){
  const v=document.getElementById('fastView'),s=fastLoadState(),day=fastCurrentDay(),today=FAST_PLAN[day-1],tb=FAST_BLOCKS.find(b=>b.id===today);
  v.innerHTML=`<button class="back" onclick="fastClose()">← Voltar ao mapa de RLM</button>
  <section class="fast-hero"><div><div class="eyebrow">CÁLCULO RÁPIDO • TREINO MECÂNICO AUTORAL</div><h2>Ganhar velocidade nas contas simples</h2><p>Exercícios gerados para automatizar cálculo. São exercícios autorais de treino mecânico, não questões de banca.</p></div><div class="fast-day"><small>DIA DO CICLO</small><b>${day}/21</b></div></section>
  <div class="fast-rule"><b>Regra do treino:</b> sem calculadora. Responda, veja o caminho mais curto e classifique o motivo quando errar ou ultrapassar a meta.</div>
  <section class="fast-today"><div><span>Treino sugerido de hoje</span><h3>${fastEsc(tb.title)}</h3><small>15 questões • meta média de ${tb.goal}s por questão</small></div><button class="btn primary" onclick="fastStart('${tb.id}',15)">Iniciar treino do dia</button></section>
  <div class="fast-tabs"><button class="active" onclick="fastRenderHome()">Treinos</button><button onclick="fastRenderReport()">Desempenho</button><button onclick="fastRenderPlan()">Plano de 21 dias</button></div>
  <div class="fast-grid">${FAST_BLOCKS.map(b=>{const st=fastBlockStats(b.id);return `<article class="fast-block" style="--fast-color:${b.color}"><div class="fast-block-num">${String(b.num).padStart(2,'0')}</div><h3>${fastEsc(b.title)}</h3><p>${fastEsc(b.note)}</p><div class="fast-block-stats"><span><b>${st.attempts}</b> tentativas</span><span><b>${st.accuracy}%</b> acerto</span><span><b>${st.median||'—'}</b>${st.median?'s':''} mediana</span></div><div class="fast-actions"><button class="btn" onclick="fastStart('${b.id}',10)">10 questões</button><button class="btn primary" onclick="fastStart('${b.id}',15)">15 questões</button></div></article>`}).join('')}</div>
  <div class="fast-footer-actions"><button class="btn" onclick="fastRenderReport()">Ver relatório completo</button><button class="btn danger" onclick="fastReset()">Zerar somente Cálculo Rápido</button></div>`;
}
function fastStart(blockId,count=15,seed=Date.now()){
  fastStopTimer();let s=fastLoadState();if(!s.startedAt)s.startedAt=new Date().toISOString();fastSaveState(s);
  const list=[];for(let i=0;i<count;i++){let q=fastGenerateQuestion(blockId,seed,i);let guard=0;while(list.some(x=>x.prompt===q.prompt)&&guard++<20)q=fastGenerateQuestion(blockId,seed+guard*997,i);if(!fastValidateQuestion(q))throw new Error('questão mecânica inválida');list.push(q)}
  fastSession={blockId,seed,list,index:0,initialCount:count,correct:0,answered:false,lastAttemptId:null,startedAt:Date.now()};fastRenderQuestion();
}
function fastStopTimer(){if(fastTimerHandle){clearInterval(fastTimerHandle);fastTimerHandle=null}}
function fastTick(){if(!fastSession||fastSession.answered)return;const e=document.getElementById('fastTimer');if(!e)return;const sec=(Date.now()-fastSession.questionStartedAt)/1000;e.textContent=`${fastNumberText(sec,1)} s`;e.classList.toggle('over',sec>fastSession.list[fastSession.index].goalSeconds)}
function fastRenderQuestion(){
  fastStopTimer();fastHideOtherViews();const v=document.getElementById('fastView');v.classList.add('active');const q=fastSession.list[fastSession.index],b=FAST_BLOCKS.find(x=>x.id===fastSession.blockId);fastSession.answered=false;fastSession.questionStartedAt=Date.now();
  v.innerHTML=`<button class="back" onclick="fastEndEarly()">← Encerrar sessão</button><div class="fast-progress"><span style="width:${Math.round(fastSession.index/fastSession.list.length*100)}%"></span></div>
  <section class="fast-question"><div class="fast-qtop"><div><span>${fastEsc(q.label)}</span><b>${fastEsc(b.short)} • ${q.retry?'REPETIÇÃO':'QUESTÃO '+(fastSession.index+1)}</b></div><div class="fast-clock"><small>META ${q.goalSeconds}s</small><strong id="fastTimer">0,0 s</strong></div></div><div class="fast-prompt">${fastEsc(q.prompt)}</div><div class="fast-options">${q.options.map((x,i)=>`<button data-fast-option="${i}" onclick="fastAnswer(${i})"><b>${String.fromCharCode(65+i)}</b><span>${fastEsc(x)}</span></button>`).join('')}</div><div id="fastFeedback"></div><div class="fast-session-foot"><span>${fastSession.index+1} de ${fastSession.list.length}${fastSession.list.length>fastSession.initialCount?' • repetições adicionadas':''}</span><button id="fastNext" class="btn primary" style="display:none" onclick="fastNext()">Próxima</button></div></section>`;
  fastTimerHandle=setInterval(fastTick,100);fastTick();window.scrollTo({top:0,behavior:'smooth'});
}
function fastAnswer(index){
  if(!fastSession||fastSession.answered)return;fastSession.answered=true;fastStopTimer();const q=fastSession.list[fastSession.index],ms=Date.now()-fastSession.questionStartedAt,correct=index===q.answerIndex,slow=ms>q.goalSeconds*1000,attemptId=`${Date.now()}-${fastSession.index}-${q.id}`;
  if(correct)fastSession.correct++;
  document.querySelectorAll('[data-fast-option]').forEach(btn=>{const i=Number(btn.dataset.fastOption);btn.disabled=true;if(i===q.answerIndex)btn.classList.add('correct');if(i===index&&!correct)btn.classList.add('wrong')});
  const state=fastLoadState();state.attempts.push({id:attemptId,date:new Date().toISOString(),block:fastSession.blockId,actualBlock:q.block,template:q.template,correct,slow,ms,goalSeconds:q.goalSeconds,reason:null,retry:q.retry});if(state.attempts.length>1000)state.attempts=state.attempts.slice(-1000);fastSaveState(state);fastSession.lastAttemptId=attemptId;
  let retryAdded=false;if((!correct||slow)&&!q.retry){fastSession.list.push({...q,id:`${q.id}-retry`,retry:true});retryAdded=true}
  const needsReason=!correct||slow,fb=document.getElementById('fastFeedback');fb.innerHTML=`<div class="fast-feedback ${correct&&!slow?'good':correct?'slow':'bad'}"><div class="fast-feedback-title"><b>${correct?'Resposta correta':'Resposta incorreta'}</b><span>${fastNumberText(ms/1000,1)}s • meta ${q.goalSeconds}s</span></div><p><strong>Resposta:</strong> ${fastEsc(q.answer)}</p><p>${fastEsc(q.explanation)}</p>${needsReason?`<div class="fast-reasons"><small>O que aconteceu?</small>${Object.entries(FAST_REASONS).map(([id,label])=>`<button data-fast-reason="${id}" onclick="fastTagReason('${id}')">${label}</button>`).join('')}</div>`:''}${retryAdded?'<div class="fast-retry-note">↻ Esta mesma conta voltará no fim da sessão.</div>':''}</div>`;document.getElementById('fastNext').style.display='inline-block';
}
function fastTagReason(reason){
  if(!FAST_REASONS[reason]||!fastSession?.lastAttemptId)return;const s=fastLoadState(),a=s.attempts.find(x=>x.id===fastSession.lastAttemptId);if(!a)return;if(a.reason&&s.reasonCounts[a.reason])s.reasonCounts[a.reason]--;a.reason=reason;s.reasonCounts[reason]=(s.reasonCounts[reason]||0)+1;fastSaveState(s);document.querySelectorAll('[data-fast-reason]').forEach(b=>b.classList.toggle('selected',b.dataset.fastReason===reason));
}
function fastAutoReason(){
  if(!fastSession?.lastAttemptId)return;const s=fastLoadState(),a=s.attempts.find(x=>x.id===fastSession.lastAttemptId);if(a&&!a.reason){const r=a.slow?'demora':a.correct?null:'conta';if(r){a.reason=r;s.reasonCounts[r]=(s.reasonCounts[r]||0)+1;fastSaveState(s)}}
}
function fastNext(){fastAutoReason();if(fastSession.index+1<fastSession.list.length){fastSession.index++;fastRenderQuestion()}else fastFinish()}
function fastFinish(){
  fastAutoReason();fastStopTimer();const block=FAST_BLOCKS.find(x=>x.id===fastSession.blockId),attempts=fastSession.list.length,score=fastSession.correct,pct=Math.round(score/attempts*100),s=fastLoadState(),sessionAttempts=s.attempts.filter(x=>new Date(x.date).getTime()>=fastSession.startedAt&&x.block===fastSession.blockId),median=Math.round(fastMedian(sessionAttempts.map(x=>x.ms/1000))*10)/10;
  s.sessions.push({date:new Date().toISOString(),block:fastSession.blockId,initialQuestions:fastSession.initialCount,totalAttempts:attempts,correct:score,accuracy:pct,medianSeconds:median});if(s.sessions.length>200)s.sessions=s.sessions.slice(-200);fastSaveState(s);
  document.getElementById('fastView').innerHTML=`<section class="fast-result"><div class="eyebrow">SESSÃO CONCLUÍDA • ${fastEsc(block.title)}</div><strong>${pct}%</strong><p>${score} acertos em ${attempts} tentativas • mediana de ${fastNumberText(median,1)}s</p><div class="fast-result-grid"><div><b>${fastSession.initialCount}</b><small>questões iniciais</small></div><div><b>${attempts-fastSession.initialCount}</b><small>repetições</small></div><div><b>${block.goal}s</b><small>meta por questão</small></div></div><div class="fast-actions center"><button class="btn" onclick="fastRenderReport()">Ver desempenho</button><button class="btn primary" onclick="fastStart('${block.id}',15)">Treinar novamente</button><button class="btn" onclick="openFastHome()">Voltar aos blocos</button></div></section>`;
}
function fastEndEarly(){if(!fastSession||confirm('Encerrar esta sessão antes do fim?'))openFastHome()}
function fastWeakestBlock(){return FAST_BLOCKS.slice(0,5).map(b=>({...b,stats:fastBlockStats(b.id)})).filter(x=>x.stats.attempts).sort((a,b)=>(a.stats.accuracy-b.stats.accuracy)||(b.stats.median/a.goal-a.stats.median/b.goal))[0]||FAST_BLOCKS[0]}
function fastRenderReport(){
  fastStopTimer();fastHideOtherViews();const v=document.getElementById('fastView'),s=fastLoadState(),weak=fastWeakestBlock(),reasons=Object.entries(FAST_REASONS).map(([id,label])=>({id,label,n:s.reasonCounts?.[id]||0})).sort((a,b)=>b.n-a.n);
  v.classList.add('active');v.innerHTML=`<button class="back" onclick="openFastHome()">← Voltar aos treinos</button><section class="fast-report-head"><div><div class="eyebrow">DESEMPENHO</div><h2>Velocidade e precisão</h2><p>Use a mediana para evitar que uma única conta muito demorada distorça o diagnóstico.</p></div><button class="btn primary" onclick="fastStart('${weak.id}',15)">Treinar ponto mais fraco</button></section><div class="fast-tabs"><button onclick="fastRenderHome()">Treinos</button><button class="active" onclick="fastRenderReport()">Desempenho</button><button onclick="fastRenderPlan()">Plano de 21 dias</button></div><div class="fast-report-grid">${FAST_BLOCKS.map(b=>{const x=fastBlockStats(b.id),speed=x.median?(x.median<=b.goal?'Dentro da meta':'Acima da meta'):'Sem dados';return `<article><span>${fastEsc(b.short)}</span><b>${x.accuracy}%</b><small>${x.correct}/${x.attempts} acertos</small><div class="fast-meter"><i style="width:${Math.min(100,x.accuracy)}%"></i></div><p>Mediana: <strong>${x.median?fastNumberText(x.median,1)+'s':'—'}</strong> • meta ${b.goal}s<br>${speed} • ${x.slow} tentativa(s) lenta(s)</p><button class="btn" onclick="fastStart('${b.id}',15)">Treinar</button></article>`}).join('')}</div><section class="fast-reason-report"><h3>Motivos registrados</h3>${reasons.map(r=>`<div><span>${fastEsc(r.label)}</span><b>${r.n}</b></div>`).join('')}</section><section class="fast-history"><h3>Últimas sessões</h3>${s.sessions.length?s.sessions.slice(-12).reverse().map(x=>{const b=FAST_BLOCKS.find(y=>y.id===x.block);return `<div><span><b>${fastEsc(b?.short||x.block)}</b><small>${new Date(x.date).toLocaleDateString('pt-BR')}</small></span><strong>${x.accuracy}% • ${fastNumberText(x.medianSeconds,1)}s</strong></div>`}).join(''):'<p class="muted">Conclua a primeira sessão para iniciar o histórico.</p>'}</section>`;
}
function fastRenderPlan(){
  fastStopTimer();fastHideOtherViews();const v=document.getElementById('fastView'),day=fastCurrentDay();v.classList.add('active');v.innerHTML=`<button class="back" onclick="openFastHome()">← Voltar aos treinos</button><section class="fast-report-head"><div><div class="eyebrow">PLANO DE 21 DIAS</div><h2>15 minutos por dia</h2><p>3 minutos de aquecimento, 8 minutos de contas cronometradas e 4 minutos para rever o caminho mais curto.</p></div></section><div class="fast-tabs"><button onclick="fastRenderHome()">Treinos</button><button onclick="fastRenderReport()">Desempenho</button><button class="active" onclick="fastRenderPlan()">Plano de 21 dias</button></div><div class="fast-plan">${FAST_PLAN.map((id,i)=>{const b=FAST_BLOCKS.find(x=>x.id===id),n=i+1;return `<article class="${n===day?'today':''} ${n<day?'past':''}"><span>DIA ${String(n).padStart(2,'0')}</span><b>${fastEsc(b.short)}</b><small>${n<=7?'Base operacional':n<=14?'Aplicação e proporcionalidade':'Mistura sob pressão'}</small><button onclick="fastStart('${id}',15)">${n===day?'Treinar hoje':'Abrir'}</button></article>`}).join('')}</div>`;
}
function fastReset(){if(confirm('Zerar apenas o histórico do Cálculo Rápido? As questões de concursos, Anki e Lei em Dia não serão alterados.')){RLM_STORAGE.removeItem(FAST_STORAGE_KEY);fastRenderHome();fastUpdateHero()}}
function fastInit(){
  window.fastOriginalShowHome=window.showHome;
  if(window.showHome)window.showHome=function(){fastStopTimer();const v=document.getElementById('fastView');if(v)v.classList.remove('active');return window.fastOriginalShowHome()};
  fastUpdateHero();if(location.hash==='#calculo')openFastHome();
}

globalThis.RLM_FAST_ENGINE={FAST_BLOCKS,FAST_PLAN,fastGenerateQuestion,fastValidateQuestion,fastGcd,fastLcm,fastFrac,fastBlockStats};
if(typeof document!=='undefined')fastInit();

</script>
