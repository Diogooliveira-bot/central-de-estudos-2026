<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agenda — harness responsivo</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:24px;background:#e8edf3;color:#172033;font:14px/1.5 system-ui,sans-serif}h1{margin:0 0 20px}section{margin:0 0 28px}h2{margin:0 0 8px;font-size:15px}iframe{display:block;height:800px;max-width:none;border:2px solid #93a4b8;border-radius:10px;background:#fff}
  </style>
</head>
<body>
  <h1>Agenda — validação responsiva</h1>
  <section><h2 id="label"></h2><iframe id="preview" title="Preview responsivo"></iframe></section>
  <script>
    const requested = Number(new URLSearchParams(location.search).get('width'));
    const width = [390, 820, 1200].includes(requested) ? requested : 1200;
    const labels = {390: 'Celular', 820: 'Tablet', 1200: 'Desktop'};
    document.getElementById('label').textContent = `${labels[width]} · ${width} px`;
    const frame = document.getElementById('preview');
    frame.style.width = `${width}px`;
    frame.src = `/central-v119.html?direct=33&responsive=${labels[width].toLowerCase()}`;
  </script>
</body>
</html>
