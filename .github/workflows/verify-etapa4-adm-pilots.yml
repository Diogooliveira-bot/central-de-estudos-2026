name: Padronização Premium — pilotos ADM M01 M08 M20

on:
  push:
    branches: [preview/legal-complete-premium-v1-20261025]
    paths:
      - '.github/workflows/verify-etapa4-adm-pilots.yml'
      - 'tests/etapa4-adm-pilots-browser.mjs'
      - 'ui/adm-native-layer.js'
      - 'ui/native-reading-session.js'
      - 'ui/legal-complete-premium-v1.css'
      - 'ui/legal-complete-premium-v1.js'
      - 'content/adm/m*-approved-complete.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bc-etapa4-adm-pilots
  cancel-in-progress: true

jobs:
  chromium:
    if: github.repository == 'Diogooliveira-bot/central-de-estudos-2026'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch somente-leitura
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Instalar dependências sem scripts
        run: npm ci --ignore-scripts
      - name: Verificar sintaxe
        run: node --check tests/etapa4-adm-pilots-browser.mjs && node --check ui/adm-native-layer.js
      - name: Regressões editor/tema e proteção
        run: node --test tests/adm-m03-premium-preview-unit.mjs tests/legal-complete-premium-theme-unit.mjs tests/etapa3-premium-pilots-unit.mjs
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercitar leitores ADM em 390 768 1366
        run: node tests/etapa4-adm-pilots-browser.mjs
      - name: Guardar evidências do navegador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etapa4-adm-m01-m08-m20-chromium
          path: artifacts/etapa4-adm-pilotos/*
          if-no-files-found: ignore
          retention-days: 14
