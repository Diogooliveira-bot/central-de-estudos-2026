<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101826">
  <title>Base Completa — Português</title>
  <style>
    :root{--ink:#172033;--muted:#697586;--line:#e3e7ee;--panel:#fff;--canvas:#f4f6f9;--accent:#6856e8;--accent-soft:#edeaff}
    *{box-sizing:border-box}html{background:var(--canvas)}body{margin:0;color:var(--ink);background:var(--canvas);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    button,input{font:inherit}.pt-site-header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:68px;padding:12px max(20px,calc((100vw - 1120px)/2));border-bottom:1px solid var(--line);background:rgba(255,255,255,.94);backdrop-filter:blur(12px)}
    .pt-brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--ink);text-decoration:none;letter-spacing:-.025em}.pt-brand-mark{display:grid;place-items:center;width:31px;height:31px;border-radius:9px;color:white;background:linear-gradient(135deg,#7865f6,#4f46c8);font-size:17px}.pt-brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em}
    .pt-font-control{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}.pt-font-control label{font-weight:700;color:var(--ink)}.pt-font-control input{width:116px;accent-color:var(--accent)}#pt-font-value{display:inline-block;min-width:38px;font-weight:800;color:var(--accent)}
    main{width:min(1120px,100%);margin:0 auto;padding:34px 20px 72px}.pt-dashboard{display:flex;justify-content:space-between;gap:32px;padding:29px 30px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(120deg,#fff,#fafaff);box-shadow:0 12px 36px rgba(31,42,64,.06)}.eyebrow{margin:0 0 8px;color:#6c5de9;font-size:11px;font-weight:850;letter-spacing:.11em}.pt-dashboard h1{margin:0;letter-spacing:-.05em;font-size:clamp(32px,5vw,50px)}.pt-lead{margin:10px 0 0;color:var(--muted);font-size:15px;line-height:1.55}.pt-summary{display:grid;align-content:center;min-width:160px;padding-left:28px;border-left:1px solid var(--line)}.pt-summary strong{font-size:36px;letter-spacing:-.05em}.pt-summary span{font-weight:700}.pt-summary small{margin-top:6px;color:var(--muted)}
    .pt-modules-section{margin-top:30px}.pt-section-title{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:0 0 14px}.pt-section-title h2{margin:0;font-size:22px;letter-spacing:-.025em}.pt-section-title>p{margin:0;color:var(--muted);font-size:13px}
    .cf-modules{display:grid;gap:10px}.cf-module{overflow:hidden;border:1px solid #dfe4ec;border-radius:15px;background:var(--panel);box-shadow:0 2px 5px rgba(24,34,53,.025)}.cf-module.open{border-color:#bcb4ff;box-shadow:0 10px 28px rgba(104,86,232,.12)}.cf-module-head{display:grid;grid-template-columns:112px minmax(0,1fr) auto 24px;align-items:center;gap:16px;width:100%;min-height:68px;padding:13px 18px;border:0;background:transparent;color:var(--ink);text-align:left;cursor:pointer}.cf-module-head:hover{background:#fafaff}.cf-module-no{font-size:11px;font-weight:850;color:#6556d3;letter-spacing:.06em}.cf-module-title{font-size:16px;font-weight:800}.cf-module-stat{font-size:12px;color:var(--muted);white-space:nowrap}.chev{font-size:20px;color:#7c8798;transition:transform .18s ease}.cf-module.open .chev{transform:rotate(180deg)}.cf-module-body{display:none;padding:0 18px 22px}.cf-module.open .cf-module-body{display:block}.cf-module-bar{height:3px;margin:0 0 18px;border-radius:99px;background:#eceef2}.cf-module-bar span{display:block;width:0;height:100%;background:var(--accent);border-radius:inherit}.pt-native-host{min-height:0}.pt-native-loading,.pt-native-error{padding:22px;border:1px dashed #bfc6d1;border-radius:12px;background:#fbfcff;color:var(--muted)}.pt-native-error{border-style:solid;color:#4b5565}.pt-native-error strong{display:block;color:#b42318}.pt-native-error button{padding:9px 13px;border:0;border-radius:8px;background:#5f55cf;color:white;cursor:pointer}
    .pt-native-surface{overflow:hidden;border-radius:12px;--line:#e1e3de;--panel:#fffefb;--text:#24282f}.pt-native-surface .back{display:none!important}
    @media(max-width:720px){.pt-site-header{min-height:60px;padding:8px 16px}.pt-brand small{display:none}.pt-font-control label{display:none}.pt-font-control input{width:85px}main{padding:20px 13px 42px}.pt-dashboard{display:block;padding:23px 20px;border-radius:16px}.pt-summary{display:flex;align-items:baseline;gap:7px;min-width:0;margin-top:18px;padding:14px 0 0;border-left:0;border-top:1px solid var(--line)}.pt-summary strong{font-size:27px}.pt-summary small{margin:0 0 0 auto}.pt-section-title{align-items:start;flex-direction:column;margin-top:24px}.cf-module-head{grid-template-columns:88px minmax(0,1fr) 20px;gap:9px;min-height:62px;padding:12px 14px}.cf-module-stat{display:none}.cf-module-title{font-size:14px}.cf-module-body{padding:0 10px 14px}.pt-native-surface{border-radius:9px}}
  </style>
</head>
<body>
  <header class="pt-site-header">
    <a class="pt-brand" href="/portugues" aria-label="Início de Português"><span class="pt-brand-mark">B</span><span>Base Completa<small>PORTUGUÊS</small></span></a>
    <div class="pt-font-control"><label for="pt-font-size">Fonte</label><input id="pt-font-size" type="range" min="85" max="250" step="5" value="100" aria-label="Tamanho da fonte"><output id="pt-font-value" for="pt-font-size">100%</output></div>
  </header>
  <main id="pt-standalone-app" aria-live="polite"></main>
  <script src="/portugues-site.js?v=20260921ptsite1"></script>
</body>
</html>
