name: Importar Central v6.6.75

on:
  push:
    paths:
      - 'Central_de_Estudos_v6.6.75_PLANO_6_MESES.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair versão v6.6.75
        shell: bash
        run: |
          set -euo pipefail
          ZIP='Central_de_Estudos_v6.6.75_PLANO_6_MESES.zip'
          test -f "$ZIP"
          rm -rf _import_v675
          mkdir _import_v675
          unzip -q -o "$ZIP" -d _import_v675
          SRC='_import_v675/Central_de_Estudos_OFFLINE_FUNCIONAL'
          test -f "$SRC/index.html"
          test -f "$SRC/tools/cronograma.html"
          test -f "$SRC/api/backups.js"

          # Remove a estrutura antiga da aplicação, preservando GitHub e o ZIP de importação.
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name "$ZIP" \
            ! -name '_import_v675' \
            -exec rm -rf {} +

          cp -a "$SRC"/. ./
          rm -rf _import_v675

      - name: Validar arquivos essenciais
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s tools/cronograma.html
          test -s tools/anki.html
          test -s tools/decorando.html
          test -s tools/vade.html
          test -s tools/rlm.html
          test -s modules/trabalho/AJAJ_DIREITO_TRABALHO.pdf
          test -s modules/trabalho/AJAJ_PROCESSUAL_TRABALHO.pdf
          grep -q 'Plano de 6 meses' tools/cronograma.html

      - name: Registrar v6.6.75 no repositório
        shell: bash
        run: |
          git config user.name 'Central Deploy'
          git config user.email 'deploy@central.local'
          git add -A
          git diff --cached --quiet || git commit -m 'v6.6.75: plano de 6 meses + backup geral'
          git push
