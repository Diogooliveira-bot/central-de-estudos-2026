name: Verificar e-mails transacionais (sem credenciais)

on:
  push:
    branches:
      - feature/emails-transacionais-v1-20261031
  pull_request:
    branches:
      - release/cadastro-gratuito-production-20261030

permissions:
  contents: read

jobs:
  emails:
    name: Renderização, links e segurança
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9d4203235b5b1d4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run transactional e-mail tests
        run: npm run test:emails
