name: Penal V3 isolated regression
on:
  push:
    branches:
      - feature/penal-v3-safe-20261023
    paths:
      - 'content/penal/**'
      - 'ui/penal-teoria-guiada-*.js'
      - 'tests/penal-teoria-guiada-v3-*.mjs'
      - 'package.json'
      - '.github/workflows/penal-v3-validation.yml'
  pull_request:
    paths:
      - 'content/penal/**'
      - 'ui/penal-teoria-guiada-*.js'
      - 'tests/penal-teoria-guiada-v3-*.mjs'
      - 'central-v119.html'
      - 'package.json'
      - '.github/workflows/penal-v3-validation.yml'
permissions:
  contents: read
jobs:
  penal-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Tests of V3 contents, quizzes and DOM
        run: node --test tests/penal-teoria-guiada-v3-unit.mjs tests/penal-teoria-guiada-v3-dom.mjs
      - name: Full regressions
        run: npm test
