<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Usuários — Base Completa</title>
<style>
:root{--bg:#f3efe7;--panel:#fffdf9;--ink:#312d29;--muted:#756d66;--line:#d9d1c7;--purple:#6d5b88;--green:#2d7655;--red:#a14747}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}.shell{max-width:1100px;margin:auto;padding:28px 20px 60px}
.top{display:flex;gap:14px;align-items:center;justify-content:space-between;margin-bottom:24px}.top h1{margin:0;font:600 30px/1.15 Georgia,serif}.top p{margin:4px 0 0;color:var(--muted)}.actions{display:flex;gap:8px}
button,.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:9px 12px;font-weight:750;cursor:pointer;text-decoration:none}.primary{background:var(--purple);border-color:var(--purple);color:#fff}.danger{color:var(--red)}
.grid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 12px 30px rgba(69,56,45,.05)}h2{font-size:15px;margin:0 0 14px}
label{display:block;font-size:11px;font-weight:800;margin:12px 0 5px;color:#5f5751}input,select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;color:var(--ink)}.hint{font-size:11px;color:var(--muted);margin-top:8px}.status{min-height:20px;margin-top:10px;font-size:12px;color:var(--muted)}.status.err{color:var(--red)}.status.ok{color:var(--green)}
.list{display:grid;gap:10px}.user{border:1px solid var(--line);border-radius:12px;padding:13px;display:grid;grid-template-columns:minmax(0,1fr) 130px 92px auto;gap:10px;align-items:center;background:#fff}.who b{display:block}.who small{color:var(--muted)}.pill{display:inline-block;margin-top:5px;padding:3px 7px;border-radius:999px;background:#eee8f2;color:#5f4d75;font-size:10px;font-weight:800}.inactive{opacity:.62}.row-actions{display:flex;gap:6px;justify-content:flex-end}.row-actions button{padding:7px 9px;font-size:11px}
@media(max-width:800px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.user{grid-template-columns:1fr 1fr}.row-actions{grid-column:1/-1;justify-content:flex-start}}
</style>
</head>
<body>
<div class="shell">
<header class="top">
<div><h1>Usuários</h1><p>Administre os acessos da Base Completa.</p></div>
<div class="actions"><a class="btn" href="/">← Voltar à Central</a><button id="logout">Sair</button></div>
</header>
<div class="grid">
<section class="panel">
<h2>Adicionar usuário</h2>
<form id="createForm">
<label for="name">Nome</label><input id="name" required>
<label for="email">E-mail</label><input id="email" type="email" required>
<label for="role">Perfil</label><select id="role"><option value="aluno">Aluno</option><option value="editor">Editor</option><option value="admin">Administrador</option></select>
<label for="password">Senha inicial</label><input id="password" type="password" minlength="8" required>
<button class="primary" type="submit" style="width:100%;margin-top:15px">Criar usuário</button>
<div class="hint">Cadastro fechado: só administradores podem criar novas contas.</div>
<div id="formStatus" class="status"></div>
</form>
</section>
<section class="panel">
<h2>Usuários cadastrados</h2>
<div id="users" class="list"><div class="hint">Carregando...</div></div>
</section>
</div>
</div>
<script>
(function(){
'use strict';
var host=document.getElementById('users'),formStatus=document.getElementById('formStatus'),currentUserId='';
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function status(el,text,type){el.textContent=text||'';el.className='status'+(type?' '+type:'')}
async function api(opt){var r=await fetch('/api/users',opt||{}),j={};try{j=await r.json()}catch(_){}if(!r.ok){if(r.status===401)location.replace('/login.html?next=/usuarios.html');throw new Error(j.error||('HTTP '+r.status))}return j}
function render(users){
 host.innerHTML='';
 if(!users.length){host.innerHTML='<div class="hint">Nenhum usuário cadastrado.</div>';return}
 users.forEach(function(u){
  var row=document.createElement('div');row.className='user'+(u.active?'':' inactive');row.dataset.id=u.id;
  row.innerHTML='<div class="who"><b>'+esc(u.name)+'</b><small>'+esc(u.email)+'</small><span class="pill">'+esc(u.role.toUpperCase())+'</span></div>'+
   '<select class="role"><option value="aluno">Aluno</option><option value="editor">Editor</option><option value="admin">Administrador</option></select>'+
   '<label style="margin:0;display:flex;gap:6px;align-items:center;font-size:11px"><input class="active" type="checkbox" style="width:auto"> Ativo</label>'+
   '<div class="row-actions"><button class="save">Salvar</button><button class="reset">Nova senha</button></div>';
  row.querySelector('.role').value=u.role;row.querySelector('.active').checked=!!u.active;
  if(u.id===currentUserId){row.querySelector('.role').disabled=true;row.querySelector('.active').disabled=true}
  row.querySelector('.save').onclick=async function(){
   try{await api({method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'update',userId:u.id,role:row.querySelector('.role').value,active:row.querySelector('.active').checked})});await load()}
   catch(e){alert(e.message)}
  };
  row.querySelector('.reset').onclick=async function(){
   var p=prompt('Digite a nova senha (mínimo 8 caracteres):');if(!p)return;
   try{await api({method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'reset-password',userId:u.id,password:p})});alert('Senha atualizada.')}
   catch(e){alert(e.message)}
  };
  host.appendChild(row);
 })
}
async function load(){
 try{var j=await api();currentUserId=j.currentUserId||'';render(j.users||[])}
 catch(e){host.innerHTML='<div class="status err">'+esc(e.message)+'</div>'}
}
document.getElementById('createForm').addEventListener('submit',async function(e){
 e.preventDefault();status(formStatus,'Criando...');
 try{
  await api({method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'create',name:document.getElementById('name').value,email:document.getElementById('email').value,role:document.getElementById('role').value,password:document.getElementById('password').value})});
  e.target.reset();document.getElementById('role').value='aluno';status(formStatus,'Usuário criado.','ok');await load();
 }catch(err){status(formStatus,err.message,'err')}
});
document.getElementById('logout').onclick=async function(){await fetch('/api/auth?action=logout',{method:'POST'});location.replace('/login.html')};
load();
})();
</script>
</body>
</html>
