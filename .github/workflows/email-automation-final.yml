name: Email automation final isolated tests
on:
  push:
    branches:
      - feature/email-automation-final-20261110
  pull_request:
    paths:
      - 'lib/email-weekly-automation.js'
      - 'lib/email-study-snapshots.js'
      - 'api/admin-dashboard.js'
      - 'tests/email-weekly-final-unit.mjs'
permissions:
  contents: read
jobs:
  email-final:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/email-weekly-final-unit.mjs tests/email-operations-unit.mjs
      - run: npm run test:emails
      - run: npm run test:hotmart-webhook
