name: Publicar v6.6.79 - Portugues com migracao

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_portugues_flashcards.py'
      - 'data/flashcards_portugues_part*.csv'
      - 'tools/anki-migrate-v6679.js'
      - 'sync-client.js'
      - '.github/workflows/publish-v6677-portugues.yml'

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Organizar Portugues e instalar migracao
        run: python scripts/apply_portugues_flashcards.py

      - name: Validar versao gerada
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          html = Path('tools/anki.html').read_text(encoding='utf-8')
          marker = 'window.ANKI_SITE_DATA = '
          pos = html.index(marker) + len(marker)
          data, _ = json.JSONDecoder().raw_decode(html[pos:])

          def raiz(deck):
              return (deck or '').split('::', 1)[0].strip().upper()

          pt = [c for c in data['cards'] if raiz(c.get('deck')) == '03 PORTUGUÊS']
          assert len(pt) == 160, len(pt)
          assert all(c.get('source') == 'flashcards_portugues_medio_dificil.csv' for c in pt)
          semanas = {c['deck'].split('::')[1] for c in pt}
          assert semanas == {f'SEMANA {i:02d}' for i in range(1, 17)}, semanas
          assert all(len(c['deck'].split('::')) >= 3 for c in pt)

          removidas = {'06 LEGISLAÇÃO', '99 ARQUIVO FORA DO EDITAL', 'QUESTÕES', 'RLM'}
          for nome in removidas:
              assert not any(raiz(c.get('deck')) == nome for c in data['cards']), nome
              assert not any(raiz(d) == nome for d in data.get('decks', [])), nome

          assert data['version'] == '6.6.79-portugues-organizado'
          assert './anki-migrate-v6679.js?v=6679' in html
          assert Path('tools/anki-migrate-v6679.js').exists()
          sw = Path('sw.js').read_text(encoding='utf-8')
          assert 'central-v6680' in sw
          assert 'sync-client.js?v=6679' in sw
          assert 'anki-migrate-v6679.js?v=6679' in sw
          sync = Path('sync-client.js').read_text(encoding='utf-8')
          assert '__centralAnkiMigrated6679' in sync
          assert "versao:'v6.6.79'" in sync

          print('Validação OK')
          print('Português: 160 cards / 16 semanas / Semana -> Tópico')
          print('Migração local+nuvem: v6679')
          print('Total geral:', data['totalCards'])
          PY

      - name: Publicar arquivos integrados no main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/anki.html sw.js
          if git diff --cached --quiet; then
            echo 'Nenhuma alteracao adicional.'
          else
            git commit -m 'Publica v6.6.79 — migração do Anki no tablet [skip ci]'
            git push origin main
          fi
