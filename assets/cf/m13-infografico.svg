 </g><rect x="70" y="95" rx="26" width="300" height="170" fill="#f7e9f2"/><text x="94" y="135" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#2f2b28">Art. 170</text><text x="94" y="171" font-family="Arial, sans-serif" font-size="17" fill="#4f4a46">Trabalho humano + livre</text><text x="94" y="196" font-family="Arial, sans-serif" font-size="17" fill="#4f4a46">iniciativa. Existência digna e</text><text x="94" y="221" font-family="Arial, sans-serif" font-size="17" fill="#4f4a46">justiça social.</text><rect x="430" y="70" rx="26" width="300" height="170" fill="#fff1c9"/><text x="454" y="110" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#2f2b28">Princípios</text><text x="454" y="146" font-family="Arial, sans-serif" font-size="17" fill="#4f4a46">Livre concorrência, consumidor,</text><text x="454" y="171" font-family="Arial, sans-serif" font-size="17" fill="#4f4a46">meio ambiente, desigualdades e</text><text x="454" y="196" font-family="Arial, sans-serif" font-size="17" fill="#4f4a46">pleno emprego.</text><rect x="820" y="95" rx="26" width="300" height="170" fill="#e3f3e7"/><text x="844" y="135" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#2f2b28">Art. 173</text><text x="844" y="171" font-family="Arial, sans-serif" font-size="17" fill="#4f4a46">Estado empresário: atuação direta</text><text x="844" y="196" font-family="Arial, sans-serif" font-size="17" fill="#4f4a46">excepcional e regime competitivo.</text><rect x="80" y="480" rx="26" width="300" height="170" fill="#e8eefc"/><text x="104" y="520" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#2f2b28">Art. 174</text><text x="104" y="556" font-family="Arial, sans-serif" font-size="17" fill="#4f4a46">Estado regulador: fiscalização,</text><text x="104" y="581" font-family="Arial, sans-serif" font-size="17" fill="#4f4a46">incentivo e planejamento.</text><rect x="435" y="520" rx="26" width="300" height="170" fill="#efe8f8"/><text x="459" y="560" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#2f2b28">Art. 175</text><text x="459" y="596" font-family="Arial, sans-serif" font-size="17" fill="#4f4a46">Serviços públicos: prestação</text><text x="459" y="621" font-family="Arial, sans-serif" font-size="17" fill="#4f4a46">direta ou concessão/permissão com</text><text x="459" y="646" font-family="Arial, sans-serif" font-size="17" fill="#4f4a46">licitação.</text><rect x="825" y="480" rx="26" width="300" height="170" fill="#e4f4f2"/><text x="849" y="520" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#2f2b28">Arts. 176–181</text><text x="849" y="556" font-family="Arial, sans-serif" font-size="17" fill="#4f4a46">Minerais, monopólios, pequenas</text><text x="849" y="581" font-family="Arial, sans-serif" font-size="17" fill="#4f4a46">empresas, turismo e ouro.</text></svg>