name: Download Three Vade Mecum PDFs

on:
  pull_request:
    paths:
      - "scripts/download_vademecum_three.py"
      - ".github/workflows/download-vademecum-three.yml"
  workflow_dispatch:

jobs:
  download-three:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/download_vademecum_three.py
      - uses: actions/upload-artifact@v4
        with:
          name: VadeMecum_3_Faltantes
          path: three_missing
          if-no-files-found: error
          retention-days: 7
