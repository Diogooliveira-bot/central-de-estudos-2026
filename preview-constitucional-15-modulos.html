<script>
const SOURCE=[{"n":1,"title":"Constituição, normas constitucionais e princípios fundamentais","full":"LEITURA ORIENTADA\n\nUm governador afirma que seu Estado pode separar-se do Brasil. Um candidato diz que uma Constituição rígida nunca muda. Uma pessoa conclui que um direito só existe depois que o Congresso aprovar uma lei. As três afirmações parecem tratar de assuntos diferentes, mas dependem da mesma base: compreender como a Constituição organiza o poder e produz efeitos.\n\nEste módulo não pede que você apenas reconheça palavras. Ao final, você deverá explicar por que uma lei precisa respeitar a Constituição, como distinguir normas de eficácia plena, contida e limitada, o que o poder constituinte pode fazer e como separar os fundamentos dos objetivos e dos princípios internacionais do Brasil.\n\nSe estiver começando: estude as aulas na ordem. Antes de olhar a resposta comentada, tente explicar o caso em uma frase. Se aparecer um termo novo, procure sua função: o que ele muda na solução? Não é necessário dominar controle de constitucionalidade ou processo legislativo inteiro para acompanhar este módulo.\n\nSe já tiver base: comece pelos testes de compreensão. Uma resposta correta sem justificativa indica reconhecimento, não domínio. Use os aprofundamentos para revisar os limites de cada regra, principalmente recepção, normas originárias, cláusulas pétreas e Preâmbulo.\n\nRoteiro de leitura da Constituição: Preâmbulo e arts. 1º a 4º; art. 5º, XIII, como exemplo de eficácia contida; arts. 18, 25 e 29, para autonomia; art. 32, para o Distrito Federal; art. 60, para reforma. Os dispositivos adicionais são apoio explicativo, não uma ampliação para estudar toda a organização do Estado. [1]\n\nComo usar a apostila: leia uma aula; explique o contraste principal sem consultar; resolva o pequeno caso; só então avance. Ao concluir a completa, faça as dez questões. Use a resumida para retomar a estrutura e faça as cinco questões de revisão. O checklist final marca capacidades demonstradas, não apenas páginas lidas.\n\nAs explicações de lei seca são paráfrases, salvo trechos identificados como texto constitucional. As questões e situações são autorais. As referências distinguem legislação, jurisprudência e classificações doutrinárias. O material enviado foi a base temática; as fontes oficiais serviram à conferência jurídica.\n\n1. PARA QUE EXISTE UMA CONSTITUIÇÃO\n\n1.1. O PROBLEMA VEM ANTES DO CONCEITO\n\nImagine que o governante pudesse criar suas próprias competências, eliminar eleições e impedir qualquer contestação. Teríamos poder político, mas faltaria um parâmetro superior capaz de organizar e limitar sua atuação. A Constituição responde a esse problema: define como o Estado se estrutura, quem pode decidir e quais direitos devem ser protegidos.\n\nConstitucionalismo é o movimento de limitação do poder político associado à proteção de direitos. Não basta existir um documento com o título Constituição. Para compreender a ideia, pergunte se o poder está efetivamente sujeito a limites e se há mecanismos para proteger as pessoas contra o arbítrio.\n\nNo constitucionalismo moderno, ganham destaque as Constituições escritas, a separação dos Poderes e as declarações de direitos. No contemporâneo, reforça-se a compreensão da Constituição como norma jurídica vinculante e a importância dos direitos fundamentais e da jurisdição constitucional. Essa descrição é um roteiro histórico de estudo, não uma divisão em épocas sem continuidade.\n\nConstituição, em sentido jurídico amplo, é o conjunto de normas fundamentais sobre organização do Estado, exercício do poder e proteção de direitos. A Constituição brasileira não é um conselho ao legislador. Uma lei precisa ser produzida pela autoridade competente, pelo procedimento exigido e com conteúdo compatível com ela.\n\nExemplo explicado. Se uma lei pretende permitir que uma autoridade faça exatamente o que a Constituição proíbe, o problema não se resolve dizendo que a lei foi aprovada depois. Uma norma inferior posterior não altera, por si só, a Constituição. É preciso observar a posição das normas, não apenas suas datas.\n\nAprofundamento. Constituição em sentido material se identifica pelo conteúdo: organização do poder e direitos fundamentais, por exemplo. Constituição em sentido formal se identifica pela inserção no conjunto de normas com forma e hierarquia constitucionais. Uma disposição detalhada que não trate do núcleo material pode continuar sendo formalmente constitucional. Isso ajuda a compreender por que o texto da CF/88 disciplina muitos assuntos.\n\nTeste de compreensão. Um país possui um documento chamado Constituição, mas seus governantes não aceitam limites jurídicos. O nome do documento basta para realizar o ideal do constitucionalismo?"},{"n":2,"title":"Direitos e deveres individuais e coletivos","full":"LEITURA ORIENTADA\n\nUma pessoa quer realizar uma manifestação em uma praça. Outra teve um dado pessoal registrado incorretamente. Uma terceira foi presa sem fundamento válido. Todas podem invocar direitos fundamentais, mas o problema e a solução jurídica são diferentes em cada situação.\n\nEste módulo ensina a fazer essa ligação entre a Constituição e o caso concreto. Primeiro, você compreenderá como os direitos fundamentais funcionam. Depois, estudará os principais direitos e garantias do art. 5º e os remédios constitucionais que os protegem.\n\nAo concluir, você deverá conseguir: explicar uma regra com suas próprias palavras; reconhecer seus requisitos e exceções; comparar institutos próximos; resolver casos sem depender apenas de palavras decoradas.\n\nSe estiver começando: siga a ordem das aulas. Leia o caso, tente responder à pergunta de compreensão e só então confira o comentário. Quando encontrar uma expressão jurídica nova, retorne à explicação em que ela foi apresentada.\n\nSe já tiver uma base: faça as perguntas antes da leitura. Se acertar e conseguir justificar, avance aos aprofundamentos e às comparações. Acertar por reconhecimento visual não equivale a saber aplicar a regra.\n\nComo estudar: trabalhe uma aula por vez. Ao terminar, feche o material e explique a diferença central do assunto em voz alta. Volte ao texto quando não conseguir justificar uma resposta. As questões finais usam apenas conteúdos desenvolvidos neste módulo e são autorais, sem atribuição a bancas.\n\nComo ler as fontes: as referências numéricas remetem ao final da apostila. O texto diferencia a regra constitucional, a explicação didática e a interpretação jurisprudencial. As sínteses da lei seca são paráfrases de estudo; a leitura do texto oficial continua necessária.\n\n1. Direitos fundamentais e suas características\n2. Aplicação dos direitos e tratados de direitos humanos\n3. Titulares, igualdade e legalidade\n4. Vida, liberdade e personalidade\n5. Inviolabilidade do domicílio\n6. Sigilos e proteção de dados\n7. Reunião e associação\n8. Propriedade e segurança jurídica\n9. Acesso à justiça e garantias processuais\n10. Garantias penais e direitos do preso\n11. Petição, certidões e informação\n12. Remédios constitucionais\n13. Lei seca e jurisprudência explicadas\n14. Dez questões de aplicação\n15. Conteúdo resumido e cinco questões de revisão\n16. Revisão ativa e referências\n"},{"n":3,"title":"Direitos sociais, nacionalidade e direitos políticos","full":"LEITURA ORIENTADA\n\nImagine quatro situações. Uma trabalhadora quer saber quais proteções mínimas a Constituição lhe garante. Uma pessoa nascida no exterior pergunta se é brasileira nata. Um prefeito pretende disputar o governo do Estado. Um partido quer registrar seu estatuto e acessar recursos públicos. Embora pareçam problemas separados, todos exigem o mesmo método: identificar a regra constitucional, localizar a exceção e descobrir qual consequência jurídica muda o caso.\n\nSe estiver começando, estude os quatro blocos na ordem desta apostila. Em cada um, primeiro compreenda a lógica; depois memorize listas, idades e prazos. Se já possui base, use os casos resolvidos e as questões para testar se consegue justificar a resposta sem depender apenas de palavras-chave.\n\nO módulo considera a Constituição atualizada até 22 de outubro de 2026, inclusive as alterações recentes sobre jornada de trabalho e repouso semanal promovidas pela EC 141/2026. Em prova que indique data anterior, observe o marco temporal do enunciado.\n\nPERCURSO DO MÓDULO\n\n• Aula 1 • Direitos sociais e a lógica da igualdade material.\n\n• Aula 2 • Direitos dos trabalhadores e números que mudam o gabarito.\n\n• Aula 3 • Liberdade sindical, greve e representação no local de trabalho.\n\n1 DIREITOS SOCIAIS E IGUALDADE MATERIAL\n\n1.1 O QUE OS DIREITOS SOCIAIS FAZEM\n\nDireitos sociais não são apenas nomes reunidos em uma lista. Eles procuram reduzir desigualdades reais e criar condições mínimas para que a liberdade possa ser exercida. Por isso, alguns exigem prestações do Estado, como políticas de saúde e educação; outros protegem relações de trabalho; e outros funcionam como liberdades coletivas, a exemplo da associação sindical e da greve.\n\nCaso explicado. Dizer que uma pessoa é livre para estudar pouco resolve se ela não possui acesso à escola. A igualdade material pergunta quais condições concretas permitem que a liberdade exista. Essa é a chave para entender por que direitos sociais integram o catálogo de direitos fundamentais.\n\n1.2 ARTIGO 6º E O NÚCLEO GERAL\n\nO art. 6º reúne educação, saúde, alimentação, trabalho, moradia, transporte, lazer, segurança, previdência social, proteção à maternidade e à infância e assistência aos desamparados. O rol orienta o estudo, mas não esgota todos os direitos sociais existentes na Constituição. Direitos trabalhistas, liberdade sindical e greve também pertencem ao tema, embora apareçam nos artigos seguintes.\n\nDireito   Como compreender   Exemplo de incidência\nEducação e saúde   Prestação pública e garantia de acesso   Escola pública e atendimento pelo sistema de saúde\nTrabalho e previdência   Proteção da vida profissional e dos riscos sociais   Seguro-desemprego e benefícios previdenciários\nMoradia e transporte   Condições materiais de vida e mobilidade   Políticas habitacionais e transporte acessível\nMaternidade infância e assistência   Proteção de situações de vulnerabilidade   Benefício assistencial e políticas de proteção"},{"n":4,"title":"Organização do Estado","full":"LEITURA ORIENTADA\n\nPense em três problemas. Um Estado quer editar regra sobre matéria nacional. Um Município pretende organizar um serviço local. O Governo Federal cogita intervir em uma unidade da Federação. Para resolver cada caso, não basta reconhecer o nome do ente: é preciso descobrir de onde vem a competência, qual é o limite da autonomia e se a Constituição autorizou a medida.\n\nEste módulo funciona como um mapa. Primeiro, identifica quem integra a Federação. Depois, mostra quais tarefas e leis pertencem a cada ente. Por fim, explica quando a autonomia pode ser temporariamente restringida por intervenção. A sequência evita o erro mais comum de prova: decorar artigos sem compreender a função de cada um.\n\nSe estiver começando, use a regra de bolso 21 faz, 22 legisla privativamente, 23 todos fazem, 24 União Estados e DF legislam concorrentemente, 25 guarda o residual estadual e 30 cuida do interesse local. Se já possui base, concentre-se nos limites, nas exceções e na jurisprudência.\n\nPERCURSO DO MÓDULO\n\n• Aula 1 • Federação soberania autonomia e indissolubilidade.\n\n• Aula 2 • União Estados Distrito Federal Municípios e Territórios.\n\n• Aula 3 • Alterações territoriais e vedações federativas.\n\n1 FEDERAÇÃO E AUTONOMIA\n\n1.1 O QUE É FORMA DE ESTADO\n\nForma de Estado descreve como o poder político se distribui no território. No Estado unitário há um centro político principal. Na Federação existem diferentes centros autônomos com competências definidas pela Constituição. Isso não significa vários países dentro do Brasil: o Estado brasileiro permanece uno e soberano no plano internacional.\n\nCaso explicado. Um governador não pode declarar independência do Estado. A autonomia permite organizar governo, editar normas e administrar matérias próprias; não concede soberania nem direito de separação.\n\nElemento   Federação   Confederação\nFundamento   Constituição   Tratado entre membros\nVínculo   Indissolúvel e sem direito de secessão   Pode admitir retirada conforme o pacto\nPoder dos membros   Autonomia constitucional   Soberania preservada pelos membros\nSolução de conflitos   Órgão jurisdicional constitucional   Mecanismos previstos no tratado\n\nA forma federativa é protegida como cláusula pétrea. A Constituição rígida, a repartição de competências, a representação dos Estados no Senado, a solução judicial de conflitos federativos e a intervenção excepcional ajudam a preservar o pacto.\n\n1.2 SOBERANIA NÃO É AUTONOMIA"},{"n":5,"title":"Administração Pública e servidores públicos","full":"LEITURA ORIENTADA\n\nImagine três situações. Um candidato aprovado dentro das vagas aguarda nomeação. Um gestor deseja contratar pessoas sem concurso para uma necessidade permanente. Um servidor causa dano a um cidadão durante o serviço. As respostas não vêm de uma única regra: é preciso identificar o princípio, o tipo de vínculo, a exceção constitucional e, quando houver, a tese do STF.\n\nO módulo foi organizado como uma sequência de decisões. Primeiro você compreende quem compõe a Administração e quais princípios controlam sua atuação. Depois classifica cargos, empregos e funções, analisa ingresso, remuneração e acumulação. Ao final, conecta responsabilidade, improbidade, estabilidade e previdência.\n\nSe estiver começando, use os exemplos e as regras de bolso. Se já possui base, concentre-se nas atualizações de 2024 a 2026: ADI 2.135, Tema 1.164, EC 138/2025 e EC 140/2026.\n\nPERCURSO DO MÓDULO\n\n• Aula 1 • Administração em sentido subjetivo e objetivo.\n\n• Aula 2 • Princípios expressos e implícitos.\n\n• Aula 3 • Cargos empregos funções e concurso público.\n\n1 COMO ENXERGAR A ADMINISTRAÇÃO PÚBLICA\n\n1.1 QUEM ATUA E O QUE É FEITO\n\nA função administrativa é típica do Executivo, mas Legislativo e Judiciário também a exercem quando organizam pessoal, contratos e serviços internos. Por isso, o art. 37 alcança a Administração direta e indireta de todos os Poderes e de todos os entes federativos.\n\nSentido   Pergunta   Conteúdo\nSubjetivo ou orgânico   Quem exerce a atividade   Órgãos e entidades administrativas\nObjetivo ou material   O que a Administração faz   Serviço público polícia administrativa fomento e intervenção\n\nCaso explicado. Um tribunal realiza concurso para servidores. Julgar processos é sua função típica jurisdicional; organizar o concurso e gerir pessoal é atividade administrativa atípica, sujeita ao art. 37.\n\n1.2 ADMINISTRAÇÃO DIRETA E INDIRETA\n\nEstrutura   Composição   Personalidade jurídica\nAdministração direta   Órgãos da União Estados DF e Municípios   O órgão não possui personalidade própria\nAdministração indireta   Autarquias fundações empresas públicas e sociedades de economia mista   A entidade possui personalidade própria"},{"n":6,"title":"Organização dos Poderes e Poder Legislativo","full":"1 COMO ESTUDAR ESTE MÓDULO\n\nO Poder Legislativo decide regras que organizam a vida coletiva e fiscaliza quem governa. Para compreender seu funcionamento, você precisa saber quem participa de cada decisão, qual procedimento deve ser seguido e quais limites protegem as instituições e as pessoas envolvidas. É esse percurso que faremos: da organização do Congresso às garantias e responsabilidades de seus integrantes.\n\n1 COMO ESTUDAR ESTE MÓDULO\n\nO Poder Legislativo decide regras que organizam a vida coletiva e fiscaliza quem governa. Para compreender seu funcionamento, você precisa saber quem participa de cada decisão, qual procedimento deve ser seguido e quais limites protegem as instituições e as pessoas envolvidas. É esse percurso que faremos: da organização do Congresso às garantias e responsabilidades de seus integrantes.\n\nNa primeira leitura, acompanhe as explicações e os exemplos antes de tentar decorar números. Quando aparecer uma palavra técnica, procure a situação concreta que ela descreve. Na segunda leitura, resolva os testes sem olhar a resposta. Para aprofundar, volte aos trechos de jurisprudência e compare cada entendimento com o artigo constitucional indicado.\n\nAo terminar, você deve conseguir explicar por que a Câmara e o Senado representam interesses diferentes, distinguir suas competências e resolver casos sobre quórum, CPI, imunidades e perda de mandato. O núcleo de lei seca está nos arts. 2º e 44 a 58 da Constituição. O processo legislativo será estudado em módulo próprio; aqui entram apenas as conexões necessárias ao funcionamento das Casas. [1]\n\nLEITURA ORIENTADA\n\n• Primeiro percurso: organização dos Poderes, composição do Congresso e cálculo de maiorias.\n• Segundo percurso: reuniões, Mesas e competências do Congresso, da Câmara e do Senado.\n• Terceiro percurso: comissões, investigação parlamentar e direitos de quem presta depoimento.\n• Quarto percurso: imunidades, incompatibilidades, perda do mandato e substituição por suplente.\n• Ao final: 10 questões de fixação, 5 de revisão, sínteses e checklist de domínio.\n\n2 SEPARAÇÃO DOS PODERES E FUNÇÕES DO LEGISLATIVO"},{"n":7,"title":"Processo Legislativo, Fiscalização e Finanças Públicas","full":"1 COMO ESTUDAR ESTE MÓDULO\n\nUma política pública precisa de regras, dinheiro e controle. O Congresso participa das três etapas: produz normas, discute o orçamento e fiscaliza a aplicação dos recursos. Este módulo acompanha esse percurso para que você compreenda como uma decisão política se transforma em norma e como a Constituição limita seu financiamento e sua execução.\n\n1 COMO ESTUDAR ESTE MÓDULO\n\nUma política pública precisa de regras, dinheiro e controle. O Congresso participa das três etapas: produz normas, discute o orçamento e fiscaliza a aplicação dos recursos. Este módulo acompanha esse percurso para que você compreenda como uma decisão política se transforma em norma e como a Constituição limita seu financiamento e sua execução.\n\nNa primeira leitura, concentre-se nas perguntas que organizam cada assunto. No processo legislativo: quem pode começar, quem decide, quantos votos são necessários e o que acontece depois? Na fiscalização: de quem são as contas, qual órgão as examina e qual decisão ele pode tomar? No orçamento: o que foi planejado, o que foi autorizado e quais condições precisam ser cumpridas para gastar?\n\nCada exemplo explica o caminho até a resposta. Os trechos de aprofundamento acrescentam distinções constitucionais e jurisprudenciais, sem exigir que você já domine os conceitos. Tente responder aos testes de compreensão antes de ler os comentários. Ao final, há dez questões de fixação, cinco de revisão e um checklist para identificar o que ainda precisa ser retomado.\n\nO núcleo de lei seca está nos arts. 59 a 75 e 163 a 169 da Constituição. As conexões com os arts. 31, 47 e 49 ajudam a localizar competências e quóruns. O objetivo é dominar a estrutura constitucional; regras detalhadas de contabilidade pública e toda a Lei de Responsabilidade Fiscal pertencem a um estudo específico. [1]\n\nLEITURA ORIENTADA\n\n• Primeiro percurso: espécies normativas, maiorias, emendas constitucionais e iniciativa das leis.\n• Segundo percurso: votação, sanção, veto, medidas provisórias e leis delegadas.\n• Terceiro percurso: controle externo, competências do TCU e controle interno.\n• Quarto percurso: planejamento, orçamento, emendas, vedações e autonomia financeira.\n"},{"n":8,"title":"Poder Executivo: atribuições e responsabilidade presidencial","full":"LEITURA ORIENTADA\n\nEsta apostila reescreve o texto original do módulo CF M08 para que o iniciante entenda tudo e o avançado se aprofunde. O conteúdo segue a sequência lógica do próprio módulo, em dez capítulos, e termina em um fechamento de revisão. Cada capítulo traz prosa, uma tabela e, no máximo, duas caixas didáticas; os quadros do texto original (Regra de bolso, Cai muito, Não confundir, Pegadinha e outros) aparecem no capítulo a que pertencem.\n\nTRÊS SITUAÇÕES-PROBLEMA\n\nTente responder antes de ler. Errar faz parte: a resposta está no capítulo indicado.\n\nNúcleo   Situação-problema   Resposta\nInvestidura   Presidente e Vice renunciam no terceiro ano do mandato. Quem assume a Presidência enquanto isso? Haverá eleição direta? Os eleitos cumprem um mandato novo de quatro anos?   Capítulo 4\nCompetências   O Presidente quer delegar ao Ministro da Justiça a concessão de indulto e, por decreto, extinguir um ministério. O que ele pode fazer e o que não pode?   Capítulos 5 e 6\nResponsabilidade   Durante o mandato, surge investigação sobre crime cometido antes da posse, sem relação com as funções. Pode haver investigação? E responsabilização penal ainda no mandato?   Capítulo 8\n\nCAMINHO DO INICIANTE E CAMINHO DO AVANÇADO\n\n\n1   Visão geral e método de estudo   Não se aplica.\nParte I · Estrutura e investidura (aulas 2 a 4)   Parte I · Estrutura e investidura (aulas 2 a 4)   Parte I · Estrutura e investidura (aulas 2 a 4)\n2   Sistema presidencialista e posição constitucional do Presidente   arts. 76 e 84\n3   Eleição, requisitos, posse e mandato   arts. 77, 78 e 82; art. 14, §§ 3º e 5º\n4   Impedimento, vacância, substituição, sucessão e ausência do País   arts. 79 a 81 e 83\nParte II · Competências (aulas 5 e 6)   Parte II · Competências (aulas 5 e 6)   Parte II · Competências (aulas 5 e 6)\n5   Atribuições do Presidente da República (art. 84)   art. 84\n6   Delegação de atribuições presidenciais   art. 84, parágrafo único\nParte III · Responsabilidade (aulas 7 e 8)   Parte III · Responsabilidade (aulas 7 e 8)   Parte III · Responsabilidade (aulas 7 e 8)\n7   Responsabilidade do Presidente: infração penal comum e crime de responsabilidade   arts. 85 e 86; art. 52, parágrafo único\n8   Imunidades e garantias processuais do Presidente   art. 86, §§ 3º e 4º\nParte IV · Órgãos de auxílio e consulta (aulas 9 e 10)   Parte IV · Órgãos de auxílio e consulta (aulas 9 e 10)   Parte IV · Órgãos de auxílio e consulta (aulas 9 e 10)\n9   Ministros de Estado   art. 87\n10   Conselho da República e Conselho de Defesa Nacional   arts. 89 a 91\nFechamento (sem numeração de aula)   Fechamento (sem numeração de aula)   Fechamento (sem numeração de aula)\nNão se aplica.   Resumo; O que decorar; Pegadinhas de prova; Como resolver questões; Checklist; Referências e links oficiais   Não se aplica.\n"},{"n":9,"title":"Poder Judiciário I: disposições gerais e STF","full":"LEITURA ORIENTADA\n\nEsta apostila reescreve o texto original do módulo CF M09 para que o iniciante entenda tudo e o avançado se aprofunde. O conteúdo segue o eixo lógico do próprio módulo, em doze capítulos (um por seção do original), e termina em um fechamento de revisão. Cada capítulo traz prosa, uma tabela e, no máximo, duas caixas didáticas; os quadros do texto original (Atualização, Não confundir, Cai muito, Regra de bolso, Pegadinha e outros) aparecem no capítulo a que pertencem.\n\nTRÊS SITUAÇÕES-PROBLEMA\n\nTente responder antes de ler. Errar faz parte: a resposta está no capítulo indicado.\n\nNúcleo   Situação-problema   Resposta\nMagistratura   Na promoção por antiguidade, o tribunal recusa o juiz mais antigo por maioria absoluta, em votação fundamentada. A recusa é válida? E uma decisão disciplinar contra juiz, qual quórum exige?   Capítulos 4 e 6\nPrecatórios   Um precatório alimentar de credor com 68 anos foi apresentado em março. Ele tem alguma preferência? A data de apresentação permite inclusão no orçamento seguinte pela regra atual do § 5º?   Capítulo 8\nSTF   Tribunal local julga válida lei municipal contestada em face de lei federal. O recurso cabível é especial, ao STJ, ou extraordinário, ao STF? Por quê?   Capítulo 11\n\nCAMINHO DO INICIANTE E CAMINHO DO AVANÇADO\n\n\n1   Visão geral e método de estudo   Não se aplica.\nParte I · Estrutura e autonomia (aulas 2 e 3)   Parte I · Estrutura e autonomia (aulas 2 e 3)   Parte I · Estrutura e autonomia (aulas 2 e 3)\n2   Órgãos do Poder Judiciário e lógica da estrutura   art. 92\n3   Autonomia administrativa, organizacional e financeira   arts. 96 e 99\nParte II · Magistratura e tribunais (aulas 4 a 7)   Parte II · Magistratura e tribunais (aulas 4 a 7)   Parte II · Magistratura e tribunais (aulas 4 a 7)\n4   Estatuto da Magistratura, ingresso e movimentação na carreira   art. 93\n5   Garantias e vedações dos magistrados   art. 95\n6   Publicidade, fundamentação, decisões administrativas e atividade ininterrupta   art. 93, IX\n7   Órgão especial, quinto constitucional e reserva de plenário   arts. 93, 94 e 97\nParte III · Precatórios (aula 8)   Parte III · Precatórios (aula 8)   Parte III · Precatórios (aula 8)\n8   Precatórios: recorte essencial e atualizado   art. 100\nParte IV · Supremo Tribunal Federal (aulas 9 a 12)   Parte IV · Supremo Tribunal Federal (aulas 9 a 12)   Parte IV · Supremo Tribunal Federal (aulas 9 a 12)\n9   Supremo Tribunal Federal: composição e investidura   art. 101; art. 12, § 3º, IV\n10   STF: competências originárias   art. 102, I\n11   Competências recursais: recurso ordinário e extraordinário   art. 102, II e III, e § 3º\n12   Súmula vinculante   arts. 103 e 103-A\nFechamento (sem numeração de aula)   Fechamento (sem numeração de aula)   Fechamento (sem numeração de aula)"},{"n":10,"title":"Poder Judiciário II — CNJ, STJ, Justiça do Trabalho, Justiça Federal e Justiça dos Estados","full":"LEITURA ORIENTADA\n\nEsta apostila reescreve o texto original do módulo CF M10 para que o iniciante entenda tudo e o avançado se aprofunde. O conteúdo foi reorganizado em ordem de aprendizado, em nove capítulos (CNJ, STJ, recurso especial, Justiça do Trabalho, Justiça Federal e Justiça dos Estados), e termina em um fechamento de revisão. Cada capítulo traz prosa, uma tabela e, no máximo, duas caixas didáticas; os quadros do texto original (Regra de bolso, Atenção, Não confundir, Pegadinha, Exceção importante, Atualização e outros) aparecem no capítulo a que pertencem.\n\nTRÊS SITUAÇÕES-PROBLEMA\n\nTente responder antes de ler. Errar faz parte: a resposta está no capítulo indicado.\n\nNúcleo   Situação-problema   Resposta\nCNJ   Uma parte perde um processo no Tribunal de Justiça e quer “recorrer ao CNJ” contra o acórdão. É possível? E se o problema fosse um ato administrativo do tribunal que viola o art. 37?   Capítulo 2\nSTJ   Acórdão de TJ julga válido um ato de governo local contestado em face de lei federal. Qual recurso cabe? E se fosse uma lei local? A causa de 600 salários mínimos tem relevância presumida?   Capítulo 4\nJustiça do Trabalho   Servidor estatutário de um Município quer discutir vantagens funcionais. A ação vai para a Justiça do Trabalho por envolver trabalho humano?   Capítulo 6\n\nCAMINHO DO INICIANTE E CAMINHO DO AVANÇADO\n\n\n1   Visão geral e método de estudo   Não se aplica.\nParte I · CNJ e STJ (aulas 2 a 4)   Parte I · CNJ e STJ (aulas 2 a 4)   Parte I · CNJ e STJ (aulas 2 a 4)\n2   Conselho Nacional de Justiça (CNJ)   art. 103-B\n3   Superior Tribunal de Justiça (STJ): composição e competências   arts. 104 e 105, I e II\n4   Recurso especial e relevância   art. 105, III, e §§ 2º e 3º\nParte II · Justiça do Trabalho (aulas 5 e 6)   Parte II · Justiça do Trabalho (aulas 5 e 6)   Parte II · Justiça do Trabalho (aulas 5 e 6)\n5   Justiça do Trabalho: estrutura   arts. 111, 111-A, 115 e 116\n6   Competência material da Justiça do Trabalho   art. 114\nParte III · Justiça Federal (aulas 7 e 8)   Parte III · Justiça Federal (aulas 7 e 8)   Parte III · Justiça Federal (aulas 7 e 8)\n7   Justiça Federal: TRFs, composição e competência   arts. 106 a 108\n8   Juízes federais e seções judiciárias   arts. 109 e 110\nParte IV · Justiça dos Estados (aula 9)   Parte IV · Justiça dos Estados (aula 9)   Parte IV · Justiça dos Estados (aula 9)\n9   Justiça dos Estados   arts. 125 e 126\nFechamento (sem numeração de aula)   Fechamento (sem numeração de aula)   Fechamento (sem numeração de aula)\nNão se aplica.   Resumo; O que decorar; Pegadinhas de prova; Como resolver questões; Checklist; Referências e links oficiais   Não se aplica.\n\nVISÃO GERAL DO MÓDULO"},{"n":11,"title":"Funções Essenciais à Justiça","full":"LEITURA ORIENTADA\n\nEsta apostila reescreve o texto original do módulo CF M11 para que o iniciante entenda tudo e o avançado se aprofunde. O conteúdo segue a ordem do próprio módulo, em treze capítulos (arquitetura, Ministério Público, Advocacia Pública e privada, Defensoria e quadro comparado), e termina em um fechamento de revisão. Cada capítulo traz prosa, uma tabela e, no máximo, duas caixas didáticas; os quadros do texto original (Cai muito, Risco de erro, Atenção, Não confundir, Exceção importante, Regra de bolso) aparecem no capítulo a que pertencem.\n\nTRÊS SITUAÇÕES-PROBLEMA\n\nTente responder antes de ler. Errar faz parte: a resposta está no capítulo indicado.\n\nNúcleo   Situação-problema   Resposta\nMinistério Público   O Presidente escolhe o novo PGR sem lista tríplice e já pensa em reconduzi-lo duas vezes. Algo disso é inconstitucional? E se fosse um PGJ estadual?   Capítulo 5\nAdvocacia Pública   Um procurador do Estado com quatro anos de exercício diz ter “vitaliciedade”. Está certo? E uma lei estadual pode criar órgão paralelo para representar o Estado em juízo?   Capítulo 10\nDefensoria   Um juiz determina que a Defensoria desloque defensores para uma comarca específica. A ordem é válida? A Defensoria pode ajuizar ação civil pública?   Capítulo 12\n\nCAMINHO DO INICIANTE E CAMINHO DO AVANÇADO\n\n\n1   Visão geral e método de estudo   Não se aplica.\nParte I · Arquitetura das funções essenciais (aula 2)   Parte I · Arquitetura das funções essenciais (aula 2)   Parte I · Arquitetura das funções essenciais (aula 2)\n2   Arquitetura constitucional das funções essenciais à Justiça   arts. 127 a 135\nParte II · Ministério Público (aulas 3 a 8)   Parte II · Ministério Público (aulas 3 a 8)   Parte II · Ministério Público (aulas 3 a 8)\n3   Ministério Público: conceito, missão e princípios institucionais   art. 127, caput e § 1º\n4   Autonomias e estrutura constitucional do Ministério Público   art. 127, §§ 2º e 3º; arts. 128, I e II, e 130\n5   Chefias: PGR, PGJs e pontos de prova   art. 128, §§ 1º a 4º\n6   Funções institucionais do MP   art. 129\n7   Carreira, garantias e vedações dos membros do MP   art. 128, § 5º; art. 95, parágrafo único, V\n8   Conselho Nacional do Ministério Público (CNMP)   art. 130-A\nParte III · Advocacia Pública e privada (aulas 9 a 11)   Parte III · Advocacia Pública e privada (aulas 9 a 11)   Parte III · Advocacia Pública e privada (aulas 9 a 11)\n9   Advocacia-Geral da União e Advocacia Pública   art. 131\n10   Procuradores dos Estados e do Distrito Federal   art. 132\n11   Advocacia privada: indispensabilidade e inviolabilidade   art. 133\nParte IV · Defensoria Pública e comparação final (aulas 12 e 13)   Parte IV · Defensoria Pública e comparação final (aulas 12 e 13)   Parte IV · Defensoria Pública e comparação final (aulas 12 e 13)\n12   Defensoria Pública: missão, autonomia e princípios   arts. 134 e 135\n13   Quadro funcional comparado   arts. 127 a 135"},{"n":12,"title":"Controle de constitucionalidade","full":"LEITURA ORIENTADA\n\nEsta apostila reescreve o texto original do módulo CF M12 para que o iniciante entenda tudo e o avançado se aprofunde. O conteúdo segue a ordem do próprio módulo, em treze capítulos (fundamentos e classificações, controle difuso e controle concentrado), e termina em um fechamento de revisão. Cada capítulo traz prosa, uma tabela e, no máximo, duas caixas didáticas; os quadros do texto original (Cai muito, Não confundir, Atenção, Pegadinha, Regra de bolso, Quóruns, Legitimados especiais) aparecem no capítulo a que pertencem.\n\nTRÊS SITUAÇÕES-PROBLEMA\n\nTente responder antes de ler. Errar faz parte: a resposta está no capítulo indicado.\n\nNúcleo   Situação-problema   Resposta\nControle difuso   Uma câmara de tribunal deixa de aplicar uma lei estadual “por incompatibilidade com a Constituição”, sem levar a questão ao plenário e sem usar a palavra “inconstitucional”. Há problema?   Capítulo 6\nAções diretas   Um prefeito quer questionar no STF uma lei municipal de 1985 contrária à CF/88. Cabe ADI? Cabe ADPF? Ele é legitimado?   Capítulos 7, 8 e 11\nEfeitos   Depois de declarar uma lei inconstitucional em ADI, o STF quer que a decisão só valha dali para frente. Pode? Com qual quórum?   Capítulo 8\n\nCAMINHO DO INICIANTE E CAMINHO DO AVANÇADO\n\n\n1   Visão geral e método de estudo   Não se aplica.\nParte I · Fundamentos e classificações (aulas 2 a 5)   Parte I · Fundamentos e classificações (aulas 2 a 5)   Parte I · Fundamentos e classificações (aulas 2 a 5)\n2   Fundamentos, pressupostos e modelos   Não se aplica.\n3   Espécies de inconstitucionalidade   Não se aplica.\n4   Momento, órgão e via do controle   art. 52, X\n5   Técnicas de decisão   Não se aplica.\nParte II · Controle difuso (aula 6)   Parte II · Controle difuso (aula 6)   Parte II · Controle difuso (aula 6)\n6   Controle difuso e incidental   arts. 52, X, e 97\nParte III · Controle concentrado (aulas 7 a 13)   Parte III · Controle concentrado (aulas 7 a 13)   Parte III · Controle concentrado (aulas 7 a 13)\n7   Controle concentrado: noções gerais e legitimados   art. 103\n8   ADI: Ação Direta de Inconstitucionalidade   arts. 102, I, a, e 103; Lei 9.868/1999\n9   ADC: Ação Declaratória de Constitucionalidade   art. 102, I, a; Lei 9.868/1999\n10   ADO: Ação Direta de Inconstitucionalidade por Omissão   art. 103, § 2º; Lei 9.868/1999\n11   ADPF: Arguição de Descumprimento de Preceito Fundamental   art. 102, § 1º; Lei 9.882/1999\n12   ADI interventiva e controle abstrato estadual e municipal   arts. 34, VII, e 36, III\n13   Súmula vinculante e repercussão geral: recorte necessário   art. 103-A\nFechamento (sem numeração de aula)   Fechamento (sem numeração de aula)   Fechamento (sem numeração de aula)"},{"n":13,"title":"Ordem Econômica e Financeira — princípios gerais da atividade econômica","full":"LEITURA ORIENTADA\n\nEsta apostila reescreve o texto original do módulo CF M13 para que o iniciante entenda tudo e o avançado se aprofunde. O conteúdo segue a ordem do próprio módulo, em oito capítulos (princípios, Estado na economia, recursos e setores estratégicos), e termina em um fechamento de revisão. Cada capítulo traz prosa, uma tabela e, no máximo, duas caixas didáticas; os quadros do texto original (Cai muito, Não confundir, Pegadinha) aparecem no capítulo a que pertencem.\n\nTRÊS SITUAÇÕES-PROBLEMA\n\nTente responder antes de ler. Errar faz parte: a resposta está no capítulo indicado.\n\nNúcleo   Situação-problema   Resposta\nLivre iniciativa   Um decreto municipal, sem lei que o ampare, passa a exigir autorização prévia para abrir qualquer tipo de comércio. A exigência é compatível com o art. 170?   Capítulo 3\nEstado na economia   Uma sociedade de economia mista que concorre no mercado recebe isenção tributária que as empresas privadas do setor não têm. E o planejamento estatal obriga essas empresas privadas?   Capítulos 4 e 5\nRecursos minerais   Uma jazida é descoberta em uma fazenda particular. O dono do solo é dono do minério? Recebe alguma coisa?   Capítulo 7\n\nCAMINHO DO INICIANTE E CAMINHO DO AVANÇADO\n\n\n1   Posição constitucional da ordem econômica   Não se aplica.\nParte I · Princípios da ordem econômica (aulas 2 e 3)   Parte I · Princípios da ordem econômica (aulas 2 e 3)   Parte I · Princípios da ordem econômica (aulas 2 e 3)\n2   Art. 170: estrutura e princípios da ordem econômica   art. 170\n3   Livre exercício de atividade econômica e capital estrangeiro   art. 170, parágrafo único; art. 172\nParte II · O Estado na economia (aulas 4 a 6)   Parte II · O Estado na economia (aulas 4 a 6)   Parte II · O Estado na economia (aulas 4 a 6)\n4   Art. 173: exploração direta de atividade econômica pelo Estado   art. 173\n5   Art. 174: Estado como agente normativo e regulador   art. 174\n6   Art. 175: serviços públicos   art. 175\nParte III · Recursos e setores estratégicos (aulas 7 e 8)   Parte III · Recursos e setores estratégicos (aulas 7 e 8)   Parte III · Recursos e setores estratégicos (aulas 7 e 8)\n7   Jazidas, minerais, potenciais hidráulicos e monopólios da União   arts. 176 e 177\n8   Transportes, micro e pequenas empresas, turismo e ouro   arts. 178 a 181\nFechamento (sem numeração de aula)   Fechamento (sem numeração de aula)   Fechamento (sem numeração de aula)\nNão se aplica.   Resumo; O que decorar; Pegadinhas de prova; Como resolver questões; Checklist; Referências e links oficiais   Não se aplica.\n\nVISÃO GERAL DO MÓDULO\n\nCAPÍTULO 1 — POSIÇÃO CONSTITUCIONAL DA ORDEM ECONÔMICA"},{"n":14,"title":"Ordem Social e Seguridade Social — Saúde, Previdência e Assistência","full":"LEITURA ORIENTADA\n\nEsta apostila reescreve o texto original do módulo CF M14 para que o iniciante entenda tudo e o avançado se aprofunde. O conteúdo segue a ordem do próprio módulo, em sete capítulos (seguridade, saúde, previdência e assistência), e termina em um fechamento de revisão. Cada capítulo traz prosa, uma tabela e, no máximo, duas caixas didáticas; os quadros do texto original (Cai muito, Não confundir, Pegadinha e o quadro dos agentes comunitários) aparecem no capítulo a que pertencem.\n\nTRÊS SITUAÇÕES-PROBLEMA\n\nTente responder antes de ler. Errar faz parte: a resposta está no capítulo indicado.\n\nNúcleo   Situação-problema   Resposta\nSeguridade   Uma lei cria novo benefício assistencial, mas não indica de onde virá todo o dinheiro. É constitucional?   Capítulo 3\nSaúde   Um hospital privado com fins lucrativos quer atender pelo SUS e receber subvenção pública. O que a Constituição permite?   Capítulo 5\nPrevidência e assistência   Uma pessoa idosa, sem renda, nunca contribuiu. Tem direito a aposentadoria pelo RGPS? Tem alguma proteção?   Capítulos 6 e 7\n\nCAMINHO DO INICIANTE E CAMINHO DO AVANÇADO\n\n\n1   Ordem social e conceito de seguridade social   arts. 193 e 194\nParte I · Seguridade social (aulas 2 e 3)   Parte I · Seguridade social (aulas 2 e 3)   Parte I · Seguridade social (aulas 2 e 3)\n2   Objetivos da seguridade social   art. 194\n3   Financiamento da seguridade e fonte de custeio   art. 195\nParte II · Saúde (aulas 4 e 5)   Parte II · Saúde (aulas 4 e 5)   Parte II · Saúde (aulas 4 e 5)\n4   Saúde: direito de todos e relevância pública   arts. 196 e 197\n5   SUS, iniciativa privada e competências do sistema   arts. 198 a 200\nParte III · Previdência (aula 6)   Parte III · Previdência (aula 6)   Parte III · Previdência (aula 6)\n6   Previdência social: RGPS, equilíbrio atuarial e previdência complementar   arts. 201 e 202\nParte IV · Assistência social (aula 7)   Parte IV · Assistência social (aula 7)   Parte IV · Assistência social (aula 7)\n7   Assistência social: objetivos e organização   arts. 203 e 204\nFechamento (sem numeração de aula)   Fechamento (sem numeração de aula)   Fechamento (sem numeração de aula)\nNão se aplica.   Resumo; O que decorar; Pegadinhas de prova; Como resolver questões; Checklist; Referências e links oficiais   Não se aplica.\n\nVISÃO GERAL DO MÓDULO\n\nCAPÍTULO 1 — ORDEM SOCIAL E CONCEITO DE SEGURIDADE SOCIAL"},{"n":15,"title":"Meio Ambiente e proteção constitucional da Família, Criança, Adolescente, Jovem e Idoso","full":"LEITURA ORIENTADA\n\nEsta apostila reescreve o texto original do módulo CF M15 para que o iniciante entenda tudo e o avançado se aprofunde. O conteúdo segue a ordem do próprio módulo, em seis capítulos (meio ambiente; família, criança, adolescente, jovem e idoso), e termina em um fechamento de revisão. Cada capítulo traz prosa, uma tabela e, no máximo, duas caixas didáticas; os quadros do texto original (Não confundir, Pegadinha, Cai muito) aparecem no capítulo a que pertencem.\n\nTRÊS SITUAÇÕES-PROBLEMA\n\nTente responder antes de ler. Errar faz parte: a resposta está no capítulo indicado.\n\nNúcleo   Situação-problema   Resposta\nMeio ambiente   Uma empresa reparou integralmente o dano ambiental que causou. Ainda pode ser multada e processada criminalmente? E toda obra precisa de estudo prévio de impacto ambiental?   Capítulos 2 e 3\nFamília e filhos   Um testamento dá ao filho adotivo metade do que dá ao filho biológico, por ser “adotivo”. Essa distinção é válida?   Capítulo 5\nIdoso   Um programa municipal prevê amparo a idosos preferencialmente em abrigos. Está de acordo com o art. 230?   Capítulo 6\n\nCAMINHO DO INICIANTE E CAMINHO DO AVANÇADO\n\n\n1   Meio ambiente como direito constitucional   art. 225, caput\n2   Deveres constitucionais do Poder Público   art. 225, § 1º\n3   Responsabilidade ambiental, mineração e patrimônio nacional   art. 225, §§ 2º a 4º\nParte II · Família, criança, adolescente, jovem e idoso (aulas 4 a 6)   Parte II · Família, criança, adolescente, jovem e idoso (aulas 4 a 6)   Parte II · Família, criança, adolescente, jovem e idoso (aulas 4 a 6)\n4   Família   art. 226\n5   Criança, adolescente e jovem   art. 227\n6   Inimputabilidade penal, deveres entre pais e filhos e pessoa idosa   arts. 228 a 230\nFechamento (sem numeração de aula)   Fechamento (sem numeração de aula)   Fechamento (sem numeração de aula)\nNão se aplica.   Resumo; O que decorar; Pegadinhas de prova; Como resolver questões; Checklist; Referências e links oficiais   Não se aplica.\n\nPARTE I · MEIO AMBIENTE\n\nCAPÍTULO 1 — MEIO AMBIENTE COMO DIREITO CONSTITUCIONAL\n\nBase constitucional: art. 225, caput\n\nO art. 225 reconhece a todos o direito ao meio ambiente ecologicamente equilibrado. O texto constitucional atribui ao meio ambiente três características centrais: bem de uso comum do povo, essencial à sadia qualidade de vida e objeto de tutela intergeracional."}];let active=1;
