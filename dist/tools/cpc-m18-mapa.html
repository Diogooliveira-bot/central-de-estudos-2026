<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CPC M18 — Mapa Mental</title><style>
:root{--navy:#083565;--ink:#102b4e;--bg:#f5f7fb;--line:#dbe5ef;--muted:#63758a;--shadow:0 18px 55px rgba(15,43,78,.13)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg)}body{padding:18px}.wrap{max-width:1160px;margin:auto}.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}.top h1{font-size:clamp(22px,3.5vw,38px);margin:0}.top p{margin:4px 0 0;color:var(--muted);font-size:13px}.top .spacer{flex:1}
button{border:0;border-radius:12px;background:var(--navy);color:#fff;padding:10px 14px;font-weight:800;cursor:pointer}.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.stage{position:relative;display:flex;align-items:center;justify-content:center;min-height:72vh;background:#e9eff7;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.viewport{width:100%;padding:22px;display:flex;align-items:center;justify-content:center}.slide{display:none;width:min(900px,calc(100vw - 120px));min-height:600px}.slide.active{display:flex}.card{width:100%;background:var(--soft,#fff);border-radius:28px;overflow:hidden;box-shadow:0 18px 50px rgba(13,40,76,.15);display:flex;flex-direction:column;border:1px solid rgba(8,53,101,.12)}.head{display:flex;align-items:center;gap:16px;padding:24px 28px 18px}.num{width:58px;height:58px;flex:0 0 58px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:27px;font-weight:950;background:var(--accent,#2088d8)}.title{font-size:clamp(24px,3vw,40px);line-height:1;font-weight:950;color:#0d315d;text-transform:uppercase}.icon{margin-left:auto;font-size:38px}.body{padding:2px 28px 28px;font-size:clamp(17px,2vw,23px);line-height:1.3}.body ul{margin:8px 0 0;padding-left:28px}.body li{margin:9px 0}.box{margin-top:20px;padding:18px 20px;border:2px solid color-mix(in srgb,var(--accent) 55%,#fff);border-radius:18px;background:rgba(255,255,255,.65)}.box b{display:block;font-size:18px;text-transform:uppercase;margin-bottom:7px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini{padding:14px;border-radius:14px;background:rgba(255,255,255,.72);border:1px solid rgba(13,49,93,.14)}.mini b{font-size:13px;text-transform:uppercase}.nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;padding:0;border-radius:50%;font-size:27px;display:grid;place-items:center}.prev{left:12px}.next{right:12px}.foot{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}.foot .info{flex:1}.foot b{display:block;font-size:17px}.foot small{color:var(--muted)}.progress{width:190px;height:7px;border-radius:99px;background:#dce5ef;overflow:hidden}.progress i{display:block;height:100%;background:var(--navy)}.dots{display:flex;gap:6px;flex-wrap:wrap}.dot{width:9px;height:9px;border-radius:99px;background:#c3cfde}.dot.on{width:26px;background:var(--navy)}.full{width:min(900px,100%);background:#fff;border-radius:24px;padding:14px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;box-shadow:var(--shadow)}.mini-card{border-radius:14px;padding:12px;background:var(--soft);border:1px solid rgba(13,49,93,.12)}.mini-card b{display:block;color:#0d315d;font-size:14px;text-transform:uppercase;margin-bottom:4px}.mini-card span{font-size:10px;line-height:1.35;display:block}
.c1{--accent:#1c9ddd;--soft:#e7f5fc}.c2{--accent:#d59d00;--soft:#fff4d9}.c3{--accent:#36a85d;--soft:#e8f7ec}.c4{--accent:#ef7159;--soft:#feebe7}.c5{--accent:#8052d0;--soft:#f0eafb}.c6{--accent:#14a68d;--soft:#e7f8f4}.c7{--accent:#ed476f;--soft:#fdeaf0}.c8{--accent:#2088d8;--soft:#e8f4fc}.c9{--accent:#d29b00;--soft:#fff4d9}
@media(max-width:720px){body{padding:10px}.stage{min-height:70vh}.viewport{padding:10px 6px}.slide{width:calc(100vw - 42px);min-height:67vh}.card{min-height:67vh;border-radius:20px}.head{padding:18px 17px 12px;gap:10px}.num{width:45px;height:45px;flex-basis:45px;font-size:22px}.title{font-size:24px}.icon{font-size:28px}.body{padding:0 17px 20px;font-size:17px}.cols{grid-template-columns:1fr}.nav{width:40px;height:40px}.prev{left:4px}.next{right:4px}.progress{width:110px}.full{grid-template-columns:1fr}}
body.preview{padding:0;background:transparent;overflow:hidden}body.preview .top,body.preview .nav,body.preview .foot{display:none!important}body.preview .stage{min-height:0;height:100vh;border:0;border-radius:0;box-shadow:none;background:transparent}body.preview .viewport{padding:0}body.preview .slide{width:100%;min-height:100vh}body.preview .card{border-radius:20px;box-shadow:none;min-height:100vh}body.preview .body{font-size:17px}
</style></head><body><div class="wrap"><div class="top"><div><h1>CPC M18 — Mapa Mental</h1><p>Procedimentos especiais previstos no edital</p></div><div class="spacer"></div><button class="ghost" onclick="go(0)">↺ Início</button></div><div class="stage" id="stage"><button class="nav prev" onclick="move(-1)">‹</button><div class="viewport" id="viewport"></div><button class="nav next" onclick="move(1)">›</button></div><div class="foot"><div class="info"><b id="label"></b><small>Deslize para o lado ou use as setas.</small></div><div class="progress"><i id="bar"></i></div><div class="dots" id="dots"></div></div></div><script>
const D=[
{c:'c1',n:1,t:'Mapa dos 4 institutos',i:'💡',items:['Consignação: quero pagar, mas há obstáculo.','Embargos de terceiro: meu bem foi ou pode ser atingido.','Monitória: tenho prova escrita sem força executiva.','Restauração: os autos desapareceram.'],box:['Regra de ouro','PROCEDIMENTO ESPECIAL NÃO É ISOLADO: O COMUM APLICA-SE SUBSIDIARIAMENTE QUANDO COMPATÍVEL']},
{c:'c2',n:2,t:'Consignação',i:'💰',items:['Recusa extrajudicial: 10 dias.','Após recusa: 1 mês para ajuizar.','Depósito judicial: 5 dias.','Prestações sucessivas: até 5 dias do vencimento.','Complementação do depósito: 10 dias.'],box:['Tema 967/STJ','DEPÓSITO INSUFICIENTE NÃO PRODUZ QUITAÇÃO INTEGRAL']},
{c:'c3',n:3,t:'Embargos de terceiro',i:'🛡️',items:['Protegem proprietário, possuidor e equiparados.','Cabem também contra ameaça de constrição.','Execução: até 5 dias após adjudicação/alienação/arrematação.','Sempre antes da assinatura da carta.','Contestação: 15 dias.'],box:['Súmula 84/STJ','COMPROMISSÁRIO COMPRADOR SEM REGISTRO PODE EMBARGAR COM BASE NA POSSE']},
{c:'c4',n:4,t:'Monitória',i:'📄',items:['Prova escrita sem eficácia executiva.','Pode exigir dinheiro, coisa, fazer ou não fazer.','Cabe contra Fazenda Pública.','Mandado: 15 dias.','Honorários: 5%.','Sem cumprimento nem embargos: título judicial nasce de pleno direito.'],box:['Pegadinha','MONITÓRIA NÃO EXIGE TÍTULO EXECUTIVO']},
{c:'c5',n:5,t:'Embargos monitórios',i:'⚖️',items:['Prazo: 15 dias.','Nos próprios autos.','Sem garantia prévia.','Suspendem eficácia da decisão inicial até julgamento em 1º grau.','Autor responde em 15 dias.','Reconvenção sim; reconvenção à reconvenção não.'],box:['Não confundir','EMBARGOS MONITÓRIOS ≠ EMBARGOS À EXECUÇÃO']},
{c:'c6',n:6,t:'Restauração de autos',i:'🧩',items:['Juiz, partes ou MP podem promover.','Contestação: 5 dias.','Reconstrói o processo; não reabre o mérito.','Provas podem ser repetidas se necessário.','Se originais reaparecem, processo volta a eles.'],box:['Pegadinha','RESTAURAÇÃO NÃO É JURISDIÇÃO VOLUNTÁRIA']},
{c:'c7',n:7,t:'Números que mais caem',i:'⏱️',items:['10 dias: recusa na consignação.','1 mês: ação após recusa.','5 dias: depósito judicial.','10 dias: complementar depósito.','5 dias: limite dos embargos de terceiro na execução.','15 dias: contestação dos embargos de terceiro.','15 dias: mandado/embargos monitórios.','5%: honorários monitórios.','5 dias: contestação na restauração.'],box:['Decore','10 • 1 MÊS • 5 • 10 | 5 • 15 | 15 • 5% | 5']},
{c:'c8',n:8,t:'Não confundir',i:'↔️',items:['Consignação ≠ depósito para garantir juízo.','Embargos de terceiro ≠ ação possessória.','Monitória ≠ execução de título extrajudicial.','Restauração ≠ reabertura do mérito.','Procedimento especial ≠ afastamento total do procedimento comum.'],box:['Filtro de prova','PERGUNTE SEMPRE QUAL PROBLEMA PROCESSUAL O INSTITUTO RESOLVE']},
{c:'c9',n:9,t:'Você precisa lembrar',i:'✅',items:['539–549 consignação.','674–681 embargos de terceiro.','700–702 monitória.','712–718 restauração.','Tema 967/STJ.','Súmulas 84, 303 e 339/STJ.','Art. 318, parágrafo único.'],box:['Mini macete','PAGAR • PROTEGER • FORMAR TÍTULO • RECONSTRUIR']}
]
let idx=0;const preview=new URLSearchParams(location.search).get('preview')==='1';if(preview)document.body.classList.add('preview');
function e(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function card(d){let body;if(d.custom){body='<div class="body"><div class="cols"><div class="mini"><b>Antecipada × cautelar</b><p>Antecipada satisfaz; cautelar conserva.</p></div><div class="mini"><b>Urgência × evidência</b><p>Urgência exige perigo; evidência não.</p></div><div class="mini"><b>Antecipada antecedente × cautelar antecedente</b><p>A primeira pode estabilizar; a segunda não.</p></div><div class="mini"><b>Evidência × julgamento antecipado</b><p>Evidência é provisória; julgamento antecipado é decisão de mérito.</p></div></div></div>'}else{body='<div class="body"><ul>'+d.items.map(x=>'<li>'+e(x)+'</li>').join('')+'</ul><div class="box"><b>'+e(d.box[0])+'</b>'+e(d.box[1])+'</div></div>'}return '<article class="card '+d.c+'"><div class="head"><span class="num">'+d.n+'</span><span class="title">'+e(d.t)+'</span><span class="icon">'+d.i+'</span></div>'+body+'</article>'}
function full(){return '<div class="full">'+D.map(d=>'<div class="mini-card '+d.c+'"><b>'+d.n+' — '+e(d.t)+'</b><span>'+(d.items?e(d.items.slice(0,3).join(' • ')):'Absoluta × relativa • conexão × continência • perpetuatio × prevenção')+'</span></div>').join('')+'</div>'}
function render(){document.getElementById('viewport').innerHTML='<div class="slide active">'+(idx<D.length?card(D[idx]):full())+'</div>';document.getElementById('label').textContent=idx<D.length?(D[idx].n+' — '+D[idx].t):'Mapa completo — CPC M18';document.getElementById('bar').style.width=((idx+1)/(D.length+1)*100)+'%';[...document.querySelectorAll('.dot')].forEach((d,i)=>d.classList.toggle('on',i===idx));if(!preview&&idx===D.length){try{parent.postMessage({type:'cpc-map-complete',module:'w18'},location.origin)}catch(_){}}if(preview&&idx!==0){idx=0;render()}}
function move(n){idx=(idx+n+D.length+1)%(D.length+1);render()}function go(n){idx=n;render()}const dots=document.getElementById('dots');for(let i=0;i<D.length+1;i++){const d=document.createElement('span');d.className='dot';d.onclick=()=>{idx=i;render()};dots.appendChild(d)}let sx=0,sy=0;document.getElementById('stage').addEventListener('touchstart',ev=>{sx=ev.touches[0].clientX;sy=ev.touches[0].clientY},{passive:true});document.getElementById('stage').addEventListener('touchend',ev=>{const dx=ev.changedTouches[0].clientX-sx,dy=ev.changedTouches[0].clientY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.2)move(dx<0?1:-1)},{passive:true});document.addEventListener('keydown',ev=>{if(ev.key==='ArrowRight')move(1);if(ev.key==='ArrowLeft')move(-1)});render();
</script></body></html>
