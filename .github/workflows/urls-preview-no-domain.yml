name: Enderecos de homologacao sem dominio proprio
on:
  push:
    branches:
      - fix/urls-provisorias-sem-dominio-20261028
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seguranca:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Node syntax
        run: |
          node --check lib/public-app-url.js
          node --check lib/password-reset.js
          node --check lib/hotmart-webhook.js
          node --check lib/premium-expiry-reminders.js
      - name: Tests
        run: node --test tests/public-app-url-unit.mjs tests/password-reset-unit.mjs tests/hotmart-webhook-unit.mjs tests/premium-expiry-reminders-unit.mjs tests/premium-expiry-handler-unit.mjs tests/free-signup-v24-unit.mjs
