name: Administrativo — revisão didática M01–M10
on:
  pull_request:
    paths:
      - 'content/adm/adm-review-didactic-*.js'
      - 'ui/adm-apostila-reading-v1.js'
      - 'tests/adm-review-didactic-v2-unit.mjs'
      - 'tests/adm-review-didactic-m11-m20-unit.mjs'
      - 'tests/adm-review-all-m01-m20-unit.mjs'
      - 'package.json'
      - '.github/workflows/adm-didatico-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adm-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:adm-didatico
