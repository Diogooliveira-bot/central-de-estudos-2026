name: Padronização Premium — Direito Penal M02–M17

on:
  push:
    branches: [preview/legal-complete-premium-v1-20261025]
    paths:
      - '.github/workflows/verify-etapa5-penal-m02-m17.yml'
      - 'tests/etapa5-penal-m02-m17-browser.mjs'
      - 'ui/native-study-reader-m*.js'
      - 'content/penal/m*-native-data.js'
      - 'ui/legal-complete-premium-v1.*'
      - 'penal-full-theory-data-*.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bc-etapa5-penal-m02-m17
  cancel-in-progress: true

jobs:
  chromium:
    if: github.repository == 'Diogooliveira-bot/central-de-estudos-2026'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout isolado sem credenciais
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Dependências sem scripts
        run: npm ci --ignore-scripts
      - name: Sintaxe de teste e dos leitores
        run: |
          node --check tests/etapa5-penal-m02-m17-browser.mjs
          for n in $(seq -w 2 17); do node --check "ui/native-study-reader-m${n}.js"; done
      - name: Regressão de tema, editor, Premium
        run: node --test tests/legal-complete-premium-theme-unit.mjs tests/etapa3-premium-pilots-unit.mjs tests/visual-editor-table-unit.mjs
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Testar Direito Penal em três larguras
        run: node tests/etapa5-penal-m02-m17-browser.mjs
      - name: Salvar capturas e métricas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etapa5-penal-m02-m17-chromium
          path: artifacts/etapa5-penal-m02-m17/*
          if-no-files-found: ignore
          retention-days: 14
