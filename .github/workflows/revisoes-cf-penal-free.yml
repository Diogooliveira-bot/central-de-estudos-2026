name: Revisões CF e Penal — acesso aluno gratuito
on:
  pull_request:
    paths:
      - 'lib/protected-content.js'
      - 'tests/revisoes-cf-penal-aluno-gratuito-unit.mjs'
      - 'tests/revisoes-adm-cpc-aluno-gratuito-unit.mjs'
      - '.github/workflows/revisoes-cf-penal-free.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  revisions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Testar controle de acesso e dados das 32 revisões
        run: node --test tests/revisoes-cf-penal-aluno-gratuito-unit.mjs tests/revisoes-adm-cpc-aluno-gratuito-unit.mjs tests/protected-content-unit.mjs tests/civil-free-guided-access-unit.mjs
