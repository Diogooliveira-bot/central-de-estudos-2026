<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CPC M01 — Mapa Mental</title>
<style>
:root{--navy:#083565;--ink:#102b4e;--bg:#f5f7fb;--line:#dbe5ef;--muted:#63758a;--shadow:0 18px 55px rgba(15,43,78,.13)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg)}
body{padding:18px}.wrap{max-width:1160px;margin:auto}.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}.top h1{font-size:clamp(22px,3.5vw,38px);margin:0}.top p{margin:4px 0 0;color:var(--muted);font-size:13px}.top .spacer{flex:1}
button,.btn{border:0;border-radius:12px;background:var(--navy);color:#fff;padding:10px 14px;font-weight:800;cursor:pointer;text-decoration:none}.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.stage{position:relative;display:flex;align-items:center;justify-content:center;min-height:72vh;background:#e9eff7;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.viewport{width:100%;padding:22px;display:flex;align-items:center;justify-content:center}.slide{display:none;width:min(880px,calc(100vw - 120px));min-height:600px}.slide.active{display:flex}
.card{width:100%;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 18px 50px rgba(13,40,76,.15);display:flex;flex-direction:column;border:1px solid rgba(8,53,101,.12)}
.card.hero-card{width:min(930px,100%);min-height:640px}.head{display:flex;align-items:center;gap:16px;padding:24px 28px 18px}.num{width:58px;height:58px;flex:0 0 58px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:27px;font-weight:950;background:var(--accent,#2088d8)}.title{font-size:clamp(24px,3vw,42px);line-height:.98;font-weight:950;letter-spacing:-.03em;color:#0d315d;text-transform:uppercase}.icon{margin-left:auto;font-size:38px}
.body{padding:2px 28px 28px;font-size:clamp(17px,2vw,24px);line-height:1.27}.body ul{margin:8px 0 0;padding-left:28px}.body li{margin:9px 0}.box{margin-top:20px;padding:18px 20px;border:2px solid color-mix(in srgb,var(--accent,#2088d8) 55%,#fff);border-radius:18px;background:color-mix(in srgb,var(--accent,#2088d8) 8%,#fff)}.box b{display:block;font-size:18px;text-transform:uppercase;margin-bottom:7px;color:color-mix(in srgb,var(--accent,#2088d8) 82%,#071f3f)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini{padding:14px;border-radius:14px;background:rgba(255,255,255,.72);border:1px solid rgba(13,49,93,.14)}.mini b{font-size:13px;text-transform:uppercase}.flow{font-weight:950;letter-spacing:.02em;color:#0d315d}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;padding:0;border-radius:50%;font-size:27px;display:grid;place-items:center;z-index:3}.prev{left:12px}.next{right:12px}
.foot{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}.foot .info{flex:1;min-width:180px}.foot b{display:block;font-size:17px}.foot small{color:var(--muted)}.progress{width:190px;height:7px;border-radius:99px;background:#dce5ef;overflow:hidden}.progress i{display:block;height:100%;background:var(--navy);width:0}.dots{display:flex;gap:6px;flex-wrap:wrap}.dot{width:9px;height:9px;border-radius:99px;background:#c3cfde}.dot.on{width:26px;background:var(--navy)}
.full-poster{width:min(900px,100%);background:#fff;border-radius:24px;padding:14px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;box-shadow:var(--shadow)}.full-poster .mini-card{border-radius:14px;padding:12px;background:var(--soft);border:1px solid rgba(13,49,93,.12)}.mini-card b{display:block;color:#0d315d;font-size:14px;text-transform:uppercase;margin-bottom:4px}.mini-card span{font-size:10px;line-height:1.35;display:block}
.c1{--accent:#1c9ddd;--soft:#e7f5fc}.c2{--accent:#ee3157;--soft:#fdebf0}.c3{--accent:#f7a20c;--soft:#fff5d9}.c4{--accent:#45a83e;--soft:#e8f7e4}.c5{--accent:#5631b7;--soft:#eee8fb}.c6{--accent:#ef3154;--soft:#fde8ed}.c7{--accent:#178fca;--soft:#e7f5fb}.c8{--accent:#2d9c3c;--soft:#e9f7e8}.c9{--accent:#6641c8;--soft:#eee9fb}.c10{--accent:#f0a000;--soft:#fff4d9}.card{background:var(--soft)}
@media(max-width:720px){body{padding:10px}.top h1{font-size:22px}.top p{font-size:12px}.stage{min-height:70vh;border-radius:17px}.viewport{padding:10px 6px}.slide{width:calc(100vw - 42px);min-height:67vh}.card,.card.hero-card{min-height:67vh;border-radius:20px}.head{padding:18px 17px 12px;gap:10px}.num{width:45px;height:45px;flex-basis:45px;font-size:22px}.title{font-size:25px}.icon{font-size:28px}.body{padding:0 17px 20px;font-size:17px}.body li{margin:7px 0}.cols{grid-template-columns:1fr}.nav{width:40px;height:40px}.prev{left:4px}.next{right:4px}.progress{width:120px}.full-poster{grid-template-columns:1fr}.foot .actions{width:100%;display:flex;gap:8px}.foot .actions button{flex:1}}
body.preview{padding:0;background:transparent;overflow:hidden}body.preview .top,body.preview .nav,body.preview .foot{display:none!important}body.preview .stage{min-height:0;height:100vh;border:0;border-radius:0;box-shadow:none;background:transparent}body.preview .viewport{padding:0}body.preview .slide{width:100%;min-height:100vh}body.preview .card{border-radius:20px;box-shadow:none;min-height:100vh}body.preview .head{padding-top:20px}body.preview .body{font-size:17px}
</style>
</head>
<body>
<div class="wrap">
 <div class="top"><div><h1>CPC M01 — Mapa Mental</h1><p>Fixar → revisar → consultar → responder questões</p></div><div class="spacer"></div><button class="ghost" onclick="go(0)">↺ Início</button><button onclick="downloadCurrent()">⬇ Baixar</button></div>
 <div class="stage" id="stage">
  <button class="nav prev" onclick="move(-1)">‹</button>
  <div class="viewport" id="viewport"></div>
  <button class="nav next" onclick="move(1)">›</button>
 </div>
 <div class="foot">
   <div class="info"><b id="label">1 — Visão Geral</b><small>Arraste para o lado no celular ou use as setas.</small></div>
   <div class="progress"><i id="bar"></i></div><div class="dots" id="dots"></div>
   <div class="actions"><button class="ghost" onclick="move(-1)">Anterior</button><button onclick="move(1)">Próximo</button></div>
 </div>
</div>
<script>
const DATA=[
{c:'c1',n:1,t:'Visão Geral',i:'🎯',items:['Conjunto de normas que regem o processo civil.','Define fontes, aplicação das normas e regras de direito intertemporal.','Estabelece princípios fundamentais que orientam todo o CPC.','Serve de base para interpretação e aplicação das normas processuais.'],box:['Regra de bolso','O CPC deve ser interpretado de forma sistemática, considerando seus princípios e finalidades.']},
{c:'c2',n:2,t:'Fundamento Legal',i:'📄',items:['Art. 1º → aplicação conforme a Constituição.','Art. 2º → processo começa por iniciativa da parte.','Art. 3º → não se excluirá da apreciação jurisdicional ameaça ou lesão a direito.','Arts. 4º a 8º → normas fundamentais.','Arts. 9º a 15 → contraditório, aplicação e direito intertemporal.'],box:['Artigos para lembrar','1º • 2º • 3º • 4º a 8º • 9º a 15']},
{c:'c3',n:3,t:'Princípios Fundamentais',i:'⚖️',items:['Acesso à justiça (art. 3º).','Boa-fé processual (art. 5º).','Cooperação entre os sujeitos (art. 6º).','Duração razoável do processo (art. 4º).','Primazia do julgamento de mérito (arts. 4º e 6º).','Isonomia, contraditório e ampla defesa.','Segurança jurídica e precedentes (arts. 926 e 927).'],box:['Ideia-chave','São princípios que orientam, interpretam e limitam a aplicação de todo o CPC.']},
{c:'c4',n:4,t:'Fontes do Direito Processual',i:'📖',items:['Constituição Federal.','Leis e tratados internacionais.','Normas infralegais compatíveis.','Costumes, quando compatíveis.','Jurisprudência e precedentes.','Doutrina como fonte de interpretação.'],box:['Observação','Hierarquia normativa e compatibilidade constitucional são decisivas na aplicação das fontes.']},
{c:'c5',n:5,t:'Aplicação e Interpretação',i:'⚙️',items:['Interpretação conforme a Constituição (art. 1º).','Observância dos fins sociais e das exigências do bem comum (art. 8º).','Aplicação supletiva e subsidiária aos processos eleitoral, trabalhista e administrativo (art. 15).','Respeito à integridade, coerência e estabilidade da jurisprudência (art. 926).'],box:['Ponto de atenção','Não trate aplicação subsidiária e aplicação supletiva como expressões idênticas.']},
{c:'c6',n:6,t:'Direito Intertemporal',i:'🕘',items:['Regra geral: aplicação imediata da norma processual (art. 14).','A norma processual não retroage para desfazer atos já praticados.','Situações processuais consolidadas são preservadas.','A lei nova alcança os atos futuros do processo em curso.'],box:['Regra de bolso','Lei processual nova → aplicação imediata, com respeito aos atos já praticados.']},
{c:'c7',n:7,t:'Não Confundir',i:'↔️',custom:true},
{c:'c8',n:8,t:'Pegadinhas de Prova',i:'⚠️',items:['Achar que o juiz pode iniciar qualquer processo de ofício.','Confundir fonte formal com doutrina.','Ignorar a primazia do julgamento de mérito.','Aplicar retroativamente norma processual em prejuízo de ato já praticado.','Confundir aplicação subsidiária com supletiva.','Tratar precedentes como mera recomendação quando o CPC impõe observância.'],box:['Cai muito em prova','Princípios, fontes, interpretação e direito intertemporal são temas recorrentes.']},
{c:'c9',n:9,t:'Como Resolver na Questão',i:'🎯',items:['Identifique o tema: fontes, princípios, aplicação ou intertemporalidade.','Localize a regra legal correspondente.','Cheque se existe exceção.','Verifique se há questão de tempo: lei antiga × lei nova.','Compare a alternativa com a literalidade e com os princípios fundamentais.','Elimine absolutismos incompatíveis com o CPC.'],box:['Algoritmo','TEMA → REGRA → EXCEÇÃO → TEMPO → EFEITO → ALTERNATIVA']},
{c:'c10',n:10,t:'Checklist Final',i:'✅',items:['Processo começa por iniciativa da parte (art. 2º).','Acesso à jurisdição (art. 3º).','Boa-fé, cooperação, duração razoável e mérito.','Interpretação conforme a Constituição.','Aplicação imediata da norma processual (art. 14).','Respeito aos atos já praticados.','Aplicação supletiva e subsidiária (art. 15).','Precedentes e coerência jurisprudencial (arts. 926 e 927).'],box:['Mini macete','FONTES → PRINCÍPIOS → APLICAÇÃO → INTERTEMPORAL → PRECEDENTES']}
];
let idx=0;
const qs=new URLSearchParams(location.search),preview=qs.get('preview')==='1';if(preview)document.body.classList.add('preview');
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function cardHtml(d){
 let inner='';
 if(d.custom){
  inner='<div class="body"><div class="cols">'+
  '<div class="mini"><b>Fontes × princípios</b><p>Fontes indicam de onde vem a norma. Princípios orientam interpretação e aplicação.</p></div>'+
  '<div class="mini"><b>Lei processual × material</b><p>Processual: aplicação imediata aos atos futuros. Material: segue regime próprio de vigência e retroatividade.</p></div>'+
  '<div class="mini"><b>Imediata × retroativa</b><p>Aplicação imediata não significa desfazer atos processuais validamente praticados.</p></div>'+
  '<div class="mini"><b>Regra × exceção</b><p>Na prova, procure palavras absolutas antes de marcar a alternativa.</p></div>'+
  '</div><div class="box"><b>Não confundir</b><span class="flow">NORMA NOVA → ATOS FUTUROS · ATOS PASSADOS → PRESERVADOS</span></div></div>';
 }else{
  inner='<div class="body"><ul>'+d.items.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'+
  (d.box?'<div class="box"><b>'+esc(d.box[0])+'</b>'+esc(d.box[1])+'</div>':'')+'</div>';
 }
 return '<article class="card hero-card '+d.c+'" id="capture"><div class="head"><span class="num">'+d.n+'</span><span class="title">'+esc(d.t)+'</span><span class="icon">'+d.i+'</span></div>'+inner+'</article>';
}
function fullHtml(){
 return '<div class="full-poster" id="capture">'+DATA.map(d=>'<div class="mini-card '+d.c+'"><b>'+d.n+' — '+esc(d.t)+'</b><span>'+(d.items?esc(d.items.slice(0,3).join(' • ')):'Fontes × princípios • lei nova × atos passados • aplicação imediata × retroatividade')+'</span></div>').join('')+'<div class="mini-card c10" style="grid-column:1/-1"><b>MINI MACETE</b><span>FONTES → PRINCÍPIOS → APLICAÇÃO → INTERTEMPORAL → PRECEDENTES</span></div></div>';
}
function render(){
 const host=document.getElementById('viewport');
 host.innerHTML='<div class="slide active">'+(idx<DATA.length?cardHtml(DATA[idx]):fullHtml())+'</div>';
 document.getElementById('label').textContent=idx<DATA.length?(DATA[idx].n+' — '+DATA[idx].t):'Mapa completo — CPC M01';
 document.getElementById('bar').style.width=((idx+1)/(DATA.length+1)*100)+'%';
 [...document.querySelectorAll('.dot')].forEach((d,i)=>d.classList.toggle('on',i===idx));
 if(preview&&idx!==0){idx=0;render()}
}
function move(n){idx=(idx+n+DATA.length+1)%(DATA.length+1);render()}
function go(n){idx=n;render()}
const dots=document.getElementById('dots');for(let i=0;i<DATA.length+1;i++){const d=document.createElement('span');d.className='dot';d.onclick=()=>{idx=i;render()};dots.appendChild(d)}
let sx=0,sy=0;document.getElementById('stage').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});document.getElementById('stage').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.2)move(dx<0?1:-1)},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});
async function downloadCurrent(){
 const node=document.getElementById('capture');if(!node)return;
 const rect=node.getBoundingClientRect(),w=Math.ceil(rect.width),h=Math.ceil(rect.height);
 const css=[...document.styleSheets].map(s=>{try{return [...s.cssRules].map(r=>r.cssText).join('')}catch(_){return''}}).join('');
 const clone=node.cloneNode(true),svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml"><style>'+css+'</style>'+clone.outerHTML+'</div></foreignObject></svg>';
 const blob=new Blob([svg],{type:'image/svg+xml'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(idx<DATA.length?'CPC_M01_CARD_'+String(idx+1).padStart(2,'0'):'CPC_M01_MAPA_COMPLETO')+'.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);
}
render();
</script>
</body></html>
